# Controles locaux : format, lint, secrets, anonymisation avant chaque
# commit ; format du message au stade commit-msg ; tests au push.
#
# Installation : uv sync && uv run pre-commit install
#
# Prerequis : uv. Les hooks ruff et pytest passent par `uv run` pour
# utiliser les versions figees dans uv.lock ; sans uv, ils echouent.
#
# Chaque `rev` est une empreinte de commit (jamais une etiquette
# mouvante), mise a jour par : uv run pre-commit autoupdate --freeze

default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: fix-byte-order-marker
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main, --branch, develop]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/kynan/nbstripout
    rev: f5da19ce3b7b40e97c12ee9cd8ce97f48f97ddf7  # frozen: 0.9.1
    hooks:
      - id: nbstripout

  - repo: local
    hooks:
      # Motifs generiques ici ; motifs personnels dans un fichier hors
      # depot (voir l'en-tete du script). Pas de filtre de type : les
      # binaires sont verifies aussi. `verbose` rend visible
      # l'avertissement quand aucun motif personnel n'est configure.
      - id: check-anonymity
        name: anonymisation
        entry: python scripts/check_anonymity.py
        language: python
        verbose: true
        require_serial: true
      - id: check-anonymity-msg
        name: anonymisation du message de commit
        entry: python scripts/check_anonymity.py --commit-msg
        language: python
        stages: [commit-msg]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 3db014c16a9d31997ab8c07a4d61fcce936c8f0d  # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: ascii-subject
        name: sujet de commit sans accent
        entry: '\A[^\n]*[^\x00-\x7F]'
        language: pygrep
        args: [--multiline]
        stages: [commit-msg]

      - id: pytest
        name: pytest
        entry: uv run --frozen pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
