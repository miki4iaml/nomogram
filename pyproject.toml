[project]
name = "nomogram"
version = "0.1.0"
description = "management of scientific formula repositories"
readme = "README.md"
authors = [
    { name = "miki4ia", email = "miki4ia@gmail.com" }
]
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = []

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
