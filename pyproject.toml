[project]
name = "nomogram"
version = "0.1.0"
description = "Repository of scientific formulas: notations, units, validity domains"
readme = "README.md"
authors = [
    { name = "miki4ia", email = "miki4ia@gmail.com" }
]
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = [
    "scientific computing",
    "formulas",
    "units",
    "dimensional analysis",
    "physics",
    "thermodynamics",
    "geoscience",
    "atmospheric science",
    "meteorology",
    "hydrology",
    "psychrometrics",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/miki4iaml/nomogram"
Repository = "https://github.com/miki4iaml/nomogram"
Issues = "https://github.com/miki4iaml/nomogram/issues"
Changelog = "https://github.com/miki4iaml/nomogram/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
