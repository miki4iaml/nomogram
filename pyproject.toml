[project]
name = "nomogram"
version = "0.3.0"
description = "Repository of scientific formulas: notations, units, validity domains"
readme = "README.md"
authors = [
    { name = "miki4ia", email = "miki4ia@gmail.com" }
]
requires-python = ">=3.12"
license = "BSD-3-Clause AND CC-BY-4.0 AND CC0-1.0"
license-files = ["LICENSE", "src/nomogram/data/NOTICE.md"]
keywords = [
    "scientific computing",
    "formulas",
    "units",
    "dimensional analysis",
    "physics",
    "thermodynamics",
    "geoscience",
    "atmospheric science",
    "meteorology",
    "hydrology",
    "psychrometrics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0",
    "pint>=0.24.4",
    "sympy>=1.13",
]

[project.urls]
Homepage = "https://github.com/miki4iaml/nomogram"
Repository = "https://github.com/miki4iaml/nomogram"
Issues = "https://github.com/miki4iaml/nomogram/issues"
Changelog = "https://github.com/miki4iaml/nomogram/blob/main/CHANGELOG.md"

[project.optional-dependencies]
viz = [
    "matplotlib>=3.10.7",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "codespell>=2.4.3",
    "coverage>=7.16.2",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "rdflib>=7.6",
    "ruff>=0.16.9",
    "zizmor>=1.30.1",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts", "docs/examples"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# SymPy and mpmath ship no type information (no py.typed marker).
module = ["sympy", "sympy.*", "mpmath", "mpmath.*"]
ignore_missing_imports = true

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
strict = true
filterwarnings = ["error"]
addopts = ["-ra", "--showlocals"]
log_level = "INFO"

[tool.coverage.run]
branch = true
# Explicit: the hook script is loaded from its path by importlib.
source = ["src/nomogram", "scripts"]
# Same paths on Windows and Linux, so that Codecov can merge reports.
relative_files = true

[tool.coverage.report]
# Floor, not target: the actual rate is visible in reports and Codecov.
fail_under = 80
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[tool.ruff.lint]
# On top of ruff's default selection, which Dependabot bumps surface in CI.
extend-select = ["ARG", "B", "C4", "PIE", "PT", "PTH", "RET", "T20"]

[tool.ruff.lint.per-file-ignores]
# Fixtures requested for their side effects look like unused arguments.
"tests/**" = ["ARG001"]
# The hook is a command-line tool: printing is its output.
"scripts/**" = ["T20"]

[tool.codespell]
skip = "*.fr.md,uv.lock"
# Format terms: the Flate filter of PDF, the ALPH chunk of WebP.
ignore-words-list = "flate,alph"

[tool.repo-review.ignore]
PC110 = "ruff format runs as a local hook through uv run --frozen (single version source: uv.lock)"
PC140 = "mypy runs as a local hook through uv run --frozen (single version source: uv.lock)"
PC160 = "codespell runs as a local hook through uv run --frozen (single version source: uv.lock)"
PC190 = "ruff check runs as a local hook through uv run --frozen (single version source: uv.lock)"
SEC001 = "zizmor runs as a local hook through uv run --frozen (single version source: uv.lock)"
PC901 = "pre-commit.ci is not used; CI replays the hooks itself"
PC902 = "pre-commit.ci is not used; CI replays the hooks itself"
PC903 = "pre-commit.ci is not used; CI replays the hooks itself"
PC180 = "no markdown formatter, by choice (dependency control, hand-written texts)"
PY007 = "uv run is the task runner, identical on every OS"
PY004 = "temporary: documentation (Sphinx, Read the Docs) not started yet"
PC170 = "temporary: no reStructuredText until the documentation exists"
