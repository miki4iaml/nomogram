equation = "11"
notation = { p_0 = '\mathrm{p}_{\mathrm{msl}}', p_s = '\mathrm{p}_{\mathrm{s}}', Phi_s = '\Phi_{\mathrm{s}}', T_s = 'T_*', g_n = "g" }
units = { Gamma = "K-PER-M" }
assumptions = ["A dry hydrostatic atmosphere below the surface, of uniform lapse rate."]

[formulations.ecmwf_temperature_below_ground]
label = "Temperature below the surface, third-order expansion (ECMWF, FULL-POS)"
expression = "T_s * (1 + Gamma * R_d / g_n * ln(p / p_s) + (Gamma * R_d / g_n * ln(p / p_s))**2 / 2 + (Gamma * R_d / g_n * ln(p / p_s))**3 / 6)"
fixed_units = false
