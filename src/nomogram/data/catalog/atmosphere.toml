year = 2012
title = "Commission Implementing Regulation (EU) No 923/2012 laying down the common rules of the air (SERA), Article 2: Definitions"
container = "EASA, Easy Access Rules for Standardised European Rules of the Air (SERA), revision of August 2025"
url = "https://www.easa.europa.eu/en/downloads/68174/en"
status = "verified"
note = "Article 2 read in the consolidated text: points 39 (altitude, measured from mean sea level), 78 (flight level, a surface of constant atmospheric pressure related to the pressure datum 1013.2 hPa), 84 (height, measured from a specified datum), 101 (pressure-altitude, an atmospheric pressure expressed in terms of the altitude that corresponds to it in the Standard Atmosphere of Annex 8 to the Chicago Convention) and 134 (transition altitude). The regulation takes over the ICAO definitions, whose Annexes are not freely available; WMO-No. 49, Volume II, which reproduced them, was abrogated at the end of 2023."

[references.wmo2024_vol3]
