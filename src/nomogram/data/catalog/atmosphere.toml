equation = "12"
notation = { p_0 = '\mathrm{p}_{\mathrm{msl}}', p_s = '\mathrm{p}_{\mathrm{s}}', Phi_s = '\Phi_{\mathrm{s}}', T_s = 'T_*', g_n = "g" }
units = { Gamma = "K-PER-M" }
note = "Written with alpha = 0.0065 R_d / g, the approximation of equation 11 for small alpha."

# The exact forms these approximate, and the extrapolation under the
# surface. In a dry hydrostatic atmosphere of constant lapse rate Gamma,
# T = T_s (p/p_s)^alpha with alpha = Gamma R_d / g (Trenberth et al. 1993,
# 9 to 11); ECMWF uses the expansions to the third order (12, 15, 16), as
# does FULL-POS, whose documentation prints log(Pi_s/Pi_L) in its
# equations 3 and 6, where the physics and Trenberth et al. give ln(p/p_s).

[formulations.ecmwf_mean_sea_level_pressure_exact]
label = "Mean sea level pressure through a constant lapse rate, exact form (ECMWF, Trenberth et al. 1993)"
expression = "p_s * (1 + Gamma * Phi_s / (g_n * T_s))**(g_n / (Gamma * R_d))"
fixed_units = false
note = "Equation 11, p_s (1 + alpha Phi_s / (R_d T_s))^(1/alpha) with alpha = Gamma R_d / g: the pressure at sea level of a dry hydrostatic column below the surface whose temperature increases downwards by Gamma."
output = { identifier = "p_0", kind = "SeaLevelPressure", unit = "PA", description = "Mean sea level pressure" }
inputs = [
  { identifier = "p_s", kind = "SurfaceAirPressure", unit = "PA", description = "Surface pressure" },
  { identifier = "Phi_s", kind = "Geopotential", unit = "M2-PER-SEC2", description = "Surface geopotential" },
  { identifier = "T_s", kind = "ThermodynamicTemperature", unit = "K", description = "Surface temperature" },
]
coefficients = { Gamma = 0.0065 }
constants = ["R_d_ecmwf_ifs", "g_n_cgpm1901"]
keywords = ["sea level pressure", "reduction", "ECMWF"]

[[formulations.ecmwf_mean_sea_level_pressure_exact.citations]]
