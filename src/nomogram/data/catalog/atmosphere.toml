]
constants = ["g_n_cgpm1901", "M_0_ussa1976", "R_star_ussa1976"]
keywords = ["barometric formula", "standard atmosphere", "isothermal"]

[[formulations.ussa1976_pressure_layer_isothermal.citations]]
