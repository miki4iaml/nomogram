inputs = [
  { identifier = "P_b", kind = "Pressure", unit = "PA", description = "Pressure at the base of the layer" },
  { identifier = "T_b", kind = "ThermodynamicTemperature", unit = "K", description = "Molecular-scale temperature of the layer" },
