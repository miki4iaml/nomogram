# The hydrostatic atmosphere: the thickness of a layer from its mean
# virtual temperature (WMO, IFS), the pressure through a layer whose
# temperature varies linearly or not at all (U.S. Standard Atmosphere,
# its general form), the reduction of a station pressure to sea level
# (WMO), the dry adiabatic gradient (Bechtold).

[formulations.wmo_hypsometric_pressure]
label = "Pressure at the top of a layer, from its thickness and mean virtual temperature (WMO Guide)"
expression = "p_1 * exp(-g_n * dZ / (R * T_v))"
fixed_units = false
note = "Equation 12.17, ln(p_{i+1}/p_i) = -9.80665 dZ/(R* T_v), solved for the upper pressure: GPS radiosondes compute their pressures so, upwards from the surface pressure. The source calls R* the gas constant for dry air without giving its value; WMO-No. 8 gives 287.05 J kg-1 K-1 in 3.7.2."
output = { identifier = "p_2", kind = "Pressure", unit = "HectoPA", description = "Pressure at the top of the layer" }
inputs = [
  { identifier = "p_1", kind = "Pressure", unit = "HectoPA", description = "Pressure at the bottom of the layer" },
  { identifier = "dZ", kind = "GeopotentialThickness", unit = "M", description = "Thickness of the layer in geopotential height" },
  { identifier = "T_v", kind = "VirtualTemperature", unit = "K", description = "Mean virtual temperature of the layer" },
]
constants = ["g_n_cgpm1901", "R_d_wmo2024"]
keywords = ["hypsometric equation", "thickness", "radiosonde"]

[[formulations.wmo_hypsometric_pressure.citations]]
reference = "wmo2024"
equation = "12.17"
notation = { p_1 = "p_i", p_2 = "p_{i+1}", dZ = '\mathrm{d}Z', R = "R^*" }
assumptions = ["The hydrostatic relationship, in a discrete form, with the mean virtual temperature of the layer."]

[formulations.ecmwf_ifs_hypsometric_geopotential]
label = "Geopotential at the top of a layer, from the pressures and the mean virtual temperature (IFS)"
expression = "Phi_1 + R_d * T_v * ln(p_1 / p_2)"
fixed_units = false
note = "Equation 2.20, the discrete analogue of the hydrostatic equation 2.6 between two half levels, phi_{k+1/2} - phi_{k-1/2} = -R_dry (T_v)_k ln(p_{k+1/2}/p_{k-1/2}), half level k+1/2 being the lower one; written here from the lower level to the upper one. The same numbering in CY41R2 (ERA5) and CY50R1."
output = { identifier = "Phi_2", kind = "Geopotential", unit = "M2-PER-SEC2", description = "Geopotential at the top of the layer" }
inputs = [
  { identifier = "Phi_1", kind = "Geopotential", unit = "M2-PER-SEC2", description = "Geopotential at the bottom of the layer" },
  { identifier = "p_1", kind = "Pressure", unit = "PA", description = "Pressure at the bottom of the layer" },
  { identifier = "p_2", kind = "Pressure", unit = "PA", description = "Pressure at the top of the layer" },
  { identifier = "T_v", kind = "VirtualTemperature", unit = "K", description = "Virtual temperature of the layer" },
]
constants = ["R_d_ecmwf_ifs"]
keywords = ["hypsometric equation", "geopotential", "IFS"]

[[formulations.ecmwf_ifs_hypsometric_geopotential.citations]]
reference = "ecmwf_ifs_cy49r1_part3"
equation = "2.20"
notation = { Phi_1 = '\phi_{k+1/2}', Phi_2 = '\phi_{k-1/2}', p_1 = "p_{k+1/2}", p_2 = "p_{k-1/2}", T_v = '(T_{\mathrm{v}})_k', R_d = '\mathrm{R}_{\mathrm{dry}}' }
assumptions = ["The hydrostatic equation (2.6), with the virtual temperature of the layer."]

[formulations.ussa1976_pressure_layer_gradient]
label = "Pressure in a layer of constant temperature gradient (U.S. Standard Atmosphere 1976)"
expression = "P_b * (T_b / (T_b + L * (H - H_b)))**(g_n * M_0 / (R_star * L))"
fixed_units = false
note = "Equation 33a, for a layer whose molecular-scale temperature varies linearly with the geopotential height. The molecular-scale temperature T M0/M equals the temperature below 80 km; in moist air, it is the virtual temperature. Equation 33b holds when the gradient is zero."
conditions = "A gradient L different from zero."
output = { identifier = "P", kind = "Pressure", unit = "PA", description = "Pressure at the geopotential height" }
inputs = [
  { identifier = "P_b", kind = "Pressure", unit = "PA", description = "Pressure at the base of the layer" },
  { identifier = "T_b", kind = "ThermodynamicTemperature", unit = "K", description = "Molecular-scale temperature at the base of the layer" },
  { identifier = "L", kind = "VerticalTemperatureGradient", unit = "K-PER-M", description = "Gradient of the molecular-scale temperature with geopotential height" },
  { identifier = "H", kind = "GeopotentialHeight", unit = "M", description = "Geopotential height" },
  { identifier = "H_b", kind = "GeopotentialHeight", unit = "M", description = "Geopotential height of the base of the layer" },
]
constants = ["g_n_cgpm1901", "M_0_ussa1976", "R_star_ussa1976"]
keywords = ["barometric formula", "standard atmosphere", "lapse rate"]

[[formulations.ussa1976_pressure_layer_gradient.citations]]
reference = "ussa1976"
