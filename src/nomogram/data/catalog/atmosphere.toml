notation = { T_b = '\mathrm{T}_{M,b}', L = '\mathrm{L}_{M,b}', g_n = "g_0'", R_star = "R^*" }
assumptions = ["The hydrostatic equation (5), with g dZ replaced by g0' dH (16) and M/T by M0/T_M (22).", "A constant gradient of the molecular-scale temperature through the layer."]

