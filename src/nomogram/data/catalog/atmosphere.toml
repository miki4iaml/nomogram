# --- Formulations -----------------------------------------------------

# Heights: an altitude z is above the geoid (about the mean sea level), a
# height h above the surface; h = z - z_s needs the altitude z_s of the
# surface, which nomogram never computes (it comes from a terrain model).

[formulations.height_above_surface]
label = "Height above the surface"
expression = "z - z_s"
fixed_units = false
note = "Definition (CF: height is the vertical distance above the surface). The altitude of the surface comes from a terrain model, outside nomogram."
output = { identifier = "h", kind = "Height", unit = "KiloM", description = "Height above the surface" }
inputs = [
  { identifier = "z", kind = "Altitude", unit = "KiloM", description = "Altitude" },
  { identifier = "z_s", kind = "SurfaceAltitude", unit = "KiloM", description = "Altitude of the surface" },
]

# Geopotential height and geometric height. WMO defines the geopotential
# height from the geopotential and the normal gravity at 45 degrees; the
# conversions from a geometric height differ by their Earth's radius:
# 6356.766 km in the U.S. Standard Atmosphere (ITU-R P.835), 6371.229 km
# in the IFS (ERA5), a radius and a normal gravity depending on the
# latitude in WMO-No. 8.

[formulations.geopotential_height_definition]
label = "Geopotential height, from the geopotential"
nature = "definition"
expression = "Phi / g_n"
fixed_units = false
note = "The geopotential divided by the standard acceleration of free fall (CF). WMO divides by the normal gravity at 45 degrees latitude, taken in the definition as 9.80665 m s-2 (equation 12.12); ERA5 by 9.80665 m s-2, 'a fixed value in the IFS'."
output = { identifier = "Z", kind = "GeopotentialHeight", unit = "M", description = "Geopotential height" }
inputs = [
  { identifier = "Phi", kind = "Geopotential", unit = "M2-PER-SEC2", description = "Geopotential" },
]
constants = ["g_n_cgpm1901"]
keywords = ["geopotential", "geopotential height"]

[[formulations.geopotential_height_definition.citations]]
reference = "wmo2024"
equation = "12.12"
notation = { Z = "Z_1", Phi = '\Phi_1', g_n = '\gamma_{45}' }

[[formulations.geopotential_height_definition.citations]]
reference = "era5_documentation"
notation = { Z = "h", Phi = "z" }

[formulations.itu_r_p835_geopotential_height]
label = "Geopotential height from the geometric altitude, U.S. Standard Atmosphere 1976 (ITU-R P.835)"
expression = "r_0 * z / (r_0 + z)"
fixed_units = true
note = "The conversion adopted by the U.S. Standard Atmosphere, 1976, with its radius 6356.766 km, which ITU-R P.835 uses to compute its reference atmosphere at a geometric height."
output = { identifier = "Z", kind = "GeopotentialHeight", unit = "KiloM", description = "Geopotential height" }
inputs = [
  { identifier = "z", kind = "Altitude", unit = "KiloM", description = "Geometric altitude" },
]
coefficients = { r_0 = 6356.766 }
keywords = ["geopotential height", "standard atmosphere"]

[[formulations.itu_r_p835_geopotential_height.citations]]
reference = "itu_r_p835_7"
equation = "1a"
notation = { Z = "H", z = "Z" }

[formulations.itu_r_p835_geometric_altitude]
label = "Geometric altitude from the geopotential height, U.S. Standard Atmosphere 1976 (ITU-R P.835)"
expression = "r_0 * Z / (r_0 - Z)"
fixed_units = true
note = "The inverse of equation 1a, printed by the source."
output = { identifier = "z", kind = "Altitude", unit = "KiloM", description = "Geometric altitude" }
inputs = [
  { identifier = "Z", kind = "GeopotentialHeight", unit = "KiloM", description = "Geopotential height" },
]
coefficients = { r_0 = 6356.766 }
keywords = ["geopotential height", "standard atmosphere"]

[[formulations.itu_r_p835_geometric_altitude.citations]]
reference = "itu_r_p835_7"
equation = "1b"
notation = { Z = "H", z = "Z" }

[formulations.era5_geometric_altitude]
label = "Geometric altitude from the geopotential height, spherical Earth of the IFS (ERA5)"
expression = "R_e * Z / (R_e - Z)"
fixed_units = true
note = "ERA5's approximation, neglecting horizontal variations of gravity, relative to the geoid. R_e = 6371.229 km is the radius of the spherical Earth the IFS assumes, given in the data documentation; the page on heights names it without a value. The form of ITU-R P.835 equation 1b, with another radius."
output = { identifier = "z", kind = "Altitude", unit = "KiloM", description = "Geometric altitude" }
inputs = [
  { identifier = "Z", kind = "GeopotentialHeight", unit = "KiloM", description = "Geopotential height" },
]
coefficients = { R_e = 6371.229 }
keywords = ["geopotential height", "ERA5", "IFS"]

[[formulations.era5_geometric_altitude.citations]]
reference = "era5_documentation"
notation = { z = '\mathrm{alt}', Z = "h", R_e = '\mathrm{Re}' }

[formulations.wmo_geopotential_height_from_normal_gravity]
label = "Geopotential height from the geometric height, a normal gravity and an effective radius (WMO Guide)"
expression = "gamma / g_n * R * z / (R + z)"
fixed_units = false
note = "The form of equations 12.13 and 12.15, for a GPS radiosonde: 12.13 with the normal gravity gamma_SMT of 12.14 and the effective radius R_SMT tabulated in the Smithsonian tables (List, 1968); 12.15 (Mahoney, on WGS 84) with gamma_s of 12.16 and the radius R given with it. The conversion depends on gravity alone, not on the temperature and humidity profile."
output = { identifier = "Z", kind = "GeopotentialHeight", unit = "KiloM", description = "Geopotential height" }
inputs = [
  { identifier = "z", kind = "Altitude", unit = "KiloM", description = "Geometric height above the geoid" },
