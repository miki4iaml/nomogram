[formulations.wmo_sea_level_pressure]
label = "Pressure reduced to sea level, exponential form (WMO Guide)"
expression = "p_s * exp(g_n * H_p / (R * (T_s + a * H_p / 2 + e_s * C_h)))"
fixed_units = true
