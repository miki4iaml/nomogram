url = "https://cfconventions.org/Data/cf-standard-names/95/src/cf-standard-name-table.xml"
status = "verified"
note = "Definitions read in the XML table: altitude (the geometric height above the geoid), height (above the surface), surface_altitude, geopotential, geopotential_height (the geopotential divided by the standard acceleration due to gravity), atmosphere_layer_thickness_expressed_as_geopotential_height_difference, air_temperature_lapse_rate (the negative derivative with respect to height), surface_air_pressure, air_pressure_at_mean_sea_level, height_above_reference_ellipsoid and geoid_height_above_reference_ellipsoid."

