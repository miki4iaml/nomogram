inputs = [
  { identifier = "p", kind = "Pressure", unit = "HectoPA", description = "Target pressure" },
  { identifier = "p_1", kind = "Pressure", unit = "HectoPA", description = "Pressure of the first level" },
  { identifier = "p_2", kind = "Pressure", unit = "HectoPA", description = "Pressure of the second level" },
  { identifier = "u_1", kind = "Velocity", unit = "M-PER-SEC", description = "Wind component at the first level" },
  { identifier = "u_2", kind = "Velocity", unit = "M-PER-SEC", description = "Wind component at the second level" },
]
