# Interpolation between two levels: each scheme is a formulation, cited by
# every source that uses it, so that schemes compare like any other
# formulations. The post-processing of ARPEGE and the IFS (FULL-POS)
# chooses the scheme by variable; MetPy and earthkit-meteo leave it to the
# user, linear in the coordinate or in its logarithm.

[formulations.log_pressure_interpolation_wind]
label = "Wind component between two levels, linear in the logarithm of the pressure"
expression = "u_1 + (u_2 - u_1) * ln(p / p_1) / ln(p_2 / p_1)"
fixed_units = false
note = "FULL-POS interpolates the wind so in the lower layers (quadratically above with the ECMWF option) and keeps it constant below the lowest level; MetPy (log_interpolate_1d) and earthkit-meteo (interpolate_monotonic, interpolation='log') interpolate any variable so."
output = { identifier = "u", kind = "Velocity", unit = "M-PER-SEC", description = "Wind component at the target pressure" }
inputs = [
  { identifier = "p", kind = "Pressure", unit = "HectoPA", description = "Target pressure" },
  { identifier = "p_1", kind = "Pressure", unit = "HectoPA", description = "Pressure of the first level" },
  { identifier = "p_2", kind = "Pressure", unit = "HectoPA", description = "Pressure of the second level" },
  { identifier = "u_1", kind = "Velocity", unit = "M-PER-SEC", description = "Wind component at the first level" },
  { identifier = "u_2", kind = "Velocity", unit = "M-PER-SEC", description = "Wind component at the second level" },
]
keywords = ["vertical interpolation", "wind", "logarithm of pressure"]

