#
# Vertical coordinates of the atmosphere: altitude and height, the
# surface, geopotential and geopotential height, pressure altitude,
# ellipsoidal heights; the pressures that go with them; temperature
# gradients and lapse rates. Each kind is defined after a text in force:
# CF standard names, WMO-No. 8 (2024), the IFS documentation, and for
# aviation the SERA regulation, which takes over the ICAO definitions.
# Hand-written, validated when loaded by nomogram.catalog. Entries whose
# details were not checked against the source carry status = "to-confirm".

[catalog]
name = "atmosphere"
label = "Vertical coordinates of the atmosphere"
format = 2
requires = ["moist-air"]
keywords = ["vertical coordinate", "altitude", "height", "geopotential", "pressure altitude", "lapse rate"]

