[formulations.wmo_sea_level_pressure]
label = "Pressure reduced to sea level, exponential form (WMO Guide)"
expression = "p_s * exp(g_n * H_p / (R * (T_s + a * H_p / 2 + e_s * C_h)))"
fixed_units = true
note = "Equation 3.2, the exponential form of equation 3.1 (WMO, 1964). T_s + a H_p/2 + e_s C_h is the mean virtual temperature of a fictitious column of air below the station, with an assumed gradient a; C_h e_s accounts for the humidity."
conditions = "Stations below 750 m (WMO-No. 8, 3.7.2)."
output = { identifier = "p_0", kind = "SeaLevelPressure", unit = "HectoPA", description = "Pressure reduced to sea level" }
inputs = [
  { identifier = "p_s", kind = "SurfaceAirPressure", unit = "HectoPA", description = "Station pressure" },
  { identifier = "H_p", kind = "GeopotentialHeight", unit = "M", description = "Station elevation, in geopotential metres" },
  { identifier = "T_s", kind = "ThermodynamicTemperature", unit = "K", description = "Station temperature" },
  { identifier = "e_s", kind = "VapourPressure", unit = "HectoPA", description = "Vapour pressure at the station" },
]
coefficients = { a = 0.0065, C_h = 0.12 }
constants = ["g_n_cgpm1901", "R_d_wmo2024"]
keywords = ["sea level pressure", "reduction", "station pressure"]

[[formulations.wmo_sea_level_pressure.citations]]
reference = "wmo2024"
equation = "3.2"
notation = { p_0 = "p_0", p_s = "p_S", H_p = "H_p", T_s = "T_S", e_s = "e_S", C_h = "C_h" }
assumptions = ["A fictitious column of air from sea level to the station, of assumed gradient a = 0.0065 K/gpm."]

[formulations.wmo_sea_level_pressure_log10]
label = "Pressure reduced to sea level, decimal form (WMO Guide)"
expression = "p_s * 10**(K_p * H_p / (T_s + a * H_p / 2 + e_s * C_h))"
fixed_units = true
note = "Equation 3.1, log10(p_0/p_s) = K_p H_p / T_mv, from WMO (1964), p. 22, equation 2. Its K_p = 0.0148275 K/gpm differs from g_n / (R ln 10) = 0.014837 K/gpm, with R = 287.05 J kg-1 K-1, by 6.4 x 10^-4: the two forms the source calls the same formula differ by that much in the exponent."
conditions = "Stations below 750 m (WMO-No. 8, 3.7.2)."
output = { identifier = "p_0", kind = "SeaLevelPressure", unit = "HectoPA", description = "Pressure reduced to sea level" }
inputs = [
  { identifier = "p_s", kind = "SurfaceAirPressure", unit = "HectoPA", description = "Station pressure" },
  { identifier = "H_p", kind = "GeopotentialHeight", unit = "M", description = "Station elevation, in geopotential metres" },
  { identifier = "T_s", kind = "ThermodynamicTemperature", unit = "K", description = "Station temperature" },
  { identifier = "e_s", kind = "VapourPressure", unit = "HectoPA", description = "Vapour pressure at the station" },
]
coefficients = { K_p = 0.0148275, a = 0.0065, C_h = 0.12 }
keywords = ["sea level pressure", "reduction", "station pressure"]

[[formulations.wmo_sea_level_pressure_log10.citations]]
