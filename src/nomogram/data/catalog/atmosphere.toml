# source gives no value of R, c_p and g: those of Bechtold (2015) are taken.

[formulations.potential_temperature_interpolation_pressure]
label = "Pressure of an isentropic level between two levels, linear in the potential temperature"
expression = "p_1 + (theta - theta_1) * (p_2 - p_1) / (theta_2 - theta_1)"
