# --- Quantity kinds ---------------------------------------------------

# Altitude and height are QUDT kinds (CF: above the geoid, above the
# surface). A geopotential height must not feed an altitude input, nor an
# ellipsoidal height: the first differs from it by 25 m at 8 km, the
# second by the geoid height, tens of metres.

[kinds.SurfaceAltitude]
label = "Surface Altitude"
specialization_of = "Altitude"
description = "Altitude of the surface of the Earth, the lower boundary of the atmosphere (CF). The elevation of a WMO station is the altitude of the ground beneath its raingauge or its thermometer screen (WMO-No. 8, Volume I, 1.3.3.2)."
cf_standard_names = [{ name = "surface_altitude", relation = "exact", verified = 2026-10-26 }]

[kinds.Geopotential]
label = "Geopotential"
specialization_of = "SpecificEnergy"
scale_type = "interval"
description = "Sum of the specific gravitational potential energy relative to the geoid and the specific centripetal potential energy (CF); the IFS defines it by the hydrostatic equation (Part III, equation 2.6). Its zero is the geoid, about the mean sea level: an interval scale."
matches = [
  { target = "http://www.wikidata.org/entity/Q1423347", relation = "close", verified = 2026-10-28 },
]
cf_standard_names = [{ name = "geopotential", relation = "exact", verified = 2026-10-28 }]

[kinds.GeopotentialHeight]
label = "Geopotential Height"
specialization_of = "Length"
scale_type = "interval"
description = "Geopotential divided by the standard acceleration of free fall, 9.80665 m s-2 (CF; WMO-No. 8, Volume I, equation 12.12). Numerically close to the altitude, not to the height above the surface (CF), but never equal to it: 25 m apart at 8 km, 220 m at 32 km (WMO-No. 8, Volume I, table 12.10). WMO writes it in standard geopotential metres, 0.980665 dynamic metre; nomogram in metres, the kind carrying the meaning."
matches = [
  { target = "http://www.wikidata.org/entity/Q12432978", relation = "close", verified = 2026-10-28 },
]
cf_standard_names = [{ name = "geopotential_height", relation = "exact", verified = 2026-10-28 }]

[kinds.GeopotentialThickness]
label = "Geopotential Thickness"
specialization_of = "Length"
description = "Difference of geopotential height between two levels of the atmosphere (CF): the thickness of a layer, which the hypsometric equation gives."
cf_standard_names = [{ name = "atmosphere_layer_thickness_expressed_as_geopotential_height_difference", relation = "exact", verified = 2026-10-28 }]

[kinds.PressureAltitude]
label = "Pressure Altitude"
specialization_of = "GeopotentialHeight"
scale_type = "interval"
description = "An atmospheric pressure expressed in terms of the altitude that corresponds to it in the standard atmosphere (SERA, Article 2, point 101): a geopotential height of the standard atmosphere, not of the actual one. Flight levels are surfaces of constant pressure related to 1013.2 hPa (point 78)."
matches = [
  { target = "http://www.wikidata.org/entity/Q17130615", relation = "close", verified = 2026-10-28 },
]

[kinds.EllipsoidalHeight]
label = "Ellipsoidal Height"
specialization_of = "Length"
scale_type = "interval"
description = "Height above a reference ellipsoid (CF), as satellite positioning gives it. It differs from the altitude by about the geoid height, tens of metres: it never feeds an altitude input."
cf_standard_names = [{ name = "height_above_reference_ellipsoid", relation = "exact", verified = 2026-10-28 }]

[kinds.GeoidHeight]
label = "Geoid Height"
specialization_of = "Length"
description = "Height of the geoid above a reference ellipsoid (CF), the geoid undulation N, positive or negative; the ellipsoidal height of a point is about its altitude plus N."
cf_standard_names = [{ name = "geoid_height_above_reference_ellipsoid", relation = "exact", verified = 2026-10-28 }]

[kinds.GeodeticLatitude]
label = "Geodetic Latitude"
specialization_of = "PlaneAngle"
description = "Angle between the equatorial plane and the normal to the reference ellipsoid, positive northward; the latitude of the normal gravity formulas (WMO-No. 8, Volume I, 12.5.5.2). In radians where sin or cos take it."
matches = [
  { target = "http://www.wikidata.org/entity/Q34027", relation = "broad", verified = 2026-10-28 },
]
cf_standard_names = [{ name = "latitude", relation = "broad", verified = 2026-10-28 }]

# Temperature gradients: CF's lapse rate is -dT/dz, the gradient of the
# standard atmosphere's layers dT/dz. Siblings, so that one never feeds an
# input of the other: their signs are opposite.

[kinds.LapseRate]
label = "Lapse Rate of Air Temperature"
specialization_of = "TemperatureGradient"
description = "Negative derivative of the air temperature with respect to height, -dT/dz (CF): positive when the temperature decreases upwards. A temperature difference per length; never fed by a vertical temperature gradient, of opposite sign."
matches = [
  { target = "http://www.wikidata.org/entity/Q66900467", relation = "close", verified = 2026-10-28 },
]
cf_standard_names = [{ name = "air_temperature_lapse_rate", relation = "exact", verified = 2026-10-28 }]

[kinds.VerticalTemperatureGradient]
label = "Vertical Gradient of Air Temperature"
specialization_of = "TemperatureGradient"
description = "Derivative of the air temperature with respect to height, dT/dz: negative when the temperature decreases upwards, as the layers of a standard atmosphere write it. Never fed by a lapse rate, of opposite sign."

# Pressures of the surface and of the sea level; the altimeter settings
# of aviation, which go through the standard atmosphere.

[kinds.SurfaceAirPressure]
label = "Surface Air Pressure"
specialization_of = "Pressure"
description = "Air pressure at the lower boundary of the atmosphere (CF): the surface pressure of models. A station reports its pressure at an elevation specified apart (WMO-No. 8, Volume I, 1.3.3.2)."
cf_standard_names = [{ name = "surface_air_pressure", relation = "exact", verified = 2026-10-28 }]

[kinds.SeaLevelPressure]
label = "Air Pressure at Mean Sea Level"
specialization_of = "Pressure"
description = "Air pressure reduced to mean sea level (MSLP, PMSL; CF), through a fictitious column of air below the station (WMO-No. 8, Volume I, 3.7). Not the QNH, which the standard atmosphere gives (Volume III, 2.9.1)."
cf_standard_names = [{ name = "air_pressure_at_mean_sea_level", relation = "exact", verified = 2026-10-28 }]

[kinds.AltimeterSetting]
label = "Altimeter Setting (QNH)"
specialization_of = "Pressure"
description = "QNH: the pressure at which an aircraft altimeter is set so that it indicates the official elevation of the aerodrome when on the ground there, computed from the QFE through the standard atmosphere (WMO-No. 8, Volume III, 2.9.1)."
matches = [
  { target = "http://www.wikidata.org/entity/Q21938048", relation = "close", verified = 2026-10-28 },
]

[kinds.AerodromePressure]
label = "Aerodrome Pressure (QFE)"
specialization_of = "Pressure"
description = "QFE: the pressure at the official elevation of the aerodrome (WMO-No. 8, Volume III, 2.9.1)."
matches = [
  { target = "http://www.wikidata.org/entity/Q12717817", relation = "close", verified = 2026-10-28 },
]

