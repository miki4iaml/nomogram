# --- Formulations ---------------------------------------------------------

[formulations.sonntag1990]
label = "Magnus form, Sonntag (1990) coefficients"
expression = "C * exp(A * t / (B + t))"
fixed_units = true
references = ["sonntag1990", "wmo2024"]
note = "Coefficients adopted by the WMO guide."
output = { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "HectoPA", description = "Saturation vapour pressure over water" }
inputs = [
  { identifier = "t", kind = "CelsiusTemperature", unit = "DEG_C", description = "Celsius temperature" },
]
coefficients = { A = 17.62, B = 243.12, C = 6.112 }

[[formulations.sonntag1990.domains]]
basis = "stated"
bounds = { t = [-45.0, 60.0] }
criterion = "Uncertainty within 0.6 % (k=2), as quoted by the WMO guide."
reference = "wmo2024"

[formulations.mass_concentration_ideal_gas]
label = "Mass concentration of water vapour, ideal gas law"
expression = "RH * e_s / (R_v * T)"
fixed_units = false
references = ["iapws95"]
note = "Water vapour treated as an ideal gas; e_s must be taken at the temperature T."
output = { identifier = "rho_v", kind = "MassConcentrationOfWaterVapour", unit = "KiloGM-PER-M3", description = "Mass concentration of water vapour (absolute humidity, meteorological sense)" }
inputs = [
  { identifier = "RH", kind = "RelativeHumidity", unit = "UNITLESS", description = "Relative humidity" },
  { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "PA", description = "Saturation vapour pressure over water at T" },
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Thermodynamic temperature" },
]
constants = ["R_v_iapws95"]
