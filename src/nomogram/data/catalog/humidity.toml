# --- Formulations ---------------------------------------------------------

[formulations.sonntag1990_magnus]
label = "Magnus form, Sonntag (1990) coefficients"
expression = "C * exp(A * t / (B + t))"
fixed_units = true
references = ["sonntag1990", "wmo2024", "alduchov_eskridge1996"]
note = "Coefficients adopted by the WMO guide and quoted as SA90 by Alduchov and Eskridge (1996, Table II), who find a maximum relative error of 0.597 % against GG46, WE76 and SO90 between -40 and 50 degC (Table III). Not to be confused with Sonntag's own formulation (sonntag1990)."
output = { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "HectoPA", description = "Saturation vapour pressure over water" }
inputs = [
  { identifier = "t", kind = "CelsiusTemperature", unit = "DEG_C", description = "Celsius temperature", temperature_scale = "its90", scale_basis = "stated" },
]
coefficients = { A = 17.62, B = 243.12, C = 6.112 }

[[formulations.sonntag1990_magnus.domains]]
basis = "stated"
bounds = { t = [-45.0, 60.0] }
criterion = "Uncertainty within 0.6 % (k=2), as quoted by the WMO guide."
reference = "wmo2024"

[formulations.mass_concentration_ideal_gas]
label = "Mass concentration of water vapour, ideal gas law"
expression = "RH * e_s / (R_v * T)"
fixed_units = false
references = ["iapws95"]
note = "Water vapour treated as an ideal gas; e_s must be taken at the temperature T."
output = { identifier = "rho_v", kind = "MassConcentrationOfWaterVapour", unit = "KiloGM-PER-M3", description = "Mass concentration of water vapour (absolute humidity, meteorological sense)" }
inputs = [
  { identifier = "RH", kind = "RelativeHumidity", unit = "UNITLESS", description = "Relative humidity" },
  { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "PA", description = "Saturation vapour pressure over water at T" },
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Thermodynamic temperature" },
]
constants = ["R_v_iapws95"]

[formulations.iapws_sr1_86]
label = "IAPWS SR1-86(1992), Wagner and Pruß equation"
expression = "p_c * exp(T_c / T * (a1 * (1 - T / T_c) + a2 * (1 - T / T_c) ** 1.5 + a3 * (1 - T / T_c) ** 3 + a4 * (1 - T / T_c) ** 3.5 + a5 * (1 - T / T_c) ** 4 + a6 * (1 - T / T_c) ** 7.5))"
fixed_units = true
references = ["iapws_sr1_86", "wagner_pruss1993"]
note = "Reference formulation for comparisons. Reproduces Table 1 of the release: 611.657 Pa at 273.16 K, 101325 Pa at 373.1243 K."
output = { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "PA", description = "Saturation vapour pressure over water" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Thermodynamic temperature (ITS-90)", temperature_scale = "its90", scale_basis = "stated" },
]

[formulations.iapws_sr1_86.coefficients]
T_c = { value = 647.096, unit = "K", note = "Critical temperature" }
p_c = { value = 22.064e6, unit = "PA", note = "Critical pressure" }
a1 = -7.85951783
a2 = 1.84408259
a3 = -11.7866497
a4 = 22.6807411
a5 = -15.9618719
a6 = 1.80122502

[[formulations.iapws_sr1_86.domains]]
basis = "stated"
bounds = { T = [273.16, 647.096] }
criterion = "Vapour-liquid equilibrium from the triple point to the critical point, endorsed by IAPWS (section 6)."
reference = "iapws_sr1_86"

[formulations.sonntag1990]
label = "Sonntag (1990) formulation over water (SO90)"
expression = "exp(a0 / T + a1 + a2 * T + a3 * T ** 2 + a4 * ln(T))"
fixed_units = true
references = ["sonntag1990", "alduchov_eskridge1996", "voemel_vp"]
note = "As quoted by Alduchov and Eskridge (1996, equation 7); T on ITS-90. Vömel gives the same coefficients under Sonntag (1994): the year differs between secondary sources. Range not read in the original."
output = { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "HectoPA", description = "Saturation vapour pressure over water" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Thermodynamic temperature (ITS-90)", temperature_scale = "its90", scale_basis = "stated" },
]
coefficients = { a0 = -6096.9385, a1 = 16.635794, a2 = -2.711193e-2, a3 = 1.673952e-5, a4 = 2.433502 }

[formulations.alduchov_eskridge1996]
label = "Magnus form, Alduchov and Eskridge (1996) AEKR coefficients"
expression = "C * exp(A * t / (B + t))"
fixed_units = true
references = ["alduchov_eskridge1996"]
note = "Fitted to three formulations on different temperature scales (GG46, WE76, SO90): no scale is assigned."
output = { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "HectoPA", description = "Saturation vapour pressure over water" }
inputs = [
  { identifier = "t", kind = "CelsiusTemperature", unit = "DEG_C", description = "Celsius temperature" },
]
coefficients = { A = 17.625, B = 243.04, C = 6.1094 }

[[formulations.alduchov_eskridge1996.domains]]
basis = "stated"
bounds = { t = [-40.0, 50.0] }
criterion = "Maximum relative error 0.384 % against GG46, WE76 and SO90 (Table III)."
reference = "alduchov_eskridge1996"

[formulations.tetens1930]
label = "Tetens (1930), as quoted by Alduchov and Eskridge (1996)"
expression = "C * 10 ** (A * t / (B + t))"
fixed_units = true
references = ["tetens1930", "alduchov_eskridge1996"]
note = "Base-10 form (TE30). Maximum relative error 3.214 % against GG46, WE76 and SO90 between -40 and 50 degC (Alduchov and Eskridge 1996, Table III). The constant C differs between secondary sources (see the reference)."
output = { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "HectoPA", description = "Saturation vapour pressure over water" }
inputs = [
  { identifier = "t", kind = "CelsiusTemperature", unit = "DEG_C", description = "Celsius temperature" },
]
coefficients = { A = 7.5, B = 237.3, C = 6.11 }

[formulations.buck1981_magnus]
label = "Magnus form, Buck (1981) coefficients (BU81)"
expression = "C * exp(A * t / (B + t))"
fixed_units = true
references = ["buck1981", "alduchov_eskridge1996", "voemel_vp"]
note = "Maximum relative error 1.458 % against GG46, WE76 and SO90 between -40 and 50 degC (Alduchov and Eskridge 1996, Table III)."
output = { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "HectoPA", description = "Saturation vapour pressure over water" }
inputs = [
  { identifier = "t", kind = "CelsiusTemperature", unit = "DEG_C", description = "Celsius temperature", temperature_scale = "ipts68", scale_basis = "inferred-from-date" },
]
coefficients = { A = 17.502, B = 240.97, C = 6.1121 }

[formulations.buck1981]
label = "Buck (1981) equation (BU-2)"
expression = "C * exp(t * (A - t / D) / (t + B))"
fixed_units = true
references = ["buck1981", "alduchov_eskridge1996"]
note = "Maximum relative error 0.493 % against GG46, WE76 and SO90 between -40 and 50 degC (Alduchov and Eskridge 1996, Table III)."
output = { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "HectoPA", description = "Saturation vapour pressure over water" }
inputs = [
  { identifier = "t", kind = "CelsiusTemperature", unit = "DEG_C", description = "Celsius temperature", temperature_scale = "ipts68", scale_basis = "inferred-from-date" },
]
coefficients = { A = 18.729, B = 257.87, C = 6.1121, D = 227.3 }

[formulations.hyland_wexler1983]
label = "Hyland and Wexler (1983) formulation over water"
expression = "exp(C8 / T + C9 + C10 * T + C11 * T ** 2 + C12 * T ** 3 + C13 * ln(T))"
fixed_units = true
references = ["hyland_wexler1983", "ashrae2017", "psychrolib", "voemel_vp"]
note = "ASHRAE Handbook - Fundamentals (2017), chapter 1, equation 6, through PsychroLib; same coefficients in Vömel. Range not read in the original. Temperature scale ITS-90, inferred from numbers: published in 1983 (IPTS-68 era), but these coefficients agree with IAPWS (ITS-90) within 0.022 % from 0 to 100 degC without conversion and drift to 0.09 % with the IPTS-68 conversion, which suggests ASHRAE moved them to ITS-90; to confirm in ASHRAE."
output = { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "PA", description = "Saturation vapour pressure over water" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Thermodynamic temperature", temperature_scale = "its90", scale_basis = "inferred-from-numbers" },
]
coefficients = { C8 = -5.8002206e3, C9 = 1.3914993, C10 = -4.8640239e-2, C11 = 4.1764768e-5, C12 = -1.4452093e-8, C13 = 6.5459673 }

[formulations.bolton1980]
label = "Magnus form, Bolton (1980) coefficients"
expression = "C * exp(A * t / (t + B))"
fixed_units = true
references = ["bolton1980", "voemel_vp"]
output = { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "HectoPA", description = "Saturation vapour pressure over water" }
inputs = [
  { identifier = "t", kind = "CelsiusTemperature", unit = "DEG_C", description = "Celsius temperature", temperature_scale = "ipts68", scale_basis = "inferred-from-date" },
]
coefficients = { A = 17.67, B = 243.5, C = 6.112 }

[formulations.murray1967]
label = "Magnus-Tetens form, Murray (1967)"
expression = "C * exp(A * (T - T_0) / (T - B))"
fixed_units = true
references = ["murray1967", "voemel_vp"]
note = "Written in kelvin with an offset of 273.16 K (the triple point), not 273.15 K: at the triple point it gives C exactly."
output = { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "HectoPA", description = "Saturation vapour pressure over water" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Thermodynamic temperature" },
]

[formulations.murray1967.coefficients]
A = 17.269388
B = { value = 35.86, unit = "K" }
C = { value = 6.1078, unit = "HectoPA" }
T_0 = { value = 273.16, unit = "K", note = "Triple point of water" }

[formulations.buck1996]
label = "Buck (1996) equation"
expression = "C * exp((A - t / D) * t / (B + t))"
fixed_units = true
references = ["buck1996", "voemel_vp"]
note = "Update of the Buck (1981) equation (buck1981), with different coefficients."
output = { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "HectoPA", description = "Saturation vapour pressure over water" }
inputs = [
  { identifier = "t", kind = "CelsiusTemperature", unit = "DEG_C", description = "Celsius temperature", temperature_scale = "its90", scale_basis = "inferred-from-date" },
]
coefficients = { A = 18.678, B = 257.14, C = 6.1121, D = 234.5 }

[formulations.goff_gratch1946]
label = "Goff-Gratch equation over water (Smithsonian Tables form)"
expression = "10 ** (a1 * (T_s / T - 1) + a2 * log10(T_s / T) + a3 * (10 ** (a4 * (1 - T / T_s)) - 1) + a5 * (10 ** (a6 * (T_s / T - 1)) - 1) + log10(e_st))"
fixed_units = true
references = ["goff_gratch1946", "smithsonian1984", "voemel_vp"]
note = "Referred to the steam point T_s = 373.16 K (as in Vömel and in Alduchov and Eskridge 1996, who call the original paper GG45). Generally considered the reference equation in meteorology (Vömel)."
output = { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "HectoPA", description = "Saturation vapour pressure over water" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Thermodynamic temperature" },
]

[formulations.goff_gratch1946.coefficients]
a1 = -7.90298
a2 = 5.02808
a3 = -1.3816e-7
a4 = 11.344
a5 = 8.1328e-3
a6 = -3.49149
T_s = { value = 373.16, unit = "K", note = "Steam point" }
e_st = { value = 1013.246, unit = "HectoPA", note = "Saturation pressure at the steam point" }

[[formulations.goff_gratch1946.domains]]
basis = "stated"
bounds = { T = [223.15, 375.15] }
criterion = "-50 to 102 degC, range of the equation over liquid water according to Gibbins (1990), as quoted by Vömel."
reference = "gibbins1990"

[formulations.goff1957]
label = "Goff (1957) equation over water, triple point form (WMO)"
expression = "10 ** (b1 * (1 - T_1 / T) + b2 * log10(T / T_1) + b3 * (1 - 10 ** (b4 * (T / T_1 - 1))) + b5 * (10 ** (b6 * (1 - T_1 / T)) - 1) + b7)"
fixed_units = true
references = ["goff1957", "voemel_vp", "alduchov_eskridge1996"]
note = "Attribution differs between secondary sources: Vömel calls it Goff (1957), recommended by WMO; Alduchov and Eskridge (1996, equation 3) call it GG46 (Goff and Gratch 1946), recommended by WMO in 1966, and write ln where the numbers require log10."
output = { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "HectoPA", description = "Saturation vapour pressure over water" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Thermodynamic temperature" },
]

[formulations.goff1957.coefficients]
b1 = 10.79574
b2 = -5.02800
b3 = 1.50475e-4
b4 = -8.2969
b5 = 0.42873e-3
b6 = 4.76955
b7 = 0.78614
T_1 = { value = 273.16, unit = "K", note = "Triple point of water" }

[formulations.vapour_pressure_from_relative_humidity]
label = "Vapour pressure from relative humidity"
expression = "RH * e_s"
fixed_units = false
note = "Relative humidity taken as e/e_s, its usual approximation in meteorology; definitions through mole fractions or mixing ratios differ slightly (source to read before stating which one a standard uses)."
output = { identifier = "e", kind = "VapourPressure", unit = "PA", description = "Vapour pressure" }
inputs = [
  { identifier = "RH", kind = "RelativeHumidity", unit = "UNITLESS", description = "Relative humidity" },
  { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "PA", description = "Saturation vapour pressure over water at the same temperature" },
]

[formulations.mixing_ratio_from_vapour_pressure]
label = "Humidity mixing ratio from vapour pressure (ASHRAE 2017)"
expression = "epsilon * e / (p - e)"
fixed_units = false
references = ["ashrae2017", "psychrolib"]
note = "ASHRAE Handbook - Fundamentals (2017), chapter 1, equation 20, through PsychroLib: moist air as an ideal gas mixture."
output = { identifier = "r", kind = "MassRatioOfWaterVapourToDryGas", unit = "KiloGM-PER-KiloGM", description = "Humidity mixing ratio" }
inputs = [
  { identifier = "e", kind = "VapourPressure", unit = "PA", description = "Vapour pressure" },
  { identifier = "p", kind = "Pressure", unit = "PA", description = "Air pressure" },
]
constants = ["epsilon_ashrae2017"]

[formulations.specific_humidity_from_mixing_ratio]
label = "Specific humidity from mixing ratio"
expression = "r / (1 + r)"
fixed_units = false
references = ["ashrae2017", "psychrolib"]
note = "From the definitions (mass of water vapour per mass of moist air, per mass of dry air); ASHRAE Handbook - Fundamentals (2017), chapter 1, equation 9b, through PsychroLib."
output = { identifier = "q", kind = "SpecificHumidity", unit = "KiloGM-PER-KiloGM", description = "Specific humidity" }
inputs = [
  { identifier = "r", kind = "MassRatioOfWaterVapourToDryGas", unit = "KiloGM-PER-KiloGM", description = "Humidity mixing ratio" },
]
