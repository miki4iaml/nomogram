#
# Shared ground of the catalog: conventional reference scales, notation
# conventions and the references they cite.
# Hand-written, validated when loaded by nomogram.catalog. Entries whose
# details were not checked against the source carry status = "to-confirm".

[catalog]
name = "core"
label = "Core: scales and notations"
format = 2
requires = []
keywords = ["conventional reference scales", "notations"]

# --- References -------------------------------------------------------

[references.preston_thomas1990]
authors = "Preston-Thomas, H."
year = 1990
title = "The International Temperature Scale of 1990 (ITS-90)"
container = "Metrologia 27, 3-10"
doi = "10.1088/0026-1394/27/1/002"
status = "to-confirm"
note = "Text and Table 6 (differences between ITS-90 and IPTS-68) read in a copy of the text, not in the journal; DOI not checked."

[references.wmo2024]
authors = "World Meteorological Organization"
year = 2024
title = "Guide to Instruments and Methods of Observation (WMO-No. 8), Volume I, Annex 4.B"
doi = "10.59327/WMO/CIMO/1"
status = "to-confirm"
note = "Primary text not read; formula and range cross-checked with WMO training material. Notation e_w to confirm in the text."

[references.ashrae2017]
authors = "ASHRAE"
year = 2017
title = "ASHRAE Handbook - Fundamentals, chapter 1: Psychrometrics"
status = "to-confirm"
note = "Cited through the tests of PsychroLib; notation p_ws to confirm in the text."

# --- Notations --------------------------------------------------------

[notations.wmo]
label = "WMO Guide to Instruments and Methods of Observation"
symbols = { e_s = 'e_{\mathrm{w}}', rho_v = '\rho_{\mathrm{v}}' }
reference = "wmo2024"

[notations.ashrae]
label = "ASHRAE Handbook - Fundamentals"
symbols = { e_s = 'p_{\mathrm{ws}}', RH = '\phi' }
reference = "ashrae2017"

# --- Conventional reference scales (VIM 1.29) -------------------------

[scales.its90]
label = "International Temperature Scale of 1990 (ITS-90)"
symbol = "ITS-90"
subscript = "90"
kinds = ["ThermodynamicTemperature", "CelsiusTemperature", "DewPointTemperature"]
reference = "preston_thomas1990"

[scales.ipts68]
label = "International Practical Temperature Scale of 1968 (IPTS-68)"
symbol = "IPTS-68"
subscript = "68"
kinds = ["ThermodynamicTemperature", "CelsiusTemperature", "DewPointTemperature"]
reference_scale = "its90"
unit = "DEG_C"
reference = "preston_thomas1990"
