# --- Conventional reference scales (VIM 1.29) -------------------------

[scales.its90]
label = "International Temperature Scale of 1990 (ITS-90)"
symbol = "ITS-90"
subscript = "90"
kinds = ["Temperature", "ThermodynamicTemperature", "CelsiusTemperature", "DewPointTemperature"]
reference = "preston_thomas1990"

[scales.ipts68_saunders1990]
label = "IPTS-68 through the linear conversion of Saunders (1990)"
kinds = ["Temperature", "ThermodynamicTemperature", "CelsiusTemperature", "DewPointTemperature"]
reference_scale = "its90"
unit = "DEG_C"
conversion = "x / 1.00024"
bounds = [-2.0, 40.0]
symbol = "IPTS-68"
subscript = "68"
reference = "saunders1990"
note = "t68 = 1.00024 t90, the conversion oceanographic algorithms (PSS-78, EOS-80) take; TEOS-10 (eq. A.1.2) recommends it for -2 to 40 degC, within 1 mK of the official conversion. Saunders tabulates -10 to 40 degC and names -2 to 35 degC; Sea-Bird gives -2 to 35 degC."

[scales.ipts48]
label = "International Practical Temperature Scale of 1948 (IPTS-48), oceanographic conversion"
kinds = ["Temperature", "ThermodynamicTemperature", "CelsiusTemperature", "DewPointTemperature"]
reference_scale = "its90"
base = "ipts68"
unit = "DEG_C"
conversion = "x - 4.4e-6 * x * (100 - x)"
bounds = [-2.0, 30.0]
symbol = "IPTS-48"
subscript = "48"
reference = "fofonoff_bryden1975"
note = "t68 from t48, then IPTS-68 to ITS-90. Fofonoff and Bryden build the conversion over -2 to 30 degC: above t48 = 30 degC (t90 about 29.98 degC) it is undefined, and a formulation on this scale gives NaN under the default evaluation, inside its stated domain for Weiss and Price (1980, up to 313 K); scale='ignore' evaluates the formula as written, IPTS-48 being about 16 mK above ITS-90 near 30 degC. Bennett (1976, quoted by Perkin and Lewis 1980) and Douglas (1969) give other formulas, within 0.5 mK. Temperatures before IPTS-48 (hydrogen thermometer of Knudsen 1902, Witting 1908): ICES calls their conversion uncertain, the TEOS-10 Manual (A.1) points to published conversions of obsolete scales; nomogram holds none."

[scales.ipts68]
label = "International Practical Temperature Scale of 1968 (IPTS-68)"
symbol = "IPTS-68"
subscript = "68"
kinds = ["Temperature", "ThermodynamicTemperature", "CelsiusTemperature", "DewPointTemperature"]
reference_scale = "its90"
unit = "DEG_C"
reference = "preston_thomas1990"
