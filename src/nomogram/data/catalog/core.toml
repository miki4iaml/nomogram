#
# Shared ground of the catalog: conventional reference scales, notation
# conventions, the defining constants of the SI and constants derived
# from them, and the references they cite.
# Hand-written, validated when loaded by nomogram.catalog. Entries whose
# details were not checked against the source carry status = "to-confirm".

[catalog]
name = "core"
label = "Core: scales, notations and constants"
format = 2
requires = []
keywords = ["conventional reference scales", "notations", "physical constants"]

# --- References -------------------------------------------------------

[references.preston_thomas1990]
authors = "Preston-Thomas, H."
year = 1990
title = "The International Temperature Scale of 1990 (ITS-90)"
container = "Metrologia 27, 3-10"
doi = "10.1088/0026-1394/27/1/002"
status = "to-confirm"
note = "Text and Table 6 (differences between ITS-90 and IPTS-68) read in a copy of the text, not in the journal; DOI not checked."

[references.saunders1990]
authors = "Saunders, P. M."
year = 1990
title = "The International Temperature Scale of 1990, ITS-90"
container = "WOCE Newsletter 10, p. 10, WOCE International Project Office"
url = "https://web.archive.org/web/20170228105749/https://www.nodc.noaa.gov/woce/wdiu/wocedocs/newsltr/news10/news10.pdf"
status = "verified"
note = "Read in an archived copy: t68 = 1.00024 t90 as the first executable statement of the UNESCO algorithms; t90 = 0.99976 t68 adequate over -10 to 40 degC, range of interest -2 to 35 degC; no accuracy stated."

[references.teos10_manual]
authors = "IOC, SCOR and IAPSO"
year = 2010
title = "The international thermodynamic equation of seawater - 2010: Calculation and use of thermodynamic properties"
container = "Intergovernmental Oceanographic Commission, Manuals and Guides No. 56, UNESCO"
url = "https://www.teos-10.org/pubs/TEOS-10_Manual.pdf"
status = "verified"
note = "Read: eq. 2.1.1 and A.1.2 (Saunders conversion, -2 to 40 degC), 2.4.1 and A.3.3 (Reference Salinity, 2 < S_P < 42), A.3.4 (Knudsen), A.4 (historical data)."

[references.fofonoff_bryden1975]
authors = "Fofonoff, N. P.; Bryden, H."
year = 1975
title = "Specific gravity and density of seawater at atmospheric pressure"
container = "Journal of Marine Research 33 (Supplement), 69-82"
url = "https://elischolar.library.yale.edu/journal_of_marine_research/1336"
status = "verified"
note = "p. 71: T68 = T - 4.4e-6 T (100 - T), built from the difference between T48 and T68 over -2 to 30 degC; no correction for earlier scale changes. Read on the page image of an archived copy."

[references.wmo2024]
authors = "World Meteorological Organization"
year = 2024
title = "Guide to Instruments and Methods of Observation (WMO-No. 8), Volume I"
doi = "10.59327/WMO/CIMO/1"
status = "verified"
note = "Annex 4.A read (2024 edition, pp. 193-195): definitions 4.A.1 to 4.A.21, among them e' = x_v p (4.A.6) and the relative humidities U_w and U_i (4.A.15, 4.A.17), which do not apply when the pressure is below the saturation vapour pressure of the pure phase. Annex 4.B read (pp. 197-198): formulae 4.B.1 (water, -45 to 60 degC) and 4.B.3 (ice, -65 to 0 degC), written e_w(t) and e_i(t); 'sufficiently accurate for all normal meteorological applications', not suitable below -45 degC (water) and -65 degC (ice). No uncertainty is stated for them; the 0.6 % of the annex's note is the pressure dependence of the enhancement factor f(p)."

[references.wmo_etqtc2025]
authors = "World Meteorological Organization, INFCOM SC-MINT Expert Team on Quality, Traceability and Calibration (ET-QTC)"
year = 2025
title = "Calibration of humidity instruments, Part 1: Introduction (training unit)"
url = "https://etrp.wmo.int/pluginfile.php/97653/mod_folder/content/0/Training%20Material/5_1_Humidity%20Part%201%20Introduction.pdf"
status = "verified"
note = "Slide 13 read: the Magnus forms of WMO-No. 8 Annex 4.B with 'uncertainty up to 0.6 %, (k = 2)' over water (-45 to +60 degC) and 'up to 1 %, (k = 2)' over ice (-65 to 0 degC), attributed to the 2023 edition of the guide. The 2024 text of that annex states no uncertainty."

[references.ambaum2020]
authors = "Ambaum, M. H. P."
year = 2020
title = "Accurate, simple equation for saturated vapour pressure over water and ice"
container = "Quarterly Journal of the Royal Meteorological Society 146 (733), 4252-4258"
doi = "10.1002/qj.3899"
url = "https://centaur.reading.ac.uk/93718/"
status = "verified"
note = "Published version, CC BY 4.0, read in the University of Reading repository: R_v = 461.52 J kg-1 K-1 under equation 2 (p. 4253); equations 13 to 16 with the triple-point values of equation 14 (p. 4254); equations 17 to 19, and the latent heat of melting written below equation 20 with the triple-point values of the caption of Figure 4 (p. 4256). Equation 18 gives the latent heat of sublimation without a value of Ls0."


[references.ashrae2017]
authors = "ASHRAE"
year = 2017
title = "ASHRAE Handbook - Fundamentals, chapter 1: Psychrometrics"
status = "to-confirm"
note = "Cited through the tests of PsychroLib; notation p_ws to confirm in the text."

[references.bipm_si9]
authors = "Bureau International des Poids et Mesures"
year = 2019
title = "The International System of Units (SI), 9th edition"
container = "BIPM, version 4.01 (June 2026)"
doi = "10.59161/AUEZ1291"
