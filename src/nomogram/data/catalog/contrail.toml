notation = { T_IC = 'T_\mathrm{IC}', T_IM = 'T_\mathrm{IM}' }

# --- Critical relative humidity ---------------------------------------

[formulations.schumann2012_critical_relative_humidity]
label = "Critical relative humidity of contrail formation (Schumann 2012, after Ponater et al. 2002)"
expression = "(G * (T - T_LM) + p_liq(T=T_LM)) / p_liq(T=T)"
calls = { p_liq = "schumann2012_saturation_vapour_pressure_liquid" }
fixed_units = true
note = "The relative humidity over liquid water at which the mixing line through the ambient air at T touches the saturation vapour pressure curve at T_LM: contrails form where U exceeds it, the threshold temperature at that humidity being T. It avoids solving equation 11 for T_LC. Below T_LM it is at most 1, and negative where even dry air gives contrails; Ponater et al. (2002) write that it 'can range from 0 to 1'."
output = { identifier = "U_LC", kind = "ContrailCriticalRelativeHumidity", unit = "UNITLESS", description = "Critical relative humidity of contrail formation" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Ambient temperature" },
  { identifier = "T_LM", kind = "ContrailMaximumThresholdTemperature", unit = "K", description = "Maximum threshold temperature of contrail formation" },
  { identifier = "G", kind = "MixingLineSlope", unit = "PA-PER-K", description = "Slope of the mixing line" },
]
keywords = ["contrail", "critical relative humidity"]

[[formulations.schumann2012_critical_relative_humidity.domains]]
at_most = { T = "T_LM" }
criterion = "Above T_LM no humidity gives contrails: the tangent of the mixing line meets the saturation curve only above the ambient point."

[[formulations.schumann2012_critical_relative_humidity.citations]]
reference = "schumann2012"
equation = "12"
note = "p. 547: 'Instead of T < T_LC, it requires that the ambient relative humidity U stays above a critical value', with p_liq of Sonntag (1994), A1."
notation = { U_LC = 'U_\mathrm{LC}', T_LM = 'T_\mathrm{LM}' }

[[formulations.schumann2012_critical_relative_humidity.citations]]
reference = "ponater2002"
equation = "8"
note = "p. ACL 2-3, with T_contr from equation 31 of Schumann (1996), their equation 6."
notation = { U_LC = 'r_\mathrm{contr}', T_LM = 'T_\mathrm{contr}' }

[[formulations.schumann2012_critical_relative_humidity.citations.domains]]
at_most = { T = "T_LM" }
criterion = "'No contrails are possible if T > T_contr' (p. ACL 2-3)."

# --- Threshold temperature: fit ---------------------------------------

[formulations.schumann2012_threshold_temperature_fit]
label = "Threshold temperature of contrail formation, explicit fit (Schumann 2012)"
expression = "T_LM - (1 - U) * p_liq(T=T_LM) / G - (x1 + x3 * ln(G)) * U * ((1 - U ** 2) ** x2 - (1 / 4 - (U - 1 / 2) ** 2) ** 4 * (1 - (1 - U ** 2) ** x2))"
calls = { p_liq = "schumann2012_saturation_vapour_pressure_liquid" }
fixed_units = true
note = "Equation A7 of Schumann (2012), exact for U = 0 and U = 1, with the correction Delta T_c of equations A17 to A19, zero at U = 0 and U = 1. It needs one evaluation of the saturation vapour pressure over water at T_LM, p_liq(T_LM), with equation A1. Schumann takes T_LM from equation 31 (equation 10 of Schumann 2012), as the system schumann2012_threshold_temperature does. Against the exact solution of equation A6 with A1 and the exact T_LM, the fit departs by up to 0.18 K near G = 23 Pa/K and U = 0.89, and by up to 0.14 K at G = 0.24 Pa/K (U = 0.88); from 1 to 15 Pa/K, by up to 0.12 K. Figure A2 of Schumann (2012) shows U up to 0.8."
output = { identifier = "T_LC", kind = "ContrailThresholdTemperature", unit = "K", description = "Threshold temperature of contrail formation" }
inputs = [
  { identifier = "T_LM", kind = "ContrailMaximumThresholdTemperature", unit = "K", description = "Maximum threshold temperature of contrail formation" },
  { identifier = "U", kind = "RelativeHumidity", unit = "UNITLESS", description = "Relative humidity of the ambient air over liquid water" },
  { identifier = "G", kind = "MixingLineSlope", unit = "PA-PER-K", description = "Slope of the mixing line" },
]
coefficients = { x1 = 5.686, x2 = 0.3840, x3 = 0.6594 }
keywords = ["contrail", "threshold temperature"]

[[formulations.schumann2012_threshold_temperature_fit.citations]]
reference = "schumann2012"
equation = "A16-A19"
note = "Appendix A5, p. 571."
notation = { T_LC = 'T_\mathrm{LC}', T_LM = 'T_\mathrm{LM}' }
accuracy = "maximum error of 0.13 K"

[[formulations.schumann2012_threshold_temperature_fit.citations.domains]]
bounds = { U = [0.0, 1.0], G = [0.24, 23.0] }
criterion = "The full range 0 <= U <= 1 and 0.24 Pa/K < G < 23 Pa/K, over which the fit has a maximum error of 0.13 K (appendix A5, Fig. A2)."

