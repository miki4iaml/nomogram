[[formulations.schumann1996_threshold_temperature_liquid.citations]]
reference = "schumann2012"
equation = "A6"
notation = { T_LC = 'T_\mathrm{LC}', T_LM = 'T_\mathrm{LM}' }

[formulations.schumann1996_threshold_temperature_ice]
label = "Threshold temperature of contrail formation with respect to ice, exact (Schumann 1996)"
expression = "T_IC == T_IM - (p_ice(T=T_IM) - U * p_liq(T=T_IC)) / G"
calls = { p_ice = "schumann2012_saturation_vapour_pressure_ice", p_liq = "schumann2012_saturation_vapour_pressure_liquid" }
fixed_units = true
note = "The ambient temperature at which the mixing line through the ambient air touches the saturation vapour pressure curve over ice at T_IM (equation 12), U being the relative humidity over liquid water, with A1 and A2 of Schumann (2012). The equation has a root at or below T_IM only where the ambient air at T_IM is not supersaturated with respect to ice, U p_liq(T_IM) <= p_ice(T_IM): there the tangent at T_IM lies below the saturation curve over ice; beyond, it gives NaN, the root above T_IM, which the physical domain leaves out, being no threshold."
output = { identifier = "T_IC", kind = "ContrailThresholdTemperatureWithRespectToIce", unit = "K", description = "Threshold temperature of contrail formation with respect to ice" }
inputs = [
  { identifier = "T_IM", kind = "ContrailMaximumThresholdTemperatureWithRespectToIce", unit = "K", description = "Maximum threshold temperature of contrail formation with respect to ice" },
  { identifier = "U", kind = "RelativeHumidity", unit = "UNITLESS", description = "Relative humidity of the ambient air over liquid water" },
  { identifier = "G", kind = "MixingLineSlope", unit = "PA-PER-K", description = "Slope of the mixing line" },
]
keywords = ["contrail", "threshold temperature", "ice"]

[[formulations.schumann1996_threshold_temperature_ice.domains]]
at_most = { T_IC = "T_IM" }
criterion = "The threshold temperature with respect to ice never exceeds its maximum: the root of equation 12 above T_IM is no threshold."

[[formulations.schumann1996_threshold_temperature_ice.citations]]
