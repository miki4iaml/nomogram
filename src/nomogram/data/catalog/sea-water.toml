#
# Sea water: salinity and chlorinity, their conventional scales (Knudsen,
# Cox, PSS-78, Reference Salinity, Absolute Salinity); the vapour pressure
# of sea water and the salinity effect on the surface humidity.
# Hand-written, validated when loaded by nomogram.catalog. Entries whose
# details were not checked against the source carry status = "to-confirm".

[catalog]
name = "sea-water"
label = "Sea water: salinity and chlorinity"
format = 2
requires = ["moist-air"]
keywords = ["oceanography", "salinity", "sea water", "vapour pressure", "salinity correction", "evaporation duct"]

# --- Quantity kinds ---------------------------------------------------

[kinds.SeaWaterSalinity]
label = "Sea Water Salinity"
specialization_of = "MassFraction"
description = "Mass fraction of dissolved material in sea water, estimated on a conventional scale (Knudsen, Cox, PSS-78, Reference or Absolute Salinity; CF: sea_water_salinity and its precise forms)."

[kinds.Chlorinity]
label = "Chlorinity"
specialization_of = "MassFraction"
description = "Chlorinity of sea water, in per mille: Cl = 0.3285234 Ag, Ag being the mass in grams of atomic-weight silver just necessary to precipitate the halogens in 1 kg of sea water (Jacobsen and Knudsen 1940, p. 8), which replaced the definition of Sorensen (1902)."

[kinds.SaturationVapourPressureOverSeaWater]
label = "Saturation Vapour Pressure over Sea Water"
specialization_of = "VapourPressure"
description = "Pressure of water vapour in equilibrium with a plane surface of sea water (TEOS-10 Manual, eq. 3.37.1); always lower than over pure water at the same temperature."

[kinds.RelativeVapourPressureOfSeaWater]
label = "Relative Vapour Pressure of Sea Water"
specialization_of = "DimensionlessRatio"
description = "Vapour pressure of sea water divided by that of pure water at the same temperature. Close to, but not the same quantity as, the activity of water in sea water (the relative fugacity of sea air, TEOS-10 Manual eq. 3.40.11) and the relative humidity of air in equilibrium with sea water."

[kinds.SaturationSpecificHumidityOverSeaWater]
label = "Saturation Specific Humidity over Sea Water"
specialization_of = "SaturationSpecificHumidity"
description = "Specific humidity of air in equilibrium with a plane surface of sea water: the humidity at the sea surface of bulk flux algorithms."

