# --- Conventional scales ----------------------------------------------

[scales.reference_salinity2008]
label = "Reference-Composition Salinity Scale (Millero et al. 2008)"
kinds = ["SeaWaterSalinity"]
symbol = "Reference Salinity"
subscript = "R"
cf_standard_names = ["sea_water_reference_salinity"]
reference = "teos10_manual"

[scales.pss78]
label = "Practical Salinity Scale 1978 (PSS-78)"
kinds = ["SeaWaterSalinity"]
reference_scale = "reference_salinity2008"
unit = "PERMILLE"
conversion = "35.16504 / 35 * x"
bounds = [2.0, 42.0]
symbol = "PSS-78"
subscript = "P"
cf_standard_names = ["sea_water_practical_salinity"]
reference = "teos10_manual"
note = "S_R = u_PS S_P with u_PS = (35.16504/35) g/kg (TEOS-10 eq. 2.4.1), for 2 < S_P < 42; Practical Salinity is a number, written here in per mille so that S_P = 35 is 35."

[scales.cox1967]
label = "Cox salinity (JPOTS 1966, S = 1.80655 Cl)"
kinds = ["SeaWaterSalinity"]
reference_scale = "reference_salinity2008"
base = "pss78"
unit = "PERMILLE"
conversion = "x"
symbol = "Cox"
subscript = "C"
cf_standard_names = ["sea_water_cox_salinity"]
reference = "teos10_manual"
note = "Taken as Practical Salinity: TEOS-10 (A.4) converts pre-1978 salinities as S_R = u_PS S, and CF writes S_P = S_C. For chlorinity values, Lewis and Perkin (1981) find no true conversion to PSS-78 and recommend a route through R15 (errors unlikely to exceed 0.03)."

[scales.knudsen1901]
label = "Knudsen salinity (Knudsen 1901, S = 0.030 + 1.805 Cl)"
kinds = ["SeaWaterSalinity"]
reference_scale = "reference_salinity2008"
base = "pss78"
unit = "PERMILLE"
conversion = "(x - 0.03) * 1.80655 / 1.805"
symbol = "Knudsen"
subscript = "K"
cf_standard_names = ["sea_water_knudsen_salinity"]
reference = "gsw_sp_from_sk"
note = "Derived by eliminating chlorinity between the Knudsen and Cox relations (GSW, CF), as Feistel (2008, eq. 2.9) does too. TEOS-10 A.4 disagrees: it converts pre-1978 salinities as S_R = u_PS S, without the 0.03 offset. Lewis and Perkin (1981) find Knudsen salinities within 0.001 of PSS-78 for 25 < S < 38."

[scales.absolute_salinity2010]
label = "Absolute Salinity (TEOS-10)"
kinds = ["SeaWaterSalinity"]
reference_scale = "reference_salinity2008"
convertible = false
symbol = "Absolute Salinity"
subscript = "A"
cf_standard_names = ["sea_water_absolute_salinity"]
reference = "teos10_manual"
note = "S_A = S_R + delta S_A, the anomaly depending on the location (TEOS-10 look-up table): nomogram holds no conversion; values on this scale are taken as given."

# --- Formulations -----------------------------------------------------

[formulations.knudsen1901_salinity]
label = "Knudsen salinity from chlorinity (Knudsen 1901)"
expression = "a + b * Cl"
fixed_units = true
note = "On nine samples (Baltic, North Sea, North Atlantic, Red Sea); the offset reflects river-borne salts of the Baltic. JPOTS (1966) calls it the Sorensen equation, from Forch, Knudsen and Sorensen (1902)."
output = { identifier = "S", kind = "SeaWaterSalinity", unit = "PERMILLE", description = "Knudsen salinity" }
inputs = [
  { identifier = "Cl", kind = "Chlorinity", unit = "PERMILLE", description = "Chlorinity" },
]
coefficients = { a = 0.030, b = 1.805 }

[[formulations.knudsen1901_salinity.citations]]
reference = "teos10_manual"
equation = "A.3.4"
scales = { S = "knudsen1901" }

[[formulations.knudsen1901_salinity.citations]]
reference = "knudsen1901"

[formulations.cox_salinity_jpots1966]
label = "Cox salinity from chlorinity (JPOTS 1966)"
expression = "b * Cl"
fixed_units = true
note = "Recommended by JPOTS (1966) rather than the Sorensen equation, S = 0.030 + 1.805 Cl."
output = { identifier = "S", kind = "SeaWaterSalinity", unit = "PERMILLE", description = "Cox salinity" }
inputs = [
  { identifier = "Cl", kind = "Chlorinity", unit = "PERMILLE", description = "Chlorinity" },
]
coefficients = { b = 1.80655 }

[[formulations.cox_salinity_jpots1966.citations]]
reference = "unesco1966_tp4"
scales = { S = "cox1967" }

# The vapour pressure of sea water relative to pure water at the same
# temperature. Sources print it as a ratio, as a relative lowering
# (Robinson), as the inverse ratio (Sharqawy, ITTC) or as a logarithm
# (Nayar); each entry writes the ratio, the printed form in its note.

[formulations.witting1908_vapour_pressure_ratio]
label = "Relative vapour pressure of sea water from chlorinity (Witting 1908)"
expression = "1 - a * Cl"
fixed_units = true
note = "Robinson (1954, p. 452) judges it a good representation of the lowering only near 20 per mille chlorinity."
output = { identifier = "r", kind = "RelativeVapourPressureOfSeaWater", unit = "UNITLESS", description = "Vapour pressure of sea water relative to pure water at the same temperature" }
inputs = [
  { identifier = "Cl", kind = "Chlorinity", unit = "PERMILLE", description = "Chlorinity" },
]
coefficients = { a = 0.000969 }

[[formulations.witting1908_vapour_pressure_ratio.citations]]
reference = "sverdrup1942"
note = "p. 67, written e/e_0, quoting Witting (1908)."
notation = { r = 'e/e_{0}' }

[[formulations.witting1908_vapour_pressure_ratio.citations]]
reference = "robinson1954"
note = "p. 452, written p/p_0, quoting Witting (1908)."
notation = { r = 'p/p_{0}' }

[[formulations.witting1908_vapour_pressure_ratio.citations]]
reference = "witting1908"

[formulations.sverdrup1942_vapour_pressure_ratio]
label = "Relative vapour pressure of sea water from salinity (Sverdrup et al. 1942)"
expression = "1 - a * S"
fixed_units = true
note = "p. 115, e_s = e_d (1 - 0.000537 S), referring to p. 66: Witting's relation written with salinity. 0.000969/1.805 = 0.000537, the factor of Knudsen's relation S = 0.030 + 1.805 Cl (Sverdrup p. 51), its offset dropped: hence the Knudsen scale, inferred from these numbers."
output = { identifier = "r", kind = "RelativeVapourPressureOfSeaWater", unit = "UNITLESS", description = "Vapour pressure of sea water relative to pure water at the same temperature" }
inputs = [
  { identifier = "S", kind = "SeaWaterSalinity", unit = "PERMILLE", description = "Salinity", scale = "knudsen1901", scale_basis = "inferred-from-numbers" },
]
coefficients = { a = 0.000537 }

[[formulations.sverdrup1942_vapour_pressure_ratio.citations]]
reference = "sverdrup1942"
notation = { r = 'e_{s}/e_{d}' }

[formulations.robinson1954_vapour_pressure_ratio]
label = "Relative vapour pressure of sea water from chlorinity (Robinson 1954)"
expression = "1 - (a * Cl + b * Cl ** 2)"
fixed_units = true
note = "Printed as the relative lowering, (p_0 - p)/p_0 = 0.0009206 Cl + 0.00000236 Cl^2, fitted to isopiestic measurements against NaCl solutions at 25 degC on three waters; no measurement at other temperatures."
output = { identifier = "r", kind = "RelativeVapourPressureOfSeaWater", unit = "UNITLESS", description = "Vapour pressure of sea water relative to pure water at 25 degC" }
inputs = [
  { identifier = "Cl", kind = "Chlorinity", unit = "PERMILLE", description = "Chlorinity" },
]
coefficients = { a = 0.0009206, b = 0.00000236 }

[[formulations.robinson1954_vapour_pressure_ratio.citations]]
reference = "robinson1954"
note = "p. 452."

[[formulations.robinson1954_vapour_pressure_ratio.citations.domains]]
bounds = { Cl = [10.0, 22.0] }
criterion = "Isopiestic measurements at 25 degC of sea water of chlorinity between 10 and 22 per mille (summary, p. 454)."

[[formulations.robinson1954_vapour_pressure_ratio.citations]]
reference = "sharqawy2010"
equation = "30"
accuracy = "+/-0.2 % (Sharqawy et al.; Robinson gives no accuracy for this fit)"

[formulations.raoult_sharqawy2010]
label = "Relative vapour pressure of sea water by Raoult's law (Sharqawy et al. 2010)"
expression = "1 / (1 + a * S / (S_0 - S))"
fixed_units = true
note = "Printed as the inverse ratio, p_w/p_sw = 1 + 0.57357 S/(1000 - S). An ideal-solution estimate: at ocean salinity it lowers the vapour pressure about 10 % more than the measurement-based forms (0.9795 against about 0.9813 at S = 35). Sharqawy et al. write S in g/kg with no stated scale; the ITTC writes Absolute Salinity, a scale nomogram cannot convert: evaluate with scale='ignore'."
output = { identifier = "r", kind = "RelativeVapourPressureOfSeaWater", unit = "UNITLESS", description = "Vapour pressure of sea water relative to pure water at the same temperature" }
inputs = [
  { identifier = "S", kind = "SeaWaterSalinity", unit = "GM-PER-KiloGM", description = "Salinity" },
]

[formulations.raoult_sharqawy2010.coefficients]
a = 0.57357
S_0 = { value = 1000.0, note = "One kilogram of sea water, in g/kg" }

[[formulations.raoult_sharqawy2010.citations]]
reference = "sharqawy2010"
equation = "29"
notation = { r = 'p_{v,sw}/p_{v,w}' }

[[formulations.raoult_sharqawy2010.citations]]
reference = "ittc2011"
equation = "6"
scales = { S = "absolute_salinity2010" }
notation = { r = 'p_{v,sw}/p_{v,fw}', S = 'S_{A}' }
note = "Adopted from Sharqawy et al. (p. 3), with Absolute Salinity in place of their S."

[formulations.nayar2016_vapour_pressure_ratio]
label = "Relative vapour pressure of sea water (Nayar et al. 2016)"
expression = "exp(-(a * S + b * S ** 2))"
fixed_units = true
note = "Printed as ln(p_v,sw/p_v,w) = -4.58180e-4 S - 2.04430e-6 S^2, fitted to Grunberg's (1970) natural sea water data, 20 to 180 degC; extrapolated from 0 to 20 degC, where no data exist (maximum uncertainty 0.91 % there, 0.26 % elsewhere)."
output = { identifier = "r", kind = "RelativeVapourPressureOfSeaWater", unit = "UNITLESS", description = "Vapour pressure of sea water relative to pure water at the same temperature" }
inputs = [
  { identifier = "S", kind = "SeaWaterSalinity", unit = "GM-PER-KiloGM", description = "Reference Salinity" },
]
coefficients = { a = 4.58180e-4, b = 2.04430e-6 }

[[formulations.nayar2016_vapour_pressure_ratio.citations]]
reference = "nayar2016"
equation = "5"
scales = { S = "reference_salinity2008" }
accuracy = "+/-0.26 % (0 to 180 degC), +/-0.91 % extrapolated (0 to 20 degC)"
notation = { r = 'p_{v,sw}/p_{v,w}' }

[[formulations.nayar2016_vapour_pressure_ratio.citations.domains]]
bounds = { S = [0.0, 160.0] }
criterion = "Range of validity of eq. 5, Table 2: 0 to 160 g/kg (primary data 0 to 180 degC, extrapolation 0 to 20 degC)."

[formulations.coare36_salinity_factor]
label = "Salinity factor of the surface vapour pressure (COARE 3.6)"
expression = "1 - a * S / S_0"
fixed_units = true
note = "Linear in salinity: 0.98 at 35, the fixed factor of COARE 3.0, and 1 for fresh water (the Great Lakes example of the code)."
output = { identifier = "f_s", kind = "RelativeVapourPressureOfSeaWater", unit = "UNITLESS", description = "Salinity factor of the saturation vapour pressure" }
inputs = [
  { identifier = "S", kind = "SeaWaterSalinity", unit = "PERMILLE", description = "Sea surface salinity" },
]
coefficients = { a = 0.02, S_0 = 35.0 }

[[formulations.coare36_salinity_factor.citations]]
reference = "coare36"
scales = { S = "pss78" }
units = { S_0 = "PERMILLE" }
notation = { f_s = "fs", S = "Ss" }
note = "Function qsat26sea; salinity in PSU."

# Vapour pressures of sea water.

[formulations.millero_leung1976_vapour_pressure]
label = "Vapour pressure of sea water (Millero and Leung 1976)"
expression = "p_0 + (a_0 + a_1 * t + a_2 * t ** 2 + a_3 * t ** 3) * S + (b_0 + b_1 * t + b_2 * t ** 2 + b_3 * t ** 3) * S ** 1.5"
fixed_units = true
note = "Fitted to vapour pressures derived from osmotic coefficients (Table 20), the pure-water values p_0 coming from Ambrose and Lawrenson (1972); std deviation 0.001 mm Hg. Eq. 108 reproduces Table 20 within 0.0015 mm Hg up to 10 degC, then departs from it as the temperature rises: 0.003 mm Hg at 20 degC, up to 0.029 mm Hg (0.05 %) at 40 degC. Sharqawy et al. (eq. 33) print the same coefficients; the erratum of the paper (Am. J. Sci. 278, 1024, 1978) was not read."
output = { identifier = "p", kind = "SaturationVapourPressureOverSeaWater", unit = "MilliM_HG", description = "Vapour pressure of sea water" }
inputs = [
  { identifier = "p_0", kind = "SaturationVapourPressureOverWater", unit = "MilliM_HG", description = "Vapour pressure of pure water" },
  { identifier = "t", kind = "CelsiusTemperature", unit = "DEG_C", description = "Celsius temperature", scale = "ipts68", scale_basis = "inferred-from-date" },
  { identifier = "S", kind = "SeaWaterSalinity", unit = "PERMILLE", description = "Salinity" },
]
coefficients = { a_0 = -2.3311e-3, a_1 = -1.4799e-4, a_2 = -7.520e-6, a_3 = -5.5185e-8, b_0 = -1.1320e-5, b_1 = -8.7086e-6, b_2 = 7.4936e-7, b_3 = -2.6327e-8 }

[[formulations.millero_leung1976_vapour_pressure.citations]]
reference = "millero_leung1976"
equation = "108"
scales = { S = "cox1967" }
notation = { p_0 = 'p_{0}' }

[[formulations.millero_leung1976_vapour_pressure.citations.domains]]
