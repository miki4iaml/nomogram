note = "With the diffusivity ratio alpha_T = 1.35 of the profile equation dT/dZ = T_* phi_T/(alpha_T kappa Z) (equation 8, alpha_T and kappa = 0.35 from p. 23), the function is 1 in neutral conditions. From Businger et al. (1971), phi_h = 0.74 + 4.7 zeta (equation 14, p. 185), 0.74 in neutral conditions: over phi_h(0) = 0.74, 1 + 6.35 zeta (computed by nomogram)."
output = { identifier = "Phi_H", kind = "GradientFunctionForHeat", unit = "UNITLESS", description = "Gradient function for heat" }
inputs = [
  { identifier = "zeta", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter Z/L" },
