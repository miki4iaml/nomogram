  { identifier = "L", kind = "ObukhovLength", unit = "M", description = "Monin-Obukhov length" },
]
coefficients = { c_q = 7.2, c_T = 1.3, k = { value = 0.4, unit = "UNITLESS", unit_basis = "added", note = "Von Karman's constant, a pure number." }, c = { value = 0.125, unit = "PPM-PER-M", unit_basis = "added", note = "The source writes the number alone: as in Fairall et al. (1978), the difference of two gradients of N, in m-1." } }
assumptions = [
  { text = "As in Fairall et al. (1978), 0.125 = 0.157 - 0.032 m-1: the critical gradient for ducting, that of a modified refractivity constant with height for an Earth of radius of about 6370 km (ITU-R P.453, equation 17), and the hydrostatic term of the gradient of N near sea level.", status = "deduced" },
]
keywords = ["evaporation duct height", "implicit equation", "Monin-Obukhov", "Frederickson", "NPS"]

