[formulations.fairall1978_gradient_function_heat_unstable]
label = "Gradient function for heat and moisture, unstable conditions (Fairall et al. 1978)"
expression = "(1 - 19 * zeta) ** (-1 / 3)"
fixed_units = false
note = "With the diffusivity ratio alpha_T = 1.35 of the profile equation dT/dZ = T_* phi_T/(alpha_T kappa Z) (equation 8, alpha_T and kappa = 0.35 from p. 23), the function is 1 in neutral conditions. Fairall et al. attribute their appendix B to Businger et al. (1971), whose unstable forms are phi_h/phi_h(0) = (1 + 4 |zeta|^(3/4))^(-2/3) (equation 11, after Elliott) and (1 - 9 zeta)^(-1/2) (equation 12, Businger-Dyer), with phi_h following zeta^(-1/2) rather than zeta^(-1/3) in very unstable conditions (p. 185)."
output = { identifier = "Phi_H", kind = "GradientFunctionForHeat", unit = "UNITLESS", description = "Gradient function for heat" }
inputs = [
  { identifier = "zeta", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter Z/L" },
]
keywords = ["gradient function", "Monin-Obukhov", "unstable", "Fairall"]

