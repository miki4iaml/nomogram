[formulations.coare36_neutral_drag_coefficient_from_wind]
label = "Neutral drag coefficient at 10 m from the equivalent neutral wind, the fixed point of COARE 3.6"
expression = "k / sqrt(C_DN) == ln(10 / (piecewise((a_1 * U_10N + a_2, U_10N <= U_max), (a_1 * U_max + a_2, U_10N > U_max)) * U_10N**2 * C_DN / g + gamma * nu / (U_10N * sqrt(C_DN))))"
fixed_units = true
note = "The equation the loop of the code converges to: the neutral logarithmic profile at 10 m, U_10N = u_*/k ln(10/z_0), with u_* = U_10N C_DN^(1/2) and the roughness length of Edson et al. (2013, equation 11; coare36_charnock_coefficient, edson2013_roughness_length_momentum). The physical domain keeps the root of a logarithmic profile above the roughness length; the other root puts z_0 near 10 m."
output = { identifier = "C_DN", kind = "NeutralSurfaceDragCoefficientForMomentum", unit = "UNITLESS", description = "Neutral drag coefficient at 10 m" }
inputs = [
  { identifier = "U_10N", kind = "EquivalentNeutralWindSpeed", unit = "M-PER-SEC", description = "Equivalent neutral wind speed at 10 m" },
  { identifier = "nu", kind = "KinematicViscosity", unit = "M2-PER-SEC", description = "Kinematic viscosity of the air" },
  { identifier = "g", kind = "AccelerationOfGravity", unit = "M-PER-SEC2", description = "Acceleration of gravity" },
]
coefficients = { k = 0.4, gamma = 0.11, a_1 = 0.0017, a_2 = -0.005, U_max = 19 }
keywords = ["drag coefficient", "neutral", "sea surface", "COARE", "Charnock", "implicit equation"]

[[formulations.coare36_neutral_drag_coefficient_from_wind.domains]]
bounds = { C_DN = [0, 0.04] }
