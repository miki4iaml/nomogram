# --- Roughness lengths ------------------------------------------------

[formulations.ecmwf_ifs_roughness_length_momentum_sea]
label = "Roughness length for momentum over sea, smooth surface and Charnock (IFS)"
expression = "alpha_M * nu / u_s + alpha_Ch * u_s**2 / g_n"
fixed_units = false
note = "Equation 3.28. The Charnock coefficient 0.018 is that of the IFS when its wave model is deactivated; otherwise the wave model provides it."
output = { identifier = "z_0M", kind = "RoughnessLengthForMomentum", unit = "M", description = "Roughness length for momentum" }
inputs = [
  { identifier = "u_s", kind = "FrictionVelocity", unit = "M-PER-SEC", description = "Friction velocity" },
]
coefficients = { alpha_M = 0.11, alpha_Ch = 0.018 }
constants = ["nu_ecmwf_ifs", "g_n_cgpm1901"]
keywords = ["roughness length", "Charnock", "sea surface", "IFS"]

[[formulations.ecmwf_ifs_roughness_length_momentum_sea.citations]]
