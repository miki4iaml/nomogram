# --- Diagnostics at 2 m and 10 m --------------------------------------
# Interpolations between the lowest model level and the surface with the
# profile functions (CY49R1 3.9, CY50R1 3.10, numbers 39 apart). The
# stability parameters are inputs at each height, as for the transfer
# coefficients: (z + z_0)/L and z_0/L. The temperature at 2 m follows from
# the dry static energy by equation 3.5; the dew point, from the specific
# humidity and the surface pressure, with saturation over water.

[formulations.ecmwf_ifs_dry_static_energy_2m]
label = "Dry static energy at 2 m, interpolated with the profile functions (IFS)"
expression = "s_surf + (s_n - s_surf) * ((ln((z_2 + z_0ma) / z_0H) - Psi_H(zeta=(z_2 + z_0ma) / L) + Psi_H(zeta=z_0H / L)) / (ln((z_n + z_0ma) / z_0H) - Psi_H(zeta=(z_n + z_0ma) / L) + Psi_H(zeta=z_0H / L)) * (1 - 2 / pi * atan(gamma_2m * (z_2 + z_0ma) / L)) + lambda_2m * 2 / pi * atan(gamma_2m * (z_2 + z_0ma) / L))"
calls = { Psi_H = "ecmwf_ifs_profile_function_heat" }
fixed_units = false
note = "Equation 3.98 with the interpolation factor of 3.100, f_2m of 3.101 (an arctangent of one argument) and beta of 3.102, written out. From CY49R1, this continuous form replaces the limiter of earlier cycles, which set the values at 2 m to those of the lowest level when (z_2 + z_0ma)/L > 5. As printed, f_2m is negative in unstable conditions (L < 0). Per tile, with the surface values of each; the tiles are then averaged over land (3.104, not entered)."
output = { identifier = "s_2", kind = "DryStaticEnergy", unit = "J-PER-KiloGM", description = "Dry static energy at 2 m" }
inputs = [
  { identifier = "s_surf", kind = "DryStaticEnergy", unit = "J-PER-KiloGM", description = "Dry static energy at the surface" },
  { identifier = "s_n", kind = "DryStaticEnergy", unit = "J-PER-KiloGM", description = "Dry static energy at the lowest model level" },
  { identifier = "z_n", kind = "Height", unit = "M", description = "Height of the lowest model level" },
  { identifier = "z_0ma", kind = "RoughnessLengthForMomentum", unit = "M", description = "Aggregated roughness length for momentum" },
  { identifier = "z_0H", kind = "RoughnessLengthForHeat", unit = "M", description = "Roughness length for heat of the tile (z_0HWMO)" },
  { identifier = "L", kind = "ObukhovLength", unit = "M", description = "Obukhov length" },
]
coefficients = { z_2 = 2, lambda_2m = 0.75, gamma_2m = 0.3 }
keywords = ["2 m temperature", "interpolation", "dry static energy", "diagnostic", "IFS"]

