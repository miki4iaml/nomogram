[formulations.ecmwf_ifs_roughness_length_momentum_sea_ice]
label = "Roughness length for momentum over sea ice, from the sea ice concentration (IFS)"
expression = "piecewise((A * (1 - c_i) + B * exp(-17 * (c_i - 0.5) ** 2), c_i <= c_x), (z_min, c_i > c_x))"
fixed_units = true
note = "Equation 3.35 writes z_0M = max(10^-3, 0.93 10^-3 (1 - c_i) + 6.05 10^-3 exp[-17 (c_i - 0.5)^2]) in metres; the max is written by pieces. The roughness lengths for heat and moisture stay 10^-3 m."
output = { identifier = "z_0M", kind = "RoughnessLengthForMomentum", unit = "M", description = "Roughness length for momentum" }
inputs = [
  { identifier = "c_i", kind = "SeaIceAreaFraction", unit = "UNITLESS", description = "Sea ice concentration" },
]
coefficients = { A = 0.93e-3, B = 6.05e-3, z_min = 1e-3, c_x = { value = 0.839681073938337, note = "Where the two arguments of the max of equation 3.35 meet, computed by nomogram (sympy.nsolve, 15 digits): below, the second argument is the larger." } }
domains = [{ bounds = { c_i = [0.0, 1.0] }, criterion = "A fraction of area." }]
keywords = ["roughness length", "sea ice", "IFS"]

