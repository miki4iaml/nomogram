label = "Specific humidity at 2 m, interpolated with the profile functions (IFS)"
expression = "q_surf + (q_n - q_surf) * ((ln((z_2 + z_0ma) / z_0Q) - Psi_H(zeta=zeta_2) + Psi_H(zeta=zeta_0Q)) / (ln((z_n + z_0ma) / z_0Q) - Psi_H(zeta=zeta_n) + Psi_H(zeta=zeta_0Q)) * (1 - 2 / pi * atan(gamma_2m * zeta_2)) + lambda_2m * 2 / pi * atan(gamma_2m * zeta_2))"
calls = { Psi_H = "ecmwf_ifs_profile_function_heat" }
fixed_units = false
note = "Equation 3.99 with the interpolation factor of 3.100, f_2m of 3.101 and beta of 3.103, written out, as ecmwf_ifs_dry_static_energy_2m. As printed, f_2m is negative in unstable conditions (L < 0). The dew point at 2 m follows from it and the surface pressure, with saturation over water, and is set to the temperature where it would exceed it."
output = { identifier = "q_2", kind = "SpecificHumidity", unit = "KiloGM-PER-KiloGM", description = "Specific humidity at 2 m" }
inputs = [
  { identifier = "q_surf", kind = "SpecificHumidity", unit = "KiloGM-PER-KiloGM", description = "Specific humidity at the surface" },
  { identifier = "q_n", kind = "SpecificHumidity", unit = "KiloGM-PER-KiloGM", description = "Specific humidity at the lowest model level" },
