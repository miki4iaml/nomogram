[formulations.ecmwf_ifs_roughness_length_heat_sea_state]
label = "Roughness length for heat over sea, with the sea state (IFS from CY49R1)"
expression = "sqrt((-(beta_hq * (alpha_Ch * u_s**2 / g_n - z_b) + 0.5 * alpha_H * nu / u_s) + sqrt((beta_hq * (alpha_Ch * u_s**2 / g_n - z_b))**2 + (0.5 * alpha_H * nu / u_s)**2))**2) ** ((beta_hq * (alpha_Ch * u_s**2 / g_n - z_b) + (-(beta_hq * (alpha_Ch * u_s**2 / g_n - z_b) + 0.5 * alpha_H * nu / u_s) + sqrt((beta_hq * (alpha_Ch * u_s**2 / g_n - z_b))**2 + (0.5 * alpha_H * nu / u_s)**2))) / ((-(beta_hq * (alpha_Ch * u_s**2 / g_n - z_b) + 0.5 * alpha_H * nu / u_s) + sqrt((beta_hq * (alpha_Ch * u_s**2 / g_n - z_b))**2 + (0.5 * alpha_H * nu / u_s)**2)) - (-(beta_hq * (alpha_Ch * u_s**2 / g_n - z_b) + 0.5 * alpha_H * nu / u_s) - sqrt((beta_hq * (alpha_Ch * u_s**2 / g_n - z_b))**2 + (0.5 * alpha_H * nu / u_s)**2)))) * sqrt((-(beta_hq * (alpha_Ch * u_s**2 / g_n - z_b) + 0.5 * alpha_H * nu / u_s) - sqrt((beta_hq * (alpha_Ch * u_s**2 / g_n - z_b))**2 + (0.5 * alpha_H * nu / u_s)**2))**2) ** ((beta_hq * (alpha_Ch * u_s**2 / g_n - z_b) + (-(beta_hq * (alpha_Ch * u_s**2 / g_n - z_b) + 0.5 * alpha_H * nu / u_s) - sqrt((beta_hq * (alpha_Ch * u_s**2 / g_n - z_b))**2 + (0.5 * alpha_H * nu / u_s)**2))) / ((-(beta_hq * (alpha_Ch * u_s**2 / g_n - z_b) + 0.5 * alpha_H * nu / u_s) - sqrt((beta_hq * (alpha_Ch * u_s**2 / g_n - z_b))**2 + (0.5 * alpha_H * nu / u_s)**2)) - (-(beta_hq * (alpha_Ch * u_s**2 / g_n - z_b) + 0.5 * alpha_H * nu / u_s) + sqrt((beta_hq * (alpha_Ch * u_s**2 / g_n - z_b))**2 + (0.5 * alpha_H * nu / u_s)**2))))"
fixed_units = true
note = "Equations 3.30 to 3.32, after Janssen (1997) and Janssen and Bidlot (2018), in SI units: z_m = beta_hq (alpha_Ch u_*^2/g - z_b), z_nu = alpha_H nu/u_*, z_+- = -(z_m + 0.5 z_nu) +- (z_m^2 + (0.5 z_nu)^2)^(1/2), and z_0H = f_zz(z_m, z_+, z_-) f_zz(z_m, z_-, z_+) with f_zz(z_m, a, b) = |a|^((z_m + a)/(a - b)), |a| written (a^2)^(1/2). With z_m = 0 it is the smooth-surface length z_nu (ecmwf_ifs_roughness_length_heat_sea); 3.34 approximates it (ecmwf_ifs_roughness_length_heat_sea_simplified). alpha_Ch and z_b come from the wave model; without it, alpha_Ch = 0.018."
output = { identifier = "z_0H", kind = "RoughnessLengthForHeat", unit = "M", description = "Roughness length for heat" }
inputs = [
  { identifier = "u_s", kind = "FrictionVelocity", unit = "M-PER-SEC", description = "Friction velocity" },
  { identifier = "alpha_Ch", kind = "CharnockCoefficient", unit = "UNITLESS", description = "Charnock coefficient, from the wave model" },
  { identifier = "z_b", kind = "BackgroundRoughnessLength", unit = "M", description = "Background roughness of gravity-capillary waves, from the wave model" },
]
coefficients = { beta_hq = 0.25, alpha_H = 0.4 }
constants = ["nu_ecmwf_ifs", "g_n_cgpm1901"]
keywords = ["roughness length", "sea surface", "sea state", "Charnock", "IFS"]

