  { identifier = "zeta_2", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter at 2 m, (z_2 + z_0ma)/L" },
  { identifier = "zeta_n", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter at the lowest model level, (z_n + z_0ma)/L" },
  { identifier = "zeta_0Q", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter at the roughness length for humidity, z_0QWMO/L" },
]
coefficients = { z_2 = 2, lambda_2m = 0.75, gamma_2m = 0.3 }
