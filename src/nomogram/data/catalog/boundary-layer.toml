# --- Transfer coefficients and friction velocity ----------------------
# The IFS takes the profile functions at two heights each, z_n + z_0 and
# z_0: the formulations call them, the stability parameters at both
# heights being inputs, (z_n + z_0M)/L and z_0/L.

[formulations.ecmwf_ifs_transfer_coefficient_momentum]
label = "Transfer coefficient for momentum of the surface layer (IFS)"
expression = "kappa**2 / (ln((z_n + z_0M) / z_0M) - Psi_M(zeta=zeta_n) + Psi_M(zeta=zeta_0M)) ** 2"
calls = { Psi_M = "ecmwf_ifs_profile_function_momentum" }
fixed_units = false
output = { identifier = "C_M", kind = "SurfaceDragCoefficientForMomentum", unit = "UNITLESS", description = "Transfer coefficient for momentum" }
inputs = [
  { identifier = "z_n", kind = "Height", unit = "M", description = "Height of the lowest model level" },
  { identifier = "z_0M", kind = "RoughnessLengthForMomentum", unit = "M", description = "Roughness length for momentum" },
  { identifier = "zeta_n", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter at the lowest model level, (z_n + z_0M)/L" },
  { identifier = "zeta_0M", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter at the roughness length for momentum, z_0M/L" },
]
constants = ["kappa_ecmwf_ifs"]
keywords = ["transfer coefficient", "drag coefficient", "Monin-Obukhov", "IFS"]

[[formulations.ecmwf_ifs_transfer_coefficient_momentum.citations]]
reference = "ecmwf_ifs_cy49r1"
equation = "3.16"
notation = { C_M = 'C_{\mathrm{M}}', kappa = '\kappa', z_0M = 'z_{0\mathrm{M}}', zeta_n = '\zeta_n', zeta_0M = '\zeta_{0\mathrm{M}}' }

[formulations.ecmwf_ifs_transfer_coefficient_heat]
label = "Transfer coefficient for heat of the surface layer (IFS)"
expression = "kappa**2 / ((ln((z_n + z_0M) / z_0M) - Psi_M(zeta=zeta_n) + Psi_M(zeta=zeta_0M)) * (ln((z_n + z_0M) / z_0H) - Psi_H(zeta=zeta_n) + Psi_H(zeta=zeta_0H)))"
calls = { Psi_M = "ecmwf_ifs_profile_function_momentum", Psi_H = "ecmwf_ifs_profile_function_heat" }
fixed_units = false
output = { identifier = "C_H", kind = "SurfaceDragCoefficientForHeat", unit = "UNITLESS", description = "Transfer coefficient for heat" }
inputs = [
  { identifier = "z_n", kind = "Height", unit = "M", description = "Height of the lowest model level" },
  { identifier = "z_0M", kind = "RoughnessLengthForMomentum", unit = "M", description = "Roughness length for momentum" },
  { identifier = "z_0H", kind = "RoughnessLengthForHeat", unit = "M", description = "Roughness length for heat" },
  { identifier = "zeta_n", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter at the lowest model level, (z_n + z_0M)/L" },
  { identifier = "zeta_0M", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter at the roughness length for momentum, z_0M/L" },
  { identifier = "zeta_0H", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter at the roughness length for heat, z_0H/L" },
]
constants = ["kappa_ecmwf_ifs"]
keywords = ["transfer coefficient", "Monin-Obukhov", "IFS"]

[[formulations.ecmwf_ifs_transfer_coefficient_heat.citations]]
reference = "ecmwf_ifs_cy49r1"
equation = "3.17"
notation = { C_H = 'C_{\mathrm{H}}', kappa = '\kappa', z_0M = 'z_{0\mathrm{M}}', z_0H = 'z_{0\mathrm{H}}', zeta_n = '\zeta_n', zeta_0M = '\zeta_{0\mathrm{M}}', zeta_0H = '\zeta_{0\mathrm{H}}' }

[formulations.ecmwf_ifs_friction_velocity]
label = "Friction velocity from the transfer coefficient for momentum and the wind speed (IFS)"
expression = "C_M ** (1 / 2) * U_n"
fixed_units = false
note = "Equation 3.29, u_* = C_M^(1/2) (u_n^2 + v_n^2 + w_*^2)^(1/2), written with the wind speed |U_n| of equation 3.19, which includes the free-convection velocity w_*."
output = { identifier = "u_s", kind = "FrictionVelocity", unit = "M-PER-SEC", description = "Friction velocity" }
inputs = [
  { identifier = "C_M", kind = "SurfaceDragCoefficientForMomentum", unit = "UNITLESS", description = "Transfer coefficient for momentum" },
  { identifier = "U_n", kind = "Speed", unit = "M-PER-SEC", description = "Wind speed at the lowest model level, with the free-convection velocity (equation 3.19)" },
]
keywords = ["friction velocity", "IFS"]

[[formulations.ecmwf_ifs_friction_velocity.citations]]
