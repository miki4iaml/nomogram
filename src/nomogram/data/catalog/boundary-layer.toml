# --- Quantity kinds ---------------------------------------------------

[kinds.ObukhovLength]
label = "Obukhov Length"
specialization_of = "Length"
description = "Length scale of the surface layer, comparing the production of turbulence by wind shear to that by buoyancy (Monin-Obukhov similarity): negative in unstable conditions, positive in stable ones."
cf_standard_names = [{ name = "atmosphere_obukhov_length", relation = "exact", verified = 2026-11-04 }]

[kinds.FrictionVelocity]
label = "Friction Velocity"
specialization_of = "Speed"
description = "Velocity scale of the surface layer, the square root of the surface stress over the density of air."
cf_standard_names = [{ name = "magnitude_of_surface_friction_velocity_in_air", relation = "exact", verified = 2026-11-04 }]

[kinds.SurfaceLayerScaleOfDryStaticEnergy]
label = "Surface-Layer Scale of Dry Static Energy"
specialization_of = "SpecificEnergy"
description = "Scale of the dry static energy in the surface layer, its surface flux over the density of air and the friction velocity (IFS, s_*): a scale, not a dry static energy."

[kinds.SurfaceLayerScaleOfSpecificHumidity]
label = "Surface-Layer Scale of Specific Humidity"
specialization_of = "MassRatio"
description = "Scale of the specific humidity in the surface layer, its surface flux over the density of air and the friction velocity (IFS, q_*): a scale, not a humidity."

[kinds.RoughnessLengthForMomentum]
label = "Roughness Length for Momentum"
specialization_of = "Length"
description = "Height at which the logarithmic wind profile of the surface layer, extended downwards, vanishes."
cf_standard_names = [{ name = "surface_roughness_length_for_momentum_in_air", relation = "exact", verified = 2026-11-04 }]

[kinds.RoughnessLengthForHeat]
label = "Roughness Length for Heat"
specialization_of = "Length"
description = "Height at which the profile of temperature, or of dry static energy, of the surface layer, extended downwards, reaches its surface value."
cf_standard_names = [{ name = "surface_roughness_length_for_heat_in_air", relation = "exact", verified = 2026-11-04 }]

[kinds.RoughnessLengthForHumidity]
label = "Roughness Length for Humidity"
specialization_of = "Length"
description = "Height at which the profile of specific humidity of the surface layer, extended downwards, reaches its surface value."
cf_standard_names = [{ name = "surface_roughness_length_for_humidity_in_air", relation = "exact", verified = 2026-11-04 }]

[kinds.StabilityParameter]
label = "Stability Parameter"
specialization_of = "DimensionlessRatio"
description = "Height over the Obukhov length, zeta = z/L: negative in unstable conditions, positive in stable ones."

[kinds.GradientFunctionForMomentum]
label = "Gradient Function for Momentum"
specialization_of = "DimensionlessRatio"
description = "Dimensionless vertical gradient of the wind in the surface layer, (kappa z / u_*) du/dz, a function of the stability parameter (Monin-Obukhov similarity)."

[kinds.GradientFunctionForHeat]
label = "Gradient Function for Heat"
specialization_of = "DimensionlessRatio"
description = "Dimensionless vertical gradient of the dry static energy in the surface layer, (kappa z / s_*) ds/dz, a function of the stability parameter; the IFS takes the same function for specific humidity."

[kinds.ProfileFunctionForMomentum]
label = "Profile Function for Momentum"
specialization_of = "DimensionlessRatio"
description = "Stability correction to the logarithmic wind profile of the surface layer, Psi_M, tied to the gradient function by Phi = 1 - zeta dPsi/dzeta."

[kinds.ProfileFunctionForHeat]
label = "Profile Function for Heat"
specialization_of = "DimensionlessRatio"
description = "Stability correction to the logarithmic profile of dry static energy, and of specific humidity, in the surface layer, Psi_H."

[kinds.BulkRichardsonNumber]
label = "Bulk Richardson Number"
specialization_of = "DimensionlessRatio"
description = "Ratio of buoyancy to wind shear across a layer, from the differences of virtual potential temperature, or of dry static energy and specific humidity, between its bounds."

[kinds.SurfaceDragCoefficientForMomentum]
label = "Surface Drag Coefficient for Momentum"
specialization_of = "DimensionlessRatio"
description = "Transfer coefficient relating the surface stress to the square of the wind speed at a height, tau = rho C_M |U|^2. Not the drag coefficient of a body in a flow (QUDT DragCoefficient)."
cf_standard_names = [{ name = "surface_drag_coefficient_for_momentum_in_air", relation = "exact", verified = 2026-11-04 }]

[kinds.SurfaceDragCoefficientForHeat]
label = "Surface Drag Coefficient for Heat"
specialization_of = "DimensionlessRatio"
description = "Transfer coefficient relating the surface flux of heat to the wind speed and the difference of dry static energy between a height and the surface, J_s = rho C_H |U| (s - s_surf)."
cf_standard_names = [{ name = "surface_drag_coefficient_for_heat_in_air", relation = "exact", verified = 2026-11-04 }]

[kinds.SeaIceAreaFraction]
label = "Sea Ice Area Fraction"
specialization_of = "DimensionlessRatio"
description = "Fraction of an area of sea covered by sea ice, the sea ice concentration."
cf_standard_names = [{ name = "sea_ice_area_fraction", relation = "exact", verified = 2026-11-04 }]

# --- Constants --------------------------------------------------------

[constants.kappa_ecmwf_ifs]
identifier = "kappa"
value = 0.4
unit = "UNITLESS"
description = "Von Karman constant of the ECMWF IFS (CY49R1, Part IV, under equation 3.10)"
reference = "ecmwf_ifs_cy49r1"
nature = "conventional"
note = "The constant of the logarithmic wind profile, not the ratio R/c_p that other sources call kappa."

[constants.nu_ecmwf_ifs]
identifier = "nu"
value = 1.5e-5
unit = "M2-PER-SEC"
description = "Kinematic viscosity of air of the ECMWF IFS, for the smooth-surface roughness lengths over sea (CY49R1, Part IV, 3.2.4)"
reference = "ecmwf_ifs_cy49r1"
nature = "conventional"
note = "A constant, where ISO 2533 gives the kinematic viscosity of air as a function of temperature and pressure (iso2533_kinematic_viscosity_of_air)."

# --- Obukhov length ---------------------------------------------------

[formulations.ecmwf_ifs_obukhov_length]
label = "Obukhov length from the surface-layer scales (IFS)"
expression = "-u_s**3 / (kappa * g_n / T_n * (u_s * s_s / c_pd + (R_v / R_d - 1) * T_n * u_s * q_s))"
fixed_units = false
note = "Equation 3.10, with the virtual temperature flux Q_0v = u_* s_*/c_p + epsilon T_n u_* q_* written out, epsilon = R_vap/R_dry - 1. T_n is the temperature of the lowest model level, a reference near the surface."
output = { identifier = "L", kind = "ObukhovLength", unit = "M", description = "Obukhov length" }
inputs = [
  { identifier = "u_s", kind = "FrictionVelocity", unit = "M-PER-SEC", description = "Friction velocity" },
  { identifier = "s_s", kind = "SurfaceLayerScaleOfDryStaticEnergy", unit = "J-PER-KiloGM", description = "Surface-layer scale of dry static energy" },
  { identifier = "q_s", kind = "SurfaceLayerScaleOfSpecificHumidity", unit = "KiloGM-PER-KiloGM", description = "Surface-layer scale of specific humidity" },
  { identifier = "T_n", kind = "ThermodynamicTemperature", unit = "K", description = "Temperature near the surface (lowest model level)" },
]
constants = ["kappa_ecmwf_ifs", "g_n_cgpm1901", "c_pd_ecmwf_ifs", "R_v_ecmwf_ifs", "R_d_ecmwf_ifs"]
keywords = ["Obukhov length", "Monin-Obukhov", "stability", "IFS"]

[[formulations.ecmwf_ifs_obukhov_length.citations]]
reference = "ecmwf_ifs_cy49r1"
equation = "3.10"
notation = { u_s = "u_*",s_s = "s_*", q_s = "q_*", kappa = '\kappa', g_n = "g", c_pd = "c_p" }
assumptions = ["The turbulent fluxes are constant with height in the surface layer, equal to their surface values (section 3.2)."]

# --- Gradient functions -----------------------------------------------

[formulations.ecmwf_ifs_gradient_function_momentum_unstable]
label = "Gradient function for momentum, unstable conditions (IFS, after Dyer and Hicks)"
expression = "(1 - 16 * zeta) ** (-1 / 4)"
fixed_units = false
output = { identifier = "Phi_M", kind = "GradientFunctionForMomentum", unit = "UNITLESS", description = "Gradient function for momentum" }
inputs = [
  { identifier = "zeta", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter z/L" },
]
keywords = ["gradient function", "Monin-Obukhov", "unstable", "IFS"]

[[formulations.ecmwf_ifs_gradient_function_momentum_unstable.citations]]
reference = "ecmwf_ifs_cy49r1"
equation = "3.21"
notation = { Phi_M = '\Phi_{\mathrm{M}}', zeta = '\zeta' }
assumptions = ["Unstable conditions, zeta = z/L < 0 (section 3.2.2 (i))."]

[[formulations.ecmwf_ifs_gradient_function_momentum_unstable.citations]]
reference = "dyer1974"
note = "As the IFS quotes it."

[[formulations.ecmwf_ifs_gradient_function_momentum_unstable.citations]]
reference = "hogstrom1988"
note = "As the IFS quotes it."

[formulations.ecmwf_ifs_gradient_function_heat_unstable]
label = "Gradient function for heat and moisture, unstable conditions (IFS, after Dyer and Hicks)"
expression = "(1 - 16 * zeta) ** (-1 / 2)"
fixed_units = false
output = { identifier = "Phi_H", kind = "GradientFunctionForHeat", unit = "UNITLESS", description = "Gradient function for heat" }
inputs = [
  { identifier = "zeta", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter z/L" },
]
keywords = ["gradient function", "Monin-Obukhov", "unstable", "IFS"]

[[formulations.ecmwf_ifs_gradient_function_heat_unstable.citations]]
reference = "ecmwf_ifs_cy49r1"
equation = "3.21"
notation = { Phi_H = '\Phi_{\mathrm{H}}', zeta = '\zeta' }
assumptions = ["Unstable conditions, zeta = z/L < 0 (section 3.2.2 (i)).", "The same function for specific humidity, Phi_Q = Phi_H."]

[[formulations.ecmwf_ifs_gradient_function_heat_unstable.citations]]
reference = "dyer1974"
note = "As the IFS quotes it."

[[formulations.ecmwf_ifs_gradient_function_heat_unstable.citations]]
reference = "hogstrom1988"
note = "As the IFS quotes it."

[formulations.ecmwf_ifs_gradient_function_momentum_stable]
label = "Gradient function for momentum, stable conditions (IFS, after Hogstrom)"
expression = "1 + 5 * zeta"
fixed_units = false
note = "The IFS states that its current version does not use the gradient functions of stable conditions, but functions of the Richardson number (section 3.2.2 (ii))."
output = { identifier = "Phi_M", kind = "GradientFunctionForMomentum", unit = "UNITLESS", description = "Gradient function for momentum" }
inputs = [
  { identifier = "zeta", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter z/L" },
]
keywords = ["gradient function", "Monin-Obukhov", "stable", "IFS"]

[[formulations.ecmwf_ifs_gradient_function_momentum_stable.citations]]
reference = "ecmwf_ifs_cy49r1"
equation = "3.23"
notation = { Phi_M = '\Phi_{\mathrm{M}}', zeta = '\zeta' }
assumptions = ["Stable conditions, zeta = z/L > 0 (section 3.2.2 (ii))."]

[[formulations.ecmwf_ifs_gradient_function_momentum_stable.citations]]
reference = "hogstrom1988"
note = "As the IFS quotes it."

[formulations.ecmwf_ifs_gradient_function_heat_stable]
label = "Gradient function for heat and moisture, stable conditions (IFS, after Ellison and Turner)"
expression = "(1 + 4 * zeta) ** 2"
fixed_units = false
note = "Derived by the IFS from the Ellison and Turner relation for Phi_M/Phi_H. The IFS states that its current version does not use the gradient functions of stable conditions, but functions of the Richardson number (section 3.2.2 (ii))."
output = { identifier = "Phi_H", kind = "GradientFunctionForHeat", unit = "UNITLESS", description = "Gradient function for heat" }
inputs = [
  { identifier = "zeta", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter z/L" },
]
keywords = ["gradient function", "Monin-Obukhov", "stable", "IFS"]

[[formulations.ecmwf_ifs_gradient_function_heat_stable.citations]]
reference = "ecmwf_ifs_cy49r1"
equation = "3.23"
notation = { Phi_H = '\Phi_{\mathrm{H}}', zeta = '\zeta' }
assumptions = ["Stable conditions, zeta = z/L > 0 (section 3.2.2 (ii)).", "The same function for specific humidity, Phi_Q = Phi_H."]

# --- Profile functions ------------------------------------------------
# Paulson (1970) for unstable conditions, with x = (1 - 16 zeta)^(1/4)
# written out (x^2 = (1 - 16 zeta)^(1/2)); Holtslag and De Bruin (1988),
# modified, for stable conditions. Both vanish at zeta = 0: the branches
# meet there, and nomogram closes the interval on the stable side. The
# IFS bounds z/L to 5 in very stable conditions (section 3.2), a limiter
# of the model, not of the functions.

[formulations.ecmwf_ifs_profile_function_momentum_unstable]
label = "Profile function for momentum, unstable conditions (IFS, after Paulson)"
expression = "pi / 2 - 2 * atan((1 - 16 * zeta) ** (1 / 4)) + ln((1 + (1 - 16 * zeta) ** (1 / 4)) ** 2 * (1 + (1 - 16 * zeta) ** (1 / 2)) / 8)"
fixed_units = false
output = { identifier = "Psi_M", kind = "ProfileFunctionForMomentum", unit = "UNITLESS", description = "Profile function for momentum" }
inputs = [
  { identifier = "zeta", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter z/L" },
]
keywords = ["profile function", "Monin-Obukhov", "unstable", "Paulson", "IFS"]

[[formulations.ecmwf_ifs_profile_function_momentum_unstable.citations]]
reference = "ecmwf_ifs_cy49r1"
equation = "3.22"
notation = { Psi_M = '\Psi_{\mathrm{M}}', zeta = '\zeta' }
assumptions = ["Unstable conditions, zeta = z/L < 0 (section 3.2.2 (i))."]

[[formulations.ecmwf_ifs_profile_function_momentum_unstable.citations]]
reference = "paulson1970"
note = "As the IFS quotes it."

[formulations.ecmwf_ifs_profile_function_heat_unstable]
label = "Profile function for heat and moisture, unstable conditions (IFS, after Paulson)"
expression = "2 * ln((1 + (1 - 16 * zeta) ** (1 / 2)) / 2)"
fixed_units = false
output = { identifier = "Psi_H", kind = "ProfileFunctionForHeat", unit = "UNITLESS", description = "Profile function for heat" }
inputs = [
  { identifier = "zeta", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter z/L" },
]
keywords = ["profile function", "Monin-Obukhov", "unstable", "Paulson", "IFS"]

[[formulations.ecmwf_ifs_profile_function_heat_unstable.citations]]
reference = "ecmwf_ifs_cy49r1"
equation = "3.22"
notation = { Psi_H = '\Psi_{\mathrm{H}}', zeta = '\zeta' }
assumptions = ["Unstable conditions, zeta = z/L < 0 (section 3.2.2 (i)).", "The same function for specific humidity, Psi_Q = Psi_H."]

[[formulations.ecmwf_ifs_profile_function_heat_unstable.citations]]
reference = "paulson1970"
note = "As the IFS quotes it."

[formulations.ecmwf_ifs_profile_function_momentum_stable]
label = "Profile function for momentum, stable conditions (IFS, after Holtslag and De Bruin)"
expression = "-b * (zeta - c / d) * exp(-d * zeta) - a * zeta - b * c / d"
fixed_units = false
output = { identifier = "Psi_M", kind = "ProfileFunctionForMomentum", unit = "UNITLESS", description = "Profile function for momentum" }
inputs = [
  { identifier = "zeta", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter z/L" },
]
coefficients = { a = 1, b = { value = 0.6666666666666666, note = "2/3 in the source." }, c = 5, d = 0.35 }
keywords = ["profile function", "Monin-Obukhov", "stable", "Holtslag", "IFS"]

[[formulations.ecmwf_ifs_profile_function_momentum_stable.citations]]
reference = "ecmwf_ifs_cy49r1"
equation = "3.24"
notation = { Psi_M = '\Psi_{\mathrm{M}}', zeta = '\zeta' }
assumptions = ["Stable conditions, zeta = z/L > 0 (section 3.2.2 (ii))."]

[[formulations.ecmwf_ifs_profile_function_momentum_stable.citations]]
reference = "holtslag_debruin1988"
note = "As the IFS quotes it, modified for a critical flux Richardson number at large zeta."

[formulations.ecmwf_ifs_profile_function_heat_stable]
label = "Profile function for heat and moisture, stable conditions (IFS, after Holtslag and De Bruin)"
expression = "-b * (zeta - c / d) * exp(-d * zeta) - (1 + 2 / 3 * a * zeta) ** 1.5 - b * c / d + 1"
fixed_units = false
output = { identifier = "Psi_H", kind = "ProfileFunctionForHeat", unit = "UNITLESS", description = "Profile function for heat" }
inputs = [
  { identifier = "zeta", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter z/L" },
]
coefficients = { a = 1, b = { value = 0.6666666666666666, note = "2/3 in the source." }, c = 5, d = 0.35 }
keywords = ["profile function", "Monin-Obukhov", "stable", "Holtslag", "IFS"]

[[formulations.ecmwf_ifs_profile_function_heat_stable.citations]]
reference = "ecmwf_ifs_cy49r1"
equation = "3.24"
notation = { Psi_H = '\Psi_{\mathrm{H}}', zeta = '\zeta' }
assumptions = ["Stable conditions, zeta = z/L > 0 (section 3.2.2 (ii)).", "The same function for specific humidity, Psi_Q = Psi_H."]

[[formulations.ecmwf_ifs_profile_function_heat_stable.citations]]
reference = "holtslag_debruin1988"
note = "As the IFS quotes it, modified for a critical flux Richardson number at large zeta."

[formulations.ecmwf_ifs_profile_function_momentum]
label = "Profile function for momentum, unstable then stable conditions (IFS)"
branches = [
  { formulation = "ecmwf_ifs_profile_function_momentum_unstable", where = "zeta < 0" },
  { formulation = "ecmwf_ifs_profile_function_momentum_stable", where = "zeta >= 0" },
]
output = { identifier = "Psi_M", kind = "ProfileFunctionForMomentum", unit = "UNITLESS", description = "Profile function for momentum" }
keywords = ["profile function", "Monin-Obukhov", "IFS"]

[formulations.ecmwf_ifs_profile_function_heat]
label = "Profile function for heat and moisture, unstable then stable conditions (IFS)"
branches = [
  { formulation = "ecmwf_ifs_profile_function_heat_unstable", where = "zeta < 0" },
  { formulation = "ecmwf_ifs_profile_function_heat_stable", where = "zeta >= 0" },
]
output = { identifier = "Psi_H", kind = "ProfileFunctionForHeat", unit = "UNITLESS", description = "Profile function for heat" }
keywords = ["profile function", "Monin-Obukhov", "IFS"]

# --- Bulk Richardson number -------------------------------------------
# Explicit forms only: the IFS solves 3.25 for zeta by Newton iterations,
# which no formulation writes.

[formulations.ecmwf_ifs_bulk_richardson_number]
label = "Bulk Richardson number of the surface layer from virtual potential temperatures (IFS)"
expression = "g_n / theta_v * z_n * (theta_vn - theta_vsurf) / U_n**2"
fixed_units = false
output = { identifier = "Ri_b", kind = "BulkRichardsonNumber", unit = "UNITLESS", description = "Bulk Richardson number" }
inputs = [
  { identifier = "theta_v", kind = "VirtualPotentialTemperature", unit = "K", description = "Virtual potential temperature within the surface layer" },
  { identifier = "z_n", kind = "Height", unit = "M", description = "Height of the lowest model level" },
  { identifier = "theta_vn", kind = "VirtualPotentialTemperature", unit = "K", description = "Virtual potential temperature at the lowest model level" },
  { identifier = "theta_vsurf", kind = "VirtualPotentialTemperature", unit = "K", description = "Virtual potential temperature at the surface" },
  { identifier = "U_n", kind = "Speed", unit = "M-PER-SEC", description = "Wind speed at the lowest model level, with the free-convection velocity (equation 3.19)" },
]
constants = ["g_n_cgpm1901"]
keywords = ["Richardson number", "stability", "IFS"]

[[formulations.ecmwf_ifs_bulk_richardson_number.citations]]
reference = "ecmwf_ifs_cy49r1"
equation = "3.26"
notation = { Ri_b = 'Ri_{\mathrm{bulk}}', g_n = "g", theta_v = '\theta_v', theta_vn = '\theta_{vn}', theta_vsurf = '\theta_{v\mathrm{surf}}', U_n = "|U_n|" }

[formulations.ecmwf_ifs_bulk_richardson_number_dry_static_energy]
label = "Bulk Richardson number of the surface layer from dry static energy and specific humidity (IFS)"
expression = "g_n * z_n / U_n**2 * (2 * (s_n - s_surf) / (s_n + s_surf - g_n * z_n) + (R_v / R_d - 1) * (q_n - q_surf))"
fixed_units = false
output = { identifier = "Ri_b", kind = "BulkRichardsonNumber", unit = "UNITLESS", description = "Bulk Richardson number" }
inputs = [
