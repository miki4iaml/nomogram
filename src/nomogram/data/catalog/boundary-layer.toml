output = { identifier = "Psi_H", kind = "ProfileFunctionForHeat", unit = "UNITLESS", description = "Profile function for heat" }
inputs = [
  { identifier = "zeta", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter z/L" },
]
keywords = ["profile function", "Monin-Obukhov", "stable", "COARE", "Beljaars"]

[[formulations.coare36_profile_function_heat_stable.citations]]
