container = "ECMWF Meteorological Training Course Lecture Series (May 1992; reprinted 2002)"
url = "https://www.ecmwf.int/sites/default/files/elibrary/2002/16959-parametrization-planetary-boundary-layer.pdf"
status = "verified"
note = "Read: the gradient functions of Dyer and Hicks (equations 34 and 35); phi_M = phi_H,Q = 1 + 5 z/L, 'as originally proposed by Webb (1970)', 'fairly consistent with most data for 0 < z/L < 0.5 (cf. Hogstrom, 1988)' (38); the forms of Holtslag and De Bruin with the constants of Beljaars and Holtslag, printed b = 0.667 (39 to 49); the profile functions of Paulson (45 and 46; 45 prints - atan(x), without the factor 2); the bulk Richardson number at the lowest model level (98) and its relation to z_1/L through the profile functions (99, p. 39). The Symbol font is not embedded in the PDF: its Greek letters are read from the structure of the equations."

[references.businger1985]
