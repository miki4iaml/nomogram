[formulations.coare36_wind_speed_at_height]
label = "Wind speed at a reference height from the wind at another (COARE 3.6)"
expression = "U + u_s * U / (k * S) * (ln(z_r / z_u) - psi_u(zeta=z_r / L) + psi_u(zeta=z_u / L))"
calls = { psi_u = "coare36_profile_function_momentum" }
fixed_units = false
note = "As coded, the gustiness factor gf = S/U dividing u_*: the mean wind, without gustiness, at the reference height (U10 at 10 m, l. 658-659). Fairall et al. (2003, equation 31) write G^(1/2), with a u_* that does not include the gustiness."
