[formulations.businger1971_keyps]
label = "Gradient function for momentum, KEYPS formula (Businger et al. 1971)"
expression = "Phi_M**4 - gamma_1 * zeta * Phi_M**3 == 1"
fixed_units = false
note = "Equation 7, the KEYPS formula as the source names it, after Panofsky (1963) and Lumley and Panofsky (1964), not read; gamma_1 = 9 fitted on the unstable observations of the Kansas experiment, with k = 0.35 (p. 184). An implicit equation as printed: a quartic in Phi_M, with two real roots for every zeta, one negative; the gradient function of a wind increasing with height is the positive one, which the physical domain keeps. Jeske's evaporation duct model takes the same relation with 4 beta = 18 in place of gamma_1 (paulus1989_evaporation_duct_height_unstable). Its slope at zeta = 0 is gamma_1/4 = 2.25 (p. 184), that of equation 8 (fairall1978_gradient_function_momentum_unstable) 3.75."
output = { identifier = "Phi_M", kind = "GradientFunctionForMomentum", unit = "UNITLESS", description = "Gradient function for momentum" }
inputs = [
  { identifier = "zeta", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter z/L" },
]
coefficients = { gamma_1 = 9.0 }
keywords = ["gradient function", "KEYPS", "Monin-Obukhov", "unstable", "Businger", "implicit equation"]

[[formulations.businger1971_keyps.domains]]
bounds = { Phi_M = [0, inf] }
criterion = "The dimensionless wind shear (k z/u_*) dU/dz (equation 2) of a wind increasing with height, as in the observations the source fits."

[[formulations.businger1971_keyps.citations]]
reference = "businger1971"
equation = "7"
note = "p. 184."
notation = { Phi_M = '\phi_m', zeta = '\zeta', gamma_1 = '\gamma_1' }
assumptions = ["Unstable conditions: the formula is 'intended for unstable conditions' (p. 184)."]

[formulations.businger1971_gradient_function_heat_unstable]
label = "Gradient function for heat, unstable conditions, normalized (Businger et al. 1971)"
expression = "(1 - 9 * zeta) ** (-1 / 2)"
fixed_units = false
note = "Equation 12 gives phi_h / phi_h(0), the gradient function for heat normalized to 1 in neutral conditions, phi_h(0) being about 0.74 with k = 0.35 (p. 185); in very unstable conditions it follows zeta^(-1/2), not the zeta^(-1/3) of free convection (p. 185)."
output = { identifier = "Phi_H", kind = "GradientFunctionForHeat", unit = "UNITLESS", description = "Gradient function for heat" }
inputs = [
  { identifier = "zeta", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter z/L" },
]
keywords = ["gradient function", "Monin-Obukhov", "unstable", "Businger"]

[[formulations.businger1971_gradient_function_heat_unstable.citations]]
