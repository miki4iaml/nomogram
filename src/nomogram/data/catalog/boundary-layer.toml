# --- COARE 3.6 -------------------------------------------------------------
# As coded (psiu_26, psit_26 of coare36vn_zrf_et.py, commit bd1cac8),
# numbers included; Fairall et al. (2003, p. 576) describe the blend of
# Kansas and convective forms with a_u = 10.15 and a_s = 34.15 (Grachev et
# al. 2000), and announce the stable functions of Beljaars and Holtslag.

[formulations.coare36_profile_function_momentum_unstable]
label = "Profile function for momentum, unstable conditions (COARE 3.6)"
expression = "(1 - zeta**2 / (1 + zeta**2)) * (2 * ln((1 + (1 - 15 * zeta) ** 0.25) / 2) + ln((1 + ((1 - 15 * zeta) ** 0.25)**2) / 2) - 2 * atan((1 - 15 * zeta) ** 0.25) + pi / 2) + zeta**2 / (1 + zeta**2) * (1.5 * ln((1 + (1 - 10.15 * zeta) ** 0.3333 + ((1 - 10.15 * zeta) ** 0.3333)**2) / 3) - sqrt(3) * atan((1 + 2 * (1 - 10.15 * zeta) ** 0.3333) / sqrt(3)) + pi / sqrt(3))"
fixed_units = false
note = "A blend, weighted by zeta^2/(1 + zeta^2), of the Kansas form of Paulson with 15 and of a convective form, (1 - 10.15 zeta)^(1/3) written 0.3333 as coded, which is that of Carl et al. (1973) with gamma_3 = 10.15 (Kramm et al. 2013, equation 3.16)."
output = { identifier = "Psi_M", kind = "ProfileFunctionForMomentum", unit = "UNITLESS", description = "Profile function for momentum" }
inputs = [
  { identifier = "zeta", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter z/L" },
]
keywords = ["profile function", "Monin-Obukhov", "unstable", "COARE", "free convection"]

[[formulations.coare36_profile_function_momentum_unstable.citations]]
reference = "coare36"
note = "psiu_26, zeta < 0 (lines 769 to 776)."
notation = { Psi_M = '\psi_u', zeta = '\zeta' }
assumptions = ["Unstable conditions, zeta < 0."]

[formulations.coare36_profile_function_momentum_stable]
label = "Profile function for momentum, stable conditions (COARE 3.6)"
expression = "-(a * zeta + b * (zeta - c / d) * exp(-d * zeta) + b * c / d)"
fixed_units = false
note = "The form of Beljaars and Holtslag with the constants a = 0.7 and b = 3/4 of Holtslag and De Bruin (1988) (holtslag_debruin1988_gradient_function_momentum_stable, of which it is the integral), where Fairall et al. (2003, p. 576) announce those of Beljaars and Holtslag; the code bounds the argument of exp to 50, a numerical step left out here."
output = { identifier = "Psi_M", kind = "ProfileFunctionForMomentum", unit = "UNITLESS", description = "Profile function for momentum" }
inputs = [
  { identifier = "zeta", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter z/L" },
]
coefficients = { a = 0.7, b = { value = 0.75, note = "3/4 in the code." }, c = 5, d = 0.35 }
keywords = ["profile function", "Monin-Obukhov", "stable", "COARE", "Holtslag"]

[[formulations.coare36_profile_function_momentum_stable.citations]]
reference = "coare36"
note = "psiu_26, zeta >= 0 (lines 764 to 768)."
notation = { Psi_M = '\psi_u', zeta = '\zeta' }
assumptions = ["Stable conditions, zeta >= 0."]

[formulations.coare36_profile_function_heat_unstable]
label = "Profile function for heat and humidity, unstable conditions (COARE 3.6)"
expression = "(1 - zeta**2 / (1 + zeta**2)) * 2 * ln((1 + (1 - 15 * zeta) ** 0.5) / 2) + zeta**2 / (1 + zeta**2) * (1.5 * ln((1 + (1 - 34.15 * zeta) ** 0.3333 + ((1 - 34.15 * zeta) ** 0.3333)**2) / 3) - sqrt(3) * atan((1 + 2 * (1 - 34.15 * zeta) ** 0.3333) / sqrt(3)) + pi / sqrt(3))"
fixed_units = false
note = "A blend, weighted by zeta^2/(1 + zeta^2), of the Kansas form of Paulson with 15 (where Businger et al. 1971 print 9, Dyer and Hicks 16) and of a convective form, (1 - 34.15 zeta)^(1/3) written 0.3333 as coded. COARE takes the same function for humidity."
output = { identifier = "Psi_H", kind = "ProfileFunctionForHeat", unit = "UNITLESS", description = "Profile function for heat" }
inputs = [
  { identifier = "zeta", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter z/L" },
]
keywords = ["profile function", "Monin-Obukhov", "unstable", "COARE", "free convection"]

[[formulations.coare36_profile_function_heat_unstable.citations]]
reference = "coare36"
note = "psit_26, zeta < 0 (lines 751 to 757)."
notation = { Psi_H = '\psi_t', zeta = '\zeta' }
assumptions = ["Unstable conditions, zeta < 0."]

[formulations.coare36_profile_function_heat_stable]
label = "Profile function for heat and humidity, stable conditions (COARE 3.6)"
expression = "-((1 + 0.6667 * zeta) ** 1.5 + 0.6667 * (zeta - 14.28) * exp(-0.35 * zeta) + 8.525)"
fixed_units = false
