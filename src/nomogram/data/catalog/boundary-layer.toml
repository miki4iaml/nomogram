# --- Profile functions ------------------------------------------------
# Paulson (1970) for unstable conditions, with x = (1 - 16 zeta)^(1/4)
# written out (x^2 = (1 - 16 zeta)^(1/2)); for stable conditions, the form
# of Holtslag and De Bruin (1988) with the constants of Beljaars and
# Holtslag (1991). Both vanish at zeta = 0: the branches
# meet there, and nomogram closes the interval on the stable side. The
# IFS bounds z/L to 5 in very stable conditions (section 3.2), a limiter
# of the model, not of the functions.

[formulations.ecmwf_ifs_profile_function_momentum_unstable]
label = "Profile function for momentum, unstable conditions (IFS, after Paulson)"
expression = "pi / 2 - 2 * atan((1 - 16 * zeta) ** (1 / 4)) + ln((1 + (1 - 16 * zeta) ** (1 / 4)) ** 2 * (1 + (1 - 16 * zeta) ** (1 / 2)) / 8)"
fixed_units = false
output = { identifier = "Psi_M", kind = "ProfileFunctionForMomentum", unit = "UNITLESS", description = "Profile function for momentum" }
inputs = [
  { identifier = "zeta", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter z/L" },
]
keywords = ["profile function", "Monin-Obukhov", "unstable", "Paulson", "IFS"]

