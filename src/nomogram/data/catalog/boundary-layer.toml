status = "verified"
note = "Read on the page images of the scan: Ri approximately z/L in unstable conditions, from the Kansas data of 1968 (37, p. 18); Ri = (z/L)/(1 + beta z/L), beta about 4.7, in stable conditions (38, p. 20); the forms Businger and Dyer suggested (Businger 1966), alpha about 16 (39, 40); phi_u = (1 - alpha Ri)^(-1/4), after Fleagle and Businger (1980) (41); phi_u = phi_theta = 1 + beta z/L in stable conditions (42); the profiles of Paulson (1970), with psi_1 = psi_2 = -beta z/L in stable conditions (43, 44, p. 22); the constants come from the Kansas site, of roughness length about 1.5 cm (p. 22)."

