  { identifier = "S", kind = "Speed", unit = "M-PER-SEC", description = "Mean wind speed relative to the sea surface at z_u, gustiness included, S = (U^2 + U_g^2)^(1/2)" },
  { identifier = "u_s", kind = "FrictionVelocity", unit = "M-PER-SEC", description = "Friction velocity" },
  { identifier = "z_u", kind = "Height", unit = "M", description = "Height of the wind" },
  { identifier = "z_r", kind = "Height", unit = "M", description = "Reference height" },
  { identifier = "L", kind = "ObukhovLength", unit = "M", description = "Obukhov length" },
]
coefficients = { k = 0.4 }
keywords = ["wind speed", "reference height", "10 m", "Monin-Obukhov", "COARE"]

