[formulations.large_yeager2004_profile_function_momentum]
label = "Profile function for momentum, Paulson in unstable and linear in stable conditions (Large and Yeager 2004)"
expression = "piecewise((2 * ln((1 + ((1 - 16 * zeta) ** (1 / 4))) / 2) + ln((1 + ((1 - 16 * zeta) ** (1 / 4))**2) / 2) - 2 * atan((1 - 16 * zeta) ** (1 / 4)) + pi / 2, zeta < 0), (-5 * zeta, zeta >= 0))"
fixed_units = false
note = "Equations 8b to 8d: Paulson (1970) with X = (1 - 16 zeta)^(1/4) in unstable conditions, -5 zeta in stable ones."
