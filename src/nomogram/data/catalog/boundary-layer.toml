label = "Obukhov Length"
specialization_of = "Length"
description = "Length scale of the surface layer of a fluid, air or sea water, comparing the production of turbulence by shear to that by buoyancy (Monin-Obukhov similarity): negative in unstable conditions, positive in stable ones."
matches = [
  { target = "http://www.wikidata.org/entity/Q3110303", relation = "narrow", verified = 2026-11-04 },
]
cf_standard_names = [{ name = "atmosphere_obukhov_length", relation = "narrow", verified = 2026-11-04 }]

[kinds.FrictionVelocity]
label = "Friction Velocity"
specialization_of = "Speed"
description = "Velocity scale of the surface layer of a fluid, the square root of the surface stress over the density of the fluid."
matches = [
  { target = "http://www.wikidata.org/entity/Q1695787", relation = "exact", verified = 2026-11-04 },
]
cf_standard_names = [{ name = "magnitude_of_surface_friction_velocity_in_air", relation = "narrow", verified = 2026-11-04 }]

[kinds.SurfaceLayerScaleOfDryStaticEnergy]
label = "Surface-Layer Scale of Dry Static Energy"
specialization_of = "SpecificEnergy"
description = "Scale of the dry static energy in the surface layer, its surface flux over the density of air and the friction velocity (IFS, s_*): a scale, not a dry static energy."

[kinds.SurfaceLayerScaleOfSpecificHumidity]
label = "Surface-Layer Scale of Specific Humidity"
specialization_of = "DimensionlessRatio"
units = ["GM-PER-KiloGM", "KiloGM-PER-KiloGM"]
description = "Scale of the specific humidity in the surface layer, its surface flux over the density of air and the friction velocity (IFS, q_*): a scale, not a humidity, positive for an upward flux; of the opposite sign to the scales defined by the profile (SurfaceLayerProfileScaleOfSpecificHumidity)."

[kinds.SurfaceLayerProfileScaleOfPotentialTemperature]
label = "Surface-Layer Profile Scale of Potential Temperature"
specialization_of = "TemperatureDifference"
description = "Scaling parameter T_* of the profile of potential temperature in the surface layer, dtheta/dz = T_* phi_T / (alpha_T kappa z), the potential temperature theta written T (Fairall et al. 1978, equation 8): a scale, not a temperature, positive when the potential temperature increases with height (stable conditions); of the opposite sign to the scales the IFS defines by surface fluxes."

[kinds.SurfaceLayerProfileScaleOfTemperature]
label = "Surface-Layer Profile Scale of Temperature"
specialization_of = "TemperatureDifference"
description = "Scaling parameter T_* of the profile of temperature in the surface layer, from the temperature difference between a height and the surface over ln(z/z_0T) - psi_T (Frederickson et al. 1994, equation 1): a scale, not a temperature, positive when the temperature increases with height; of the temperature, not of the potential temperature."

[kinds.SurfaceLayerProfileScaleOfMixingRatio]
label = "Surface-Layer Profile Scale of Mixing Ratio"
specialization_of = "DimensionlessRatio"
units = ["GM-PER-KiloGM", "KiloGM-PER-KiloGM"]
description = "Scaling parameter q_* of the profile of the water vapour mixing ratio in the surface layer, dq/dz = q_* phi_q / (alpha_q kappa z) (Fairall et al. 1978, equation 8), in g/kg: a scale, not a mixing ratio, negative when the mixing ratio decreases with height, as over an evaporating sea."

[kinds.SurfaceLayerProfileScaleOfSpecificHumidity]
label = "Surface-Layer Profile Scale of Specific Humidity"
specialization_of = "DimensionlessRatio"
units = ["GM-PER-KiloGM", "KiloGM-PER-KiloGM"]
description = "Scaling parameter q_* of the profile of specific humidity in the surface layer, from the humidity difference between a height and the surface over ln(z/z_0q) - psi_q (Frederickson et al. 1994, equation 1): a scale, not a humidity, almost always negative over the sea (p. 4); of the opposite sign to the IFS's scale defined by the surface flux (SurfaceLayerScaleOfSpecificHumidity)."

[kinds.RoughnessLengthForMomentum]
label = "Roughness Length for Momentum"
specialization_of = "Length"
bounds = { low = 0, high = inf, unit = "M", criterion = "A height above the surface, never negative by its definition." }
description = "Height at which the logarithmic profile of the mean velocity of a flow over a surface, the wind in air, extended downwards, vanishes."
matches = [
  { target = "http://www.wikidata.org/entity/Q7370913", relation = "narrow", verified = 2026-11-04 },
]
cf_standard_names = [{ name = "surface_roughness_length_for_momentum_in_air", relation = "narrow", verified = 2026-11-04 }]

[kinds.RoughnessLengthForHeat]
label = "Roughness Length for Heat"
specialization_of = "Length"
bounds = { low = 0, high = inf, unit = "M", criterion = "A height above the surface, never negative by its definition." }
description = "Height at which the logarithmic profile of temperature of a flow over a surface (of dry static energy in the IFS), extended downwards, reaches its surface value."
cf_standard_names = [{ name = "surface_roughness_length_for_heat_in_air", relation = "narrow", verified = 2026-11-04 }]

[kinds.RoughnessLengthForHumidity]
label = "Roughness Length for Humidity"
specialization_of = "Length"
bounds = { low = 0, high = inf, unit = "M", criterion = "A height above the surface, never negative by its definition." }
description = "Height at which the profile of specific humidity of the surface layer of the air, extended downwards, reaches its surface value: the air's by nature, as is humidity."
cf_standard_names = [{ name = "surface_roughness_length_for_humidity_in_air", relation = "exact", verified = 2026-11-04 }]

[kinds.StabilityParameter]
label = "Stability Parameter"
specialization_of = "DimensionlessRatio"
description = "Height over the Obukhov length, zeta = z/L: negative in unstable conditions, positive in stable ones."

[kinds.ScaledStabilityParameter]
label = "Scaled Stability Parameter"
specialization_of = "DimensionlessRatio"
description = "Minus the stability parameter times the constant of a flux-profile relation, eta = -gamma z/L, positive in unstable conditions: the variable of the KEYPS and Helfand relations as Long (1984) writes them. Not the stability parameter, whose values cannot feed it."

[kinds.GradientFunctionForMomentum]
label = "Gradient Function for Momentum"
specialization_of = "DimensionlessRatio"
description = "Dimensionless vertical gradient of the mean velocity in the surface layer of a fluid, the wind in air, (kappa z / u_*) du/dz, a function of the stability parameter (Monin-Obukhov similarity)."

[kinds.GradientFunctionForHeat]
label = "Gradient Function for Heat"
specialization_of = "DimensionlessRatio"
description = "Dimensionless vertical gradient of temperature, or of another scalar, in the surface layer of a fluid, a function of the stability parameter, 1 in neutral conditions: (kappa z / s_*) ds/dz with the dry static energy in the IFS, which takes the same function for specific humidity; (alpha_T kappa z / T_*) dT/dz in Fairall et al. (1978), whose profile equation carries the diffusivity ratio alpha_T = 1.35 so that the function is 1 in neutral conditions. Not the phi_h of Businger et al. (1971), 0.74 in neutral conditions."

[kinds.ProfileFunctionForMomentum]
label = "Profile Function for Momentum"
specialization_of = "DimensionlessRatio"
description = "Stability correction to the logarithmic profile of the mean velocity in the surface layer of a fluid, the wind in air, Psi_M, tied to the gradient function by Phi = 1 - zeta dPsi/dzeta."

[kinds.ProfileFunctionForHeat]
label = "Profile Function for Heat"
specialization_of = "DimensionlessRatio"
description = "Stability correction to the logarithmic profile of temperature, or of another scalar, in the surface layer of a fluid, Psi_H: of dry static energy and of specific humidity in the IFS, of potential refractivity in the evaporation duct model of Jeske."

[kinds.BulkRichardsonNumber]
label = "Bulk Richardson Number"
specialization_of = "DimensionlessRatio"
description = "Ratio of buoyancy to wind shear across a layer, from the differences of virtual potential temperature, or of dry static energy and specific humidity, between its bounds."
matches = [
  { target = "http://www.wikidata.org/entity/Q1004118", relation = "exact", verified = 2026-11-04 },
]

[kinds.GradientRichardsonNumber]
label = "Gradient Richardson Number"
specialization_of = "DimensionlessRatio"
description = "Ratio of buoyancy to wind shear at a height, (g/theta) (dtheta/dz) / (du/dz)^2, from the vertical gradients themselves: z/L Phi_H / Phi_M^2 in the surface layer (Dyer and Hicks 1970). Not the bulk Richardson number, from differences across a layer."

[kinds.CharnockCoefficient]
label = "Charnock Coefficient"
specialization_of = "DimensionlessRatio"
description = "The roughness length of the sea surface for rough flow, normalized by the friction velocity and the acceleration of gravity, alpha = g z_0 / u_*^2 (Charnock 1955); also named the Charnock parameter (trade term), the dimensionless form of an inverse Froude number (Edson et al. 2013)."
bounds = { low = 0, high = inf, unit = "UNITLESS", criterion = "g z_0 / u_*^2, from a roughness length: never negative." }

[kinds.BackgroundRoughnessLength]
label = "Background Roughness Length"
specialization_of = "Length"
description = "The part of the roughness length of the sea surface due to the short gravity-capillary waves, z_b, which the stress the longer waves support enhances into the roughness length for momentum, z_0 = z_b / (1 - tau_w/tau_a)^(1/2) (IFS wave model): not the roughness length itself."
bounds = { low = 0, high = inf, unit = "M", criterion = "A part of a roughness length, never negative." }

[kinds.BackgroundCharnockCoefficient]
label = "Background Charnock Coefficient"
specialization_of = "DimensionlessRatio"
description = "The coefficient of the Charnock relation for the background roughness of gravity-capillary waves, alpha^ = g z_b / u_*^2 (IFS wave model until CY49R1): not the Charnock coefficient of the roughness length, which the wave stress enhances."
bounds = { low = 0, high = inf, unit = "UNITLESS", criterion = "g z_b / u_*^2, from a part of a roughness length: never negative." }

[kinds.RoughnessReynoldsNumber]
label = "Roughness Reynolds Number"
specialization_of = "DimensionlessRatio"
description = "The roughness length times the friction velocity over the kinematic viscosity of the fluid, R_r = z_0 u_*/nu: smooth flow below about 0.13, rough flow above about 2.5 (Businger 1985). Businger (1985) also calls u_*^3/(nu g) a roughness Reynolds number."
bounds = { low = 0, high = inf, unit = "UNITLESS", criterion = "z_0 u_*/nu, of quantities never negative." }

[kinds.EquivalentNeutralWindSpeed]
label = "Equivalent Neutral Wind Speed"
specialization_of = "Speed"
description = "The wind speed the surface layer would have at a height, 10 m in most sources, for its friction velocity and roughness length in neutral conditions, u_*/kappa ln(z/z_0): not a speed of the air, which departs from it with stability."
bounds = { low = 0, high = inf, unit = "M-PER-SEC", criterion = "A speed, never negative." }

[kinds.SurfaceDragCoefficientForMomentum]
label = "Surface Drag Coefficient for Momentum"
specialization_of = "DimensionlessRatio"
bounds = { low = 0, high = inf, unit = "UNITLESS", criterion = "A transfer coefficient, never negative: the surface stress opposes the flow." }
description = "Transfer coefficient relating the surface stress to the square of the speed of the flow at a height, the wind in air, tau = rho C_M |U|^2. Not the drag coefficient of a body in a flow (QUDT DragCoefficient)."
cf_standard_names = [{ name = "surface_drag_coefficient_for_momentum_in_air", relation = "narrow", verified = 2026-11-04 }]

[kinds.SurfaceDragCoefficientForHeat]
label = "Surface Drag Coefficient for Heat"
specialization_of = "DimensionlessRatio"
bounds = { low = 0, high = inf, unit = "UNITLESS", criterion = "A transfer coefficient, never negative: heat flows down the difference of temperature." }
description = "Transfer coefficient relating the surface flux of heat to the speed of the flow and the difference of temperature between a height and the surface; of dry static energy in the IFS, J_s = rho C_H |U| (s - s_surf)."
cf_standard_names = [{ name = "surface_drag_coefficient_for_heat_in_air", relation = "narrow", verified = 2026-11-04 }]

[kinds.NeutralSurfaceDragCoefficientForMomentum]
label = "Neutral Surface Drag Coefficient for Momentum"
specialization_of = "DimensionlessRatio"
description = "The value the transfer coefficient for momentum (the drag coefficient) takes in neutral conditions, from the logarithmic profiles alone, at a height (10 m in most sources): not the coefficient itself, which depends on stability and which it cannot replace."
bounds = { low = 0, high = inf, unit = "UNITLESS", criterion = "A transfer coefficient, never negative." }

[kinds.NeutralSurfaceDragCoefficientForHeat]
label = "Neutral Surface Drag Coefficient for Heat"
specialization_of = "DimensionlessRatio"
description = "The value the transfer coefficient for heat (the Stanton number) takes in neutral conditions, from the logarithmic profiles alone, at a height (10 m in most sources): not the coefficient itself, which depends on stability and which it cannot replace."
bounds = { low = 0, high = inf, unit = "UNITLESS", criterion = "A transfer coefficient, never negative." }

[kinds.NeutralSurfaceDragCoefficientForHumidity]
label = "Neutral Surface Drag Coefficient for Humidity"
specialization_of = "DimensionlessRatio"
description = "The value the transfer coefficient for humidity (the Dalton number) takes in neutral conditions, from the logarithmic profiles alone, at a height (10 m in most sources): not the coefficient itself, which depends on stability and which it cannot replace."
bounds = { low = 0, high = inf, unit = "UNITLESS", criterion = "A transfer coefficient, never negative." }

[kinds.TransferStabilityFactorForMomentum]
label = "Transfer Stability Factor for Momentum"
specialization_of = "DimensionlessRatio"
description = "The transfer coefficient for momentum over its neutral value at the same height and roughness, C/C_N, a function of the bulk Richardson number (Louis et al. 1982)."
bounds = { low = 0, high = inf, unit = "UNITLESS", criterion = "A ratio of transfer coefficients, never negative." }

[kinds.TransferStabilityFactorForHeat]
label = "Transfer Stability Factor for Heat"
specialization_of = "DimensionlessRatio"
description = "The transfer coefficient for heat over its neutral value at the same height and roughness, C/C_N, a function of the bulk Richardson number (Louis et al. 1982)."
bounds = { low = 0, high = inf, unit = "UNITLESS", criterion = "A ratio of transfer coefficients, never negative." }

[kinds.SurfaceDragCoefficientForHumidity]
label = "Surface Drag Coefficient for Humidity"
specialization_of = "DimensionlessRatio"
bounds = { low = 0, high = inf, unit = "UNITLESS", criterion = "A transfer coefficient, never negative: water vapour flows down the difference of humidity." }
description = "Transfer coefficient relating the surface flux of water vapour to the speed of the flow and the difference of specific humidity between a height and the surface, the Dalton number; in the IFS, J_q = rho C_Q |U_n| (alpha_n q_n - alpha_surf q_surf)."

[kinds.SurfaceDownwardSensibleHeatFlux]
label = "Surface Downward Sensible Heat Flux"
specialization_of = "HeatFluxDensity"
description = "Flux of sensible heat across the surface, positive toward it, from the air into the sea or the ground, as the IFS and Large and Yeager (2004) write it: negative when the surface warms the air."
cf_standard_names = [{ name = "surface_downward_sensible_heat_flux", relation = "exact", verified = 2026-11-08 }]

[kinds.SurfaceDownwardLatentHeatFlux]
label = "Surface Downward Latent Heat Flux"
specialization_of = "HeatFluxDensity"
description = "Flux of latent heat across the surface, positive toward it, the latent heat of vaporization times the downward flux of water vapour: negative over an evaporating sea."
cf_standard_names = [{ name = "surface_downward_latent_heat_flux", relation = "exact", verified = 2026-11-08 }]

[kinds.SurfaceDownwardWaterVapourFlux]
label = "Surface Downward Water Vapour Flux"
specialization_of = "MassPerAreaTime"
description = "Mass flux of water vapour across the surface, positive toward it, as the IFS and Large and Yeager (2004) write it: negative over an evaporating sea, the opposite of the evaporation; CF names the upward flux, surface_upward_water_vapor_flux_in_air, of the opposite sign."

[kinds.MagnitudeOfSurfaceDownwardStress]
label = "Magnitude of Surface Downward Stress"
specialization_of = "Stress"
bounds = { low = 0, high = inf, unit = "PA", criterion = "The magnitude of a vector, never negative." }
description = "Magnitude of the stress the air exerts on the surface, the downward flux of horizontal momentum, rho u_*^2."
cf_standard_names = [{ name = "magnitude_of_surface_downward_stress", relation = "exact", verified = 2026-11-08 }]

[kinds.SeaIceAreaFraction]
label = "Sea Ice Area Fraction"
specialization_of = "DimensionlessRatio"
bounds = { low = 0, high = 1, unit = "UNITLESS", criterion = "A part of an area over the whole area, from 0 to 1 by its definition." }
description = "Fraction of an area of sea covered by sea ice, the sea ice concentration."
matches = [
  { target = "http://www.wikidata.org/entity/Q7440064", relation = "exact", verified = 2026-11-04 },
]
cf_standard_names = [{ name = "sea_ice_area_fraction", relation = "exact", verified = 2026-11-04 }]

[kinds.Visibility]
label = "Visibility"
specialization_of = "Length"
bounds = { low = 0, high = inf, unit = "M", criterion = "A distance, never negative by its definition." }
description = "Greatest distance at which a black object can be seen against the horizon sky, from the extinction coefficient and a liminal contrast (Koschmieder): the contrast of 0.02 of the IFS, of 0.05 for the meteorological optical range of WMO."
cf_standard_names = [{ name = "visibility_in_air", relation = "narrow", verified = 2026-11-04 }]

# --- Constants --------------------------------------------------------

[constants.kappa_ecmwf_ifs]
identifier = "kappa"
value = 0.4
unit = "UNITLESS"
description = "Von Karman constant of the ECMWF IFS (CY49R1, Part IV, under equation 3.10)"
reference = "ecmwf_ifs_cy49r1"
nature = "conventional"
note = "The constant of the logarithmic wind profile, not the ratio R/c_p that other sources call kappa."

[constants.nu_ecmwf_ifs]
identifier = "nu"
value = 1.5e-5
unit = "M2-PER-SEC"
description = "Kinematic viscosity of air of the ECMWF IFS, for the smooth-surface roughness lengths over sea (CY49R1, Part IV, 3.2.4)"
reference = "ecmwf_ifs_cy49r1"
nature = "conventional"
note = "A constant, where ISO 2533 gives the kinematic viscosity of air as a function of temperature and pressure (iso2533_kinematic_viscosity_of_air): at 1013.25 hPa, 1.24e-5 m2 s-1 at -10 degC, 1.33e-5 at 0 degC, 1.46e-5 at 15 degC and 1.60e-5 at 30 degC, from which the constant departs by +21, +13 and +2.7 %, then -6 % (computed by nomogram, ISO 2533 as the reference of the comparison)."

# --- Obukhov length ---------------------------------------------------

[formulations.ecmwf_ifs_obukhov_length]
label = "Obukhov length from the surface-layer scales (IFS)"
expression = "-u_s**3 / (kappa * g_n / T_n * (u_s * s_s / c_pd + (R_v / R_d - 1) * T_n * u_s * q_s))"
fixed_units = false
note = "Equation 3.10, with the virtual temperature flux Q_0v = u_* s_*/c_p + epsilon T_n u_* q_* written out, epsilon = R_vap/R_dry - 1. T_n is the temperature of the lowest model level, a reference near the surface."
output = { identifier = "L", kind = "ObukhovLength", unit = "M", description = "Obukhov length" }
inputs = [
  { identifier = "u_s", kind = "FrictionVelocity", unit = "M-PER-SEC", description = "Friction velocity" },
  { identifier = "s_s", kind = "SurfaceLayerScaleOfDryStaticEnergy", unit = "J-PER-KiloGM", description = "Surface-layer scale of dry static energy" },
  { identifier = "q_s", kind = "SurfaceLayerScaleOfSpecificHumidity", unit = "KiloGM-PER-KiloGM", description = "Surface-layer scale of specific humidity" },
  { identifier = "T_n", kind = "ThermodynamicTemperature", unit = "K", description = "Temperature near the surface (lowest model level)" },
]
constants = ["kappa_ecmwf_ifs", "g_n_cgpm1901", "c_pd_ecmwf_ifs", "R_v_ecmwf_ifs", "R_d_ecmwf_ifs"]
keywords = ["Obukhov length", "Monin-Obukhov", "stability", "IFS"]

[[formulations.ecmwf_ifs_obukhov_length.citations]]
reference = "ecmwf_ifs_cy49r1"
equation = "3.10"
notation = { L = '\mathcal{L}', u_s = "u_*", s_s = "s_*", q_s = "q_*", kappa = '\kappa', g_n = "g", c_pd = "c_p" }
assumptions = ["The turbulent fluxes are constant with height in the surface layer, equal to their surface values (section 3.2)."]

# --- Gradient functions -----------------------------------------------

[formulations.ecmwf_ifs_gradient_function_momentum_unstable]
label = "Gradient function for momentum, unstable conditions (Dyer and Hicks 1970, IFS)"
expression = "(1 - 16 * zeta) ** (-1 / 4)"
fixed_units = false
output = { identifier = "Phi_M", kind = "GradientFunctionForMomentum", unit = "UNITLESS", description = "Gradient function for momentum" }
inputs = [
  { identifier = "zeta", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter z/L" },
]
keywords = ["gradient function", "Monin-Obukhov", "unstable", "IFS"]

[[formulations.ecmwf_ifs_gradient_function_momentum_unstable.citations]]
reference = "ecmwf_ifs_cy49r1"
equation = "3.21"
notation = { Phi_M = '\Phi_{\mathrm{M}}', zeta = '\zeta' }
assumptions = ["Unstable conditions, zeta = z/L < 0 (section 3.2.2 (i))."]

