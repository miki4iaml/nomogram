[formulations.long1984_gust_momentum]
label = "Gradient function for momentum, KEYPS quartic in the scaled stability parameter (Long 1984)"
expression = "Phi_M**4 + eta * Phi_M**3 - 1 == 0"
fixed_units = false
note = "Equation 1.7a, phi_m^4 - gamma_m z/L phi_m^3 - 1 = 0, written with eta = -gamma_m z/L; gamma_m is not given a value. With gamma_m = 9 it is the KEYPS formula of Businger et al. (1971, businger1971_keyps). For weak instability phi_m tends to (1 + eta)^(-1/4) (2.4a), for strong instability to eta^(-1/3) (p. 9)."
output = { identifier = "Phi_M", kind = "GradientFunctionForMomentum", unit = "UNITLESS", description = "Gradient function for momentum" }
inputs = [
  { identifier = "eta", kind = "ScaledStabilityParameter", unit = "UNITLESS", description = "Scaled stability parameter -gamma_m z/L" },
]
