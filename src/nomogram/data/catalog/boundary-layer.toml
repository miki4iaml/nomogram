note = "Read on the page images, p. 181-185: the dimensionless wind shear phi_m = (kz/u_*) dU-bar/dz and temperature gradient phi_h = (z/theta_*) dtheta-bar/dz, theta_* = -overline(w'theta')/(k u_*), the bar a time mean and the prime the departure from it (p. 182) (equations 2 and 3); the KEYPS formula phi_m^4 - 9 zeta phi_m^3 = 1 (7), phi_m = (1 - 15 zeta)^(-1/4) unstable (8) and 1 + 4.7 zeta stable (10); phi_h(0) of about 0.74, phi_h/phi_h(0) = (1 + 4 |zeta|^(3/4))^(-2/3) (11, after Elliott) or (1 - 9 zeta)^(-1/2) (12, Businger-Dyer) unstable, phi_h = 0.74 + 4.7 zeta stable (14); k of about 0.35 and a neutral ratio of eddy diffusivities of about 1.35 (abstract). DOI checked with Crossref on 2026-11-07."

[references.beljaars1992]
