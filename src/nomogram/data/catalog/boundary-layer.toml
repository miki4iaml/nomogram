# --- Bulk Richardson number -------------------------------------------
# Explicit forms only: the IFS solves 3.25 for zeta by Newton iterations,
# which no formulation writes.

[formulations.ecmwf_ifs_bulk_richardson_number]
label = "Bulk Richardson number of the surface layer from virtual potential temperatures (IFS)"
expression = "g_n / theta_v * z_n * (theta_vn - theta_vsurf) / U_n**2"
fixed_units = false
output = { identifier = "Ri_b", kind = "BulkRichardsonNumber", unit = "UNITLESS", description = "Bulk Richardson number" }
inputs = [
  { identifier = "theta_v", kind = "VirtualPotentialTemperature", unit = "K", description = "Virtual potential temperature within the surface layer" },
  { identifier = "z_n", kind = "Height", unit = "M", description = "Height of the lowest model level" },
  { identifier = "theta_vn", kind = "VirtualPotentialTemperature", unit = "K", description = "Virtual potential temperature at the lowest model level" },
  { identifier = "theta_vsurf", kind = "VirtualPotentialTemperature", unit = "K", description = "Virtual potential temperature at the surface" },
  { identifier = "U_n", kind = "Speed", unit = "M-PER-SEC", description = "Wind speed at the lowest model level, with the free-convection velocity (equation 3.19)" },
]
constants = ["g_n_cgpm1901"]
keywords = ["Richardson number", "stability", "IFS"]

[[formulations.ecmwf_ifs_bulk_richardson_number.citations]]
reference = "ecmwf_ifs_cy49r1"
equation = "3.26"
notation = { Ri_b = 'Ri_{\mathrm{bulk}}', g_n = "g", theta_v = '\theta_v', theta_vn = '\theta_{vn}', theta_vsurf = '\theta_{v\mathrm{surf}}', U_n = "|U_n|" }

[formulations.ecmwf_ifs_bulk_richardson_number_dry_static_energy]
label = "Bulk Richardson number of the surface layer from dry static energy and specific humidity (IFS)"
expression = "g_n * z_n / U_n**2 * (2 * (s_n - s_surf) / (s_n + s_surf - g_n * z_n) + (R_v / R_d - 1) * (q_n - q_surf))"
fixed_units = false
output = { identifier = "Ri_b", kind = "BulkRichardsonNumber", unit = "UNITLESS", description = "Bulk Richardson number" }
inputs = [
  { identifier = "z_n", kind = "Height", unit = "M", description = "Height of the lowest model level" },
  { identifier = "U_n", kind = "Speed", unit = "M-PER-SEC", description = "Wind speed at the lowest model level, with the free-convection velocity (equation 3.19)" },
  { identifier = "s_n", kind = "DryStaticEnergy", unit = "J-PER-KiloGM", description = "Dry static energy at the lowest model level" },
  { identifier = "s_surf", kind = "DryStaticEnergy", unit = "J-PER-KiloGM", description = "Dry static energy at the surface" },
  { identifier = "q_n", kind = "SpecificHumidity", unit = "KiloGM-PER-KiloGM", description = "Specific humidity at the lowest model level" },
  { identifier = "q_surf", kind = "SpecificHumidity", unit = "KiloGM-PER-KiloGM", description = "Specific humidity at the surface" },
]
constants = ["g_n_cgpm1901", "R_v_ecmwf_ifs", "R_d_ecmwf_ifs"]
keywords = ["Richardson number", "stability", "dry static energy", "IFS"]

[[formulations.ecmwf_ifs_bulk_richardson_number_dry_static_energy.citations]]
reference = "ecmwf_ifs_cy49r1"
equation = "3.27"
notation = { Ri_b = 'Ri_{\mathrm{bulk}}', g_n = "g", U_n = "|U_n|", s_surf = 's_{\mathrm{surf}}', q_surf = 'q_{\mathrm{surf}}' }
assumptions = ["Equation 3.26 expressed in terms of dry static energy (text above 3.27), with epsilon = R_vap/R_dry - 1."]

