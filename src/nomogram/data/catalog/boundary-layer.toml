#
# Boundary layer: the surface layer of the ECMWF IFS (Part IV, section
# 3.2), after Monin-Obukhov similarity: the Obukhov length, the gradient
# and profile functions of stability, the bulk Richardson number, the
# roughness lengths over sea and sea ice, the transfer coefficients and
# the friction velocity.
# Hand-written, validated when loaded by nomogram.catalog. Entries whose
# details were not checked against the source carry status = "to-confirm".

[catalog]
name = "boundary-layer"
label = "Surface layer of the atmospheric boundary layer"
format = 2
requires = ["atmosphere"]
keywords = ["boundary layer", "surface layer", "Monin-Obukhov", "turbulence"]

