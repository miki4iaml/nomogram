  { identifier = "q_s", kind = "SurfaceLayerProfileScaleOfSpecificHumidity", unit = "KiloGM-PER-KiloGM", description = "Scale of specific humidity of the surface layer" },
  { identifier = "g", kind = "AccelerationOfGravity", unit = "M-PER-SEC2", description = "Acceleration of gravity at the latitude" },
]
coefficients = { k = 0.4, c = 0.61 }
keywords = ["Obukhov length", "Monin-Obukhov", "COARE"]

[[formulations.coare36_obukhov_length.citations]]
