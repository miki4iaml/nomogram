[formulations.ecmwf_ifs_wind_speed_10m]
label = "Wind speed at 10 m, from the blending height with the profile functions (IFS)"
expression = "F_blend * (ln((z_10 + z_0) / z_0) - Psi_M(zeta=zeta_10) + Psi_M(zeta=zeta_0)) / (ln((z_blend + z_0) / z_0) - Psi_M(zeta=zeta_blend) + Psi_M(zeta=zeta_0))"
calls = { Psi_M = "ecmwf_ifs_profile_function_momentum" }
fixed_units = false
note = "Equation 3.106. The blending height and the roughness length follow the rule of 3.105, which chooses the inputs rather than computing them: over rough terrain, z_0M > 0.03 m, z_blend = 40 m with the wind interpolated there from the model levels, and z_0MWMO = 0.03 m, a grassland's, for the exposure of WMO stations in open terrain; otherwise the lowest model level and z_0M itself. The 10-metre equivalent-neutral wind (3.107) is not entered: not a speed of the air, it would need a kind of its own."
output = { identifier = "F_10", kind = "Speed", unit = "M-PER-SEC", description = "Wind speed at 10 m" }
inputs = [
  { identifier = "F_blend", kind = "Speed", unit = "M-PER-SEC", description = "Wind speed at the blending height" },
  { identifier = "z_blend", kind = "Height", unit = "M", description = "Blending height" },
  { identifier = "z_0", kind = "RoughnessLengthForMomentum", unit = "M", description = "Roughness length for momentum of the interpolation (z_0MWMO)" },
  { identifier = "zeta_10", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter at 10 m, (z_10 + z_0MWMO)/L" },
  { identifier = "zeta_blend", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter at the blending height, (z_blend + z_0MWMO)/L" },
  { identifier = "zeta_0", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter at the roughness length, z_0MWMO/L" },
]
coefficients = { z_10 = 10 }
keywords = ["10 m wind", "interpolation", "exposure", "diagnostic", "IFS"]

