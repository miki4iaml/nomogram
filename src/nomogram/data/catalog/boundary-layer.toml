  { identifier = "L", kind = "ObukhovLength", unit = "M", description = "Obukhov length" },
  { identifier = "g", kind = "AccelerationOfGravity", unit = "M-PER-SEC2", description = "Acceleration of gravity at the latitude" },
]
coefficients = { k = 0.4, c_pa = { value = 1004.67, unit = "J-PER-KiloGM-K", unit_basis = "added", note = "The specific heat of air, in J/(kg K), its unit not written in the code." } }
