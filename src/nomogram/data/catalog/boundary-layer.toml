[formulations.ecmwf_ifs_visibility]
label = "Visibility from the extinction coefficient, Koschmieder's law with a contrast of 0.02 (IFS)"
expression = "-ln(epsilon) / beta_tot"
fixed_units = false
note = "Equation 3.117, at the lowest model level (10 m, the lowest 20 m of the atmosphere). The total extinction coefficient is a sum over clean air, aerosol, cloud and precipitation (3.118); both cycles print the clean air term with a minus sign, contrary to the text, which ties clean air to the maximum visibility of 100 km: a sign to read as a plus. The empirical coefficients of each term are not entered."
output = { identifier = "V", kind = "Visibility", unit = "M", description = "Visibility" }
inputs = [
  { identifier = "beta_tot", kind = "AttenuationCoefficient", unit = "PER-M", description = "Total extinction coefficient for optical wavelengths" },
]
coefficients = { epsilon = { value = 0.02, note = "Liminal contrast, after Koschmieder (1924)." } }
keywords = ["visibility", "Koschmieder", "extinction coefficient", "fog", "diagnostic", "IFS"]

