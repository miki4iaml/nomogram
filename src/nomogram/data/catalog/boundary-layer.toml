[formulations.long1984_gust_heat]
label = "Gradient function for heat, cubic of Helfand in the scaled stability parameter (Long 1984)"
expression = "Phi_H**2 + eta * Phi_H**3 - 1 == 0"
fixed_units = false
note = "Equation 1.7b, phi_h^2 - gamma_h z/L phi_h^3 - 1 = 0, which Helfand proposed (1984, a personal communication), written with eta = -gamma_h z/L; gamma_h is not given a value. phi_h is the gradient of temperature over the neutral Prandtl number (1.1b), 1 in neutral conditions. For weak instability phi_h tends to (1 + eta)^(-1/2) (2.4b), for strong instability to eta^(-1/3) (p. 9)."
output = { identifier = "Phi_H", kind = "GradientFunctionForHeat", unit = "UNITLESS", description = "Gradient function for heat" }
inputs = [
  { identifier = "eta", kind = "ScaledStabilityParameter", unit = "UNITLESS", description = "Scaled stability parameter -gamma_h z/L" },
]
keywords = ["gradient function", "Helfand", "GUST", "Monin-Obukhov", "unstable", "implicit equation"]

