expression = "T * u_s**2 / (k * g * (T_s + c * T * q_s))"
fixed_units = false
note = "As coded in the loop, the buoyancy of the original COARE version (0.61), ta = t + T2K with T2K = 273.16; the form of Frederickson et al. (1994, frederickson1994_obukhov_length) with the gravity at the latitude."
