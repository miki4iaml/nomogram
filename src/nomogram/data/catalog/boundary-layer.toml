expression = "-b * (zeta - c / d) * exp(-d * zeta) - a * zeta - b * c / d"
fixed_units = false
note = "The IFS attributes the form to Holtslag and De Bruin (1988), with a modification for a critical flux Richardson number at large zeta; its constants a = 1, b = 2/3, c = 5, d = 0.35 are those of Beljaars and Holtslag (1991), where Holtslag and De Bruin have a = 0.7 and b = 0.75 (Andreas 2002, equations 3.4 and 3.5, pp. 421-422, which give the gradient functions whose integrals these are: beljaars_holtslag1991_gradient_function_*_stable). Beljaars (1992, equations 39 to 49) prints b = 0.667."
output = { identifier = "Psi_M", kind = "ProfileFunctionForMomentum", unit = "UNITLESS", description = "Profile function for momentum" }
inputs = [
  { identifier = "zeta", kind = "StabilityParameter", unit = "UNITLESS", description = "Stability parameter z/L" },
]
coefficients = { a = 1, b = { value = 0.6666666666666666, note = "2/3 in the source." }, c = 5, d = 0.35 }
keywords = ["profile function", "Monin-Obukhov", "stable", "Holtslag", "Beljaars", "IFS"]

