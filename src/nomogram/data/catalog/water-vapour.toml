# --- Formulations -----------------------------------------------------

[formulations.sonntag1990_magnus]
label = "Magnus form, Sonntag (1990) coefficients"
expression = "C * exp(A * t / (B + t))"
fixed_units = true
note = "Coefficients adopted by the WMO guide and quoted as SA90 by Alduchov and Eskridge (1996, Table II), who find a maximum relative error of 0.597 % against GG46, WE76 and SO90 between -40 and 50 degC (Table III). Not to be confused with Sonntag's own formulation (sonntag1990)."
output = { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "HectoPA", description = "Saturation vapour pressure over water" }
inputs = [
  { identifier = "t", kind = "CelsiusTemperature", unit = "DEG_C", description = "Celsius temperature" },
]
coefficients = { A = 17.62, B = 243.12, C = 6.112 }

[[formulations.sonntag1990_magnus.citations]]
reference = "sonntag1990"
scales = { t = "its90" }

[[formulations.sonntag1990_magnus.citations]]
reference = "wmo2024"

[[formulations.sonntag1990_magnus.citations.domains]]
bounds = { t = [-45.0, 60.0] }
criterion = "Uncertainty within 0.6 % (k=2), as quoted by the WMO guide."

[[formulations.sonntag1990_magnus.citations]]
reference = "alduchov_eskridge1996"

[formulations.iapws_sr1_86]
label = "IAPWS SR1-86(1992), Wagner and Pruß equation"
expression = "p_c * exp(T_c / T * (a1 * (1 - T / T_c) + a2 * (1 - T / T_c) ** 1.5 + a3 * (1 - T / T_c) ** 3 + a4 * (1 - T / T_c) ** 3.5 + a5 * (1 - T / T_c) ** 4 + a6 * (1 - T / T_c) ** 7.5))"
fixed_units = true
note = "Reference formulation for comparisons. Reproduces Table 1 of the release: 611.657 Pa at 273.16 K, 101325 Pa at 373.1243 K."
output = { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "PA", description = "Saturation vapour pressure over water" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Thermodynamic temperature (ITS-90)" },
]

[formulations.iapws_sr1_86.coefficients]
T_c = { value = 647.096, note = "Critical temperature" }
p_c = { value = 22.064e6, note = "Critical pressure" }
a1 = -7.85951783
a2 = 1.84408259
a3 = -11.7866497
a4 = 22.6807411
a5 = -15.9618719
a6 = 1.80122502

[[formulations.iapws_sr1_86.citations]]
reference = "iapws_sr1_86"
units = { T_c = "K", p_c = "PA" }
scales = { T = "its90" }

[[formulations.iapws_sr1_86.citations.domains]]
bounds = { T = [273.16, 647.096] }
criterion = "Vapour-liquid equilibrium from the triple point to the critical point, endorsed by IAPWS (section 6)."

[[formulations.iapws_sr1_86.citations]]
reference = "wagner_pruss1993"

[formulations.sonntag1990]
label = "Sonntag (1990) formulation over water (SO90)"
expression = "exp(a0 / T + a1 + a2 * T + a3 * T ** 2 + a4 * ln(T))"
fixed_units = true
note = "As quoted by Alduchov and Eskridge (1996, equation 7); T on ITS-90. Vömel gives the same coefficients under Sonntag (1994): the year differs between secondary sources. Range not read in the original."
output = { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "HectoPA", description = "Saturation vapour pressure over water" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Thermodynamic temperature (ITS-90)" },
]
coefficients = { a0 = -6096.9385, a1 = 16.635794, a2 = -2.711193e-2, a3 = 1.673952e-5, a4 = 2.433502 }

