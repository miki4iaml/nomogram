# Ambaum (2020): the Clausius-Clapeyron equation integrated with a latent
# heat linear in temperature, over water and over ice.

[formulations.ambaum2020]
label = "Ambaum (2020) equation over water"
expression = "e_s0 * (T_0 / T) ** (Delta_c / R_v) * exp(L_0 / (R_v * T_0) - (L_0 - Delta_c * (T - T_0)) / (R_v * T))"
fixed_units = false
note = "Equation 13 with the latent heat of equation 15, L = L_0 - Delta_c (T - T_0), Delta_c standing for c_pl - c_pv: it satisfies the Clausius-Clapeyron equation exactly for that latent heat. The constants are the triple-point values Ambaum recommends (equation 14). Its temperatures are on ITS-90, the scale Ambaum names where he compares with IAPWS-95 (p. 4255)."
output = { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "PA", description = "Saturation vapour pressure over water" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Thermodynamic temperature", scale = "its90", scale_basis = "inferred-from-numbers" },
]
coefficients = { e_s0 = 611.655, T_0 = 273.16, Delta_c = 2180.0, L_0 = 2.501e6, R_v = 461.52 }
keywords = ["saturation", "Clausius-Clapeyron"]

