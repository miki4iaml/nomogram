# Vaisala (2013), its conversion formulas: a simplified base-10 form, one
# entry per set of constants (Table 1, those of the atmosphere), and its
# equation over ice; its equation 3 is iapws_sr1_86.

[formulations.vaisala2013_water]
label = "Simplified base-10 form over water and supercooled water, Vaisala (2013), -20 to 50 degC"
expression = "C * 10 ** (A * t / (B + t))"
fixed_units = true
note = "Equation 6 with the first constants of Table 1, fitted by Vaisala to its equation 3 (Wagner and Pruss, iapws_sr1_86). Vaisala relates the relative humidity to supercooled water below 0 degC (p. 4)."
output = { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "HectoPA", description = "Saturation vapour pressure over water" }
inputs = [
  { identifier = "t", kind = "CelsiusTemperature", unit = "DEG_C", description = "Celsius temperature", scale = "its90", scale_basis = "inferred-from-date" },
]
coefficients = { A = 7.591386, B = 240.7263, C = 6.116441 }
keywords = ["saturation", "Magnus", "radiosonde"]

[[formulations.vaisala2013_water.citations]]
reference = "vaisala2013"
equation = "6"
notation = { e_s = 'P_{\mathrm{ws}}', C = "A", A = "m", B = 'T_n' }
note = "Table 1 (p. 7)."

