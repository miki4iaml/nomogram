notation = { e_s = "e", Delta_c = '\left(c_{\mathrm{pl}} - c_{\mathrm{pv}}\right)' }
assumptions = ["Water vapour as an ideal gas, so that c_pv is constant, which is 'only approximately valid' from 0 to 100 degC (p. 4254).", "The finite volume of the liquid water is ignored (section 4, p. 4256)."]
units = { e_s0 = "PA", T_0 = "K", Delta_c = "J-PER-KiloGM-K", L_0 = "J-PER-KiloGM", R_v = "J-PER-KiloGM-K" }

