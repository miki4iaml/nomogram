fixed_units = true
note = "Equation 6 with the constants of Table 1 for ice, fitted by Vaisala to its equation 5 (vaisala2013_saturation_ice)."
output = { identifier = "e_i", kind = "SaturationVapourPressureOverIce", unit = "HectoPA", description = "Saturation vapour pressure over ice" }
inputs = [
  { identifier = "t", kind = "CelsiusTemperature", unit = "DEG_C", description = "Celsius temperature", scale = "its90", scale_basis = "inferred-from-date" },
]
coefficients = { A = 9.778707, B = 273.1466, C = 6.114742 }
keywords = ["saturation", "Magnus", "ice", "radiosonde"]

[[formulations.vaisala2013_ice.citations]]
