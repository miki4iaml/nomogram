#
# Water vapour in equilibrium with water and ice: saturation vapour
# pressure formulations and their sources.
# Hand-written, validated when loaded by nomogram.catalog. Entries whose
# details were not checked against the source carry status = "to-confirm".

[catalog]
name = "water-vapour"
label = "Saturation vapour pressure of water"
format = 2
requires = ["core"]
keywords = ["water vapour", "saturation", "phase equilibrium"]

# --- Quantity kinds defined by nomogram -------------------------------

[kinds.SaturationVapourPressure]
label = "Saturation Vapour Pressure"
specialization_of = "VapourPressure"
description = "Pressure of water vapour in equilibrium with a plane surface of pure water, liquid or ice, at the same temperature: over water or over ice as the formulation states, or over the one or the other on each side of a temperature."
matches = [
  { target = "http://www.wikidata.org/entity/Q2387102", relation = "close", verified = 2026-10-24 },
]

[kinds.SaturationVapourPressureOverWater]
label = "Saturation Vapour Pressure over Water"
specialization_of = "SaturationVapourPressure"
description = "Pressure of water vapour in equilibrium with a plane surface of pure liquid water."
# The Wikidata item covers saturation over water and over ice: broader.
matches = [
  { target = "http://www.wikidata.org/entity/Q2387102", relation = "broad", verified = 2026-10-14 },
]

[kinds.SaturationVapourPressureOverIce]
label = "Saturation Vapour Pressure over Ice"
specialization_of = "SaturationVapourPressure"
description = "Pressure of water vapour in equilibrium with a plane surface of ice (ice Ih)."
# The Wikidata item covers saturation over water and over ice: broader.
matches = [
  { target = "http://www.wikidata.org/entity/Q2387102", relation = "broad", verified = 2026-10-14 },
]

