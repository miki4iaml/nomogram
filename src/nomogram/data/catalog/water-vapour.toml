# Hardy (1998): Wexler's formulations over water and over ice, refitted
# to ITS-90; Vaisala's RS41 radiosonde uses them (UAII 2022, Table 3.3).

[formulations.hardy1998_water]
label = "Hardy (1998) formulation over water, Wexler's refitted to ITS-90"
expression = "exp(g0 / T ** 2 + g1 / T + g2 + g3 * T + g4 * T ** 2 + g5 * T ** 3 + g6 * T ** 4 + g7 * ln(T))"
fixed_units = true
note = "Wexler's equation 15 with ITS-90 coefficients: within 0.05 ppm of Wexler's formulation, its temperature brought to IPTS-68, from -100 to 100 degC, Wexler's range of 0 to 100 degC being extrapolated below 0 degC; 611.657 Pa at the triple point. The formulation of Vaisala's RS41 and of the iMet-54 radiosondes (UAII 2022, Table 3.3)."
output = { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "PA", description = "Saturation vapour pressure over water" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Thermodynamic temperature (ITS-90)" },
]
coefficients = { g0 = -2.8365744e3, g1 = -6.028076559e3, g2 = 1.954263612e1, g3 = -2.737830188e-2, g4 = 1.6261698e-5, g5 = 7.0229056e-10, g6 = -1.8680009e-13, g7 = 2.7150305 }
keywords = ["saturation", "radiosonde"]

