container = "WMO, Instruments and Observing Methods Report No. 143, Geneva"
status = "verified"
note = "Read: Table 3.3 (p. 17), the vapour pressure equation each radiosonde of the campaign uses, as its manufacturer states it: Hyland and Wexler (1983) for CF-06-AH, DFM-17 and iMS-100; Goff and Gratch (1946) for GTH3; Wexler (1977) modified by Hardy (1998) for ITS-90 for iMet-54 and Vaisala's RS41; Sonntag (1990) for M20; Bolton (1980) for PS-B3; Buck (1981) for WxR-301D. It names the formulas and does not print them. Section 10.1.4 (pp. 138-139): relative humidity and dew point disagree between the BUFR and the manufacturers' files, negligibly near the surface, by more than 10 % in the upper troposphere, beyond typical measurement uncertainties, possibly through the inverse of the vapour pressure equation, BUFR coding the dew point. Appendix D: the vapour pressure formula (General.WVFormula) is a mandatory metadata of the campaign files. Table 9.2 (p. 119): the OSCAR uncertainty requirements, in %RH for the relative humidity."

# --- Formulations -----------------------------------------------------

[formulations.sonntag1990_magnus]
label = "Magnus form, Sonntag (1990) coefficients"
expression = "C * exp(A * t / (B + t))"
fixed_units = true
note = "Coefficients adopted by the WMO guide and quoted as SA90 by Alduchov and Eskridge (1996, Table II), who find a maximum relative error of 0.597 % against GG46, WE76 and SO90 between -40 and 50 degC (Table III). Not to be confused with Sonntag's own formulation (sonntag1990)."
output = { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "HectoPA", description = "Saturation vapour pressure over water" }
inputs = [
  { identifier = "t", kind = "CelsiusTemperature", unit = "DEG_C", description = "Celsius temperature" },
]
coefficients = { A = 17.62, B = 243.12, C = 6.112 }

[[formulations.sonntag1990_magnus.citations]]
reference = "sonntag1990"
scales = { t = "its90" }

[[formulations.sonntag1990_magnus.citations]]
reference = "wmo2024"
equation = "4.B.1"
notation = "wmo"

[[formulations.sonntag1990_magnus.citations.domains]]
bounds = { t = [-45.0, 60.0] }
criterion = "Sufficiently accurate for all normal meteorological applications; not suitable below -45 degC. No uncertainty stated."

[[formulations.sonntag1990_magnus.citations]]
reference = "wmo_etqtc2025"

[[formulations.sonntag1990_magnus.citations.domains]]
bounds = { t = [-45.0, 60.0] }
criterion = "Uncertainty up to 0.6 % (k = 2), attributed by the source to WMO-No. 8 (2023), Annex 4.B; not in the 2024 text."

[[formulations.sonntag1990_magnus.citations]]
reference = "alduchov_eskridge1996"

[formulations.iapws_sr1_86]
label = "IAPWS SR1-86(1992), Wagner and Pruß equation"
expression = "p_c * exp(T_c / T * (a1 * (1 - T / T_c) + a2 * (1 - T / T_c) ** 1.5 + a3 * (1 - T / T_c) ** 3 + a4 * (1 - T / T_c) ** 3.5 + a5 * (1 - T / T_c) ** 4 + a6 * (1 - T / T_c) ** 7.5))"
fixed_units = true
note = "Reference formulation for comparisons. Reproduces Table 1 of the release: 611.657 Pa at 273.16 K, 101325 Pa at 373.1243 K."
output = { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "PA", description = "Saturation vapour pressure over water" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Thermodynamic temperature (ITS-90)" },
]

