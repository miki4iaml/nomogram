status = "verified"
note = "Read on the page images of the copy hosted by a distributor (label.pl), Thunder Scientific no longer hosting it; the coefficients over water agree with NCAR's ASPEN documentation and with Vömel. Section 3: equation 2, Wexler's formulation over water refitted to ITS-90 (0 to 100 degC, extrapolated from -100 to +200 degC in the data, within 0.05 ppm of Wexler from -100 to 100 degC, 611.657 Pa at the triple point); equation 3, Wexler's over ice (-100 to 0.01 degC, within 0.3 ppm). Section 4: inverse equations for the dewpoint (4, within 0.3 mK of equation 2 from -100 to 100 degC) and the frostpoint (5, within 0.1 mK of equation 3 from -150 to 0.01 degC). Section 5: enhancement factors (equations 6 to 9), not entered."

[references.wmo_iom143]
authors = "Dirksen, R.; Haefele, A.; Vogt, F. P. A.; Sommer, M.; von Rohden, C.; Martucci, G.; Romanens, G.; Felix, C.; Modolo, L.; Vömel, H.; Simeonov, T.; Oelsner, P.; Edwards, D.; Oakley, T.; Gardiner, T.; Ansari, M. I."
year = 2024
