[formulations.bechtold2015_virtual_potential_temperature]
label = "Virtual potential temperature (Bechtold 2015)"
expression = "T_v * (p_0 / p) ** (R_d / c_pd)"
fixed_units = false
output = { identifier = "theta_v", kind = "VirtualPotentialTemperature", unit = "K", description = "Virtual potential temperature" }
