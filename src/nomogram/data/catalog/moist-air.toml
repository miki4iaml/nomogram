# MetPy 1.7.1: Ambaum (2020) equation 13 with MetPy's constants, and its
# psychrometric vapour pressure.

[formulations.metpy171_saturation_vapour_pressure]
label = "Saturation vapour pressure over water of MetPy, Ambaum (2020) equation 13 with MetPy constants"
expression = "e_s0 * (T_0 / T) ** ((c_l - c_pv) / R_v) * exp((L_v0 / T_0 - (L_v0 - (c_l - c_pv) * (T - T_0)) / T) / R_v)"
fixed_units = false
note = "The form of Ambaum (2020) equation 13, with the latent heat L_v0 - (c_l - c_pv)(T - T_0), but MetPy's constants rather than those Ambaum recommends (equation 14): e_s0 = 6.112 hPa against 611.655 Pa, c_l - c_pv = 2359 J kg-1 K-1 against 2180, L_v0 = 2.50084e6 J kg-1 against 2.501e6."
output = { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "HectoPA", description = "Saturation vapour pressure over water" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Thermodynamic temperature", scale = "its90", scale_basis = "inferred-from-date" },
]
coefficients = { e_s0 = 6.112, T_0 = 273.16 }
constants = ["L_v0_metpy", "c_l_metpy", "c_pv_metpy", "R_v_metpy"]
keywords = ["saturation", "Clausius-Clapeyron"]

[[formulations.metpy171_saturation_vapour_pressure.citations]]
reference = "metpy171"
note = "saturation_vapor_pressure with phase='liquid' and water_latent_heat_vaporization, in metpy.calc.thermo; e_s0 is sat_pressure_0c, 6.112 millibar."
units = { e_s0 = "HectoPA", T_0 = "K" }

[formulations.metpy171_psychrometric_vapour_pressure]
label = "Vapour pressure from a psychrometer with a wet bulb, MetPy default coefficient"
expression = "e_s(T=T_w) - A * p * (T - T_w)"
calls = { e_s = "metpy171_saturation_vapour_pressure" }
fixed_units = false
note = "The psychrometric formula of WMO-No. 8 (4.1) with MetPy's default psychrometer coefficient, 6.21e-4 K-1, which MetPy attributes to Fan (1987), and the saturation vapour pressure of pure water, without enhancement factor, at the wet-bulb temperature."
output = { identifier = "e", kind = "VapourPressure", unit = "HectoPA", description = "Vapour pressure" }
inputs = [
  { identifier = "p", kind = "Pressure", unit = "HectoPA", description = "Pressure" },
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Air (dry-bulb) temperature" },
  { identifier = "T_w", kind = "PsychrometerWetBulbTemperature", unit = "K", description = "Wet-bulb temperature" },
]
coefficients = { A = 6.21e-4 }
keywords = ["humidity", "psychrometer"]

[[formulations.metpy171_psychrometric_vapour_pressure.citations]]
reference = "metpy171"
note = "psychrometric_vapor_pressure_wet in metpy.calc.thermo, with psychrometer_coefficient left at its default."
units = { A = "PER-K" }

# The thermodynamics of MetPy 1.7.1 that its vertical tools use (layers,
# isentropic analysis, mixed parcel), with its constants: each the form
# of a printed equation (Bechtold 2015, WMO-No. 8), which the note names.

[formulations.metpy171_potential_temperature]
label = "Potential temperature, MetPy constants"
expression = "T * (p_0 / p) ** kappa"
fixed_units = false
note = "MetPy divides the temperature by the Exner function (p / P0)^kappa: equation 28 of Bechtold (2015, bechtold2015_potential_temperature) with kappa = R_d / c_pd = 2/7, from MetPy's ratio of specific heats 1.4, and P0 = 1000 hPa."
output = { identifier = "theta", kind = "PotentialTemperature", unit = "K", description = "Potential temperature" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Temperature" },
  { identifier = "p", kind = "Pressure", unit = "HectoPA", description = "Pressure" },
]
constants = ["kappa_metpy", "p_0_metpy"]
keywords = ["potential temperature", "adiabatic", "Exner function", "MetPy"]

[[formulations.metpy171_potential_temperature.citations]]
reference = "metpy171"
note = "exner_function and potential_temperature, calc/thermo.py lines 335 and 371."

[formulations.metpy171_temperature_from_potential_temperature]
label = "Temperature from the potential temperature, MetPy constants"
expression = "theta * (p / p_0) ** kappa"
fixed_units = false
note = "The potential temperature times the Exner function: the inverse of metpy171_potential_temperature, which MetPy codes as a function of its own; the mixed parcel brings its mean potential temperature back to a temperature so."
output = { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Temperature" }
inputs = [
  { identifier = "theta", kind = "PotentialTemperature", unit = "K", description = "Potential temperature" },
  { identifier = "p", kind = "Pressure", unit = "HectoPA", description = "Pressure" },
]
