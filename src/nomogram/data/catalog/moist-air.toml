# Basic state variables of the ECMWF IFS (CY49R1, Part IV, section 12.6,
# p. 247), with its constants: the physics computes the air density from
# the virtual temperature without condensates.

[formulations.ecmwf_ifs_specific_humidity_from_vapour_pressure]
label = "Specific humidity from vapour pressure, ECMWF IFS"
expression = "epsilon * e / (p - (1 - epsilon) * e)"
fixed_units = false
output = { identifier = "q", kind = "SpecificHumidity", unit = "KiloGM-PER-KiloGM", description = "Specific humidity" }
inputs = [
  { identifier = "e", kind = "VapourPressure", unit = "PA", description = "Vapour pressure" },
  { identifier = "p", kind = "Pressure", unit = "PA", description = "Pressure of moist air" },
]
constants = ["epsilon_ecmwf_ifs"]
keywords = ["humidity", "IFS"]

[[formulations.ecmwf_ifs_specific_humidity_from_vapour_pressure.citations]]
reference = "ecmwf_ifs_cy49r1"
equation = "12.4"
notation = { q = 'q_{\mathrm{v}}' }
assumptions = ["The pressure of moist air is the sum of the partial pressures of dry air and water vapour, p = p_d + e (12.3)."]

[formulations.ecmwf_ifs_virtual_temperature]
label = "Virtual temperature from the temperature and the specific humidity, without condensates, ECMWF IFS"
expression = "T * (1 + (R_v / R_d - 1) * q)"
fixed_units = false
note = "Equation 12.7 without the specific masses of liquid water, ice, rain and snow: the form the physics uses for the air density. The factor is epsilon* = R_v / R_d - 1 (12.5), which the IFS does not print as a number."
output = { identifier = "T_v", kind = "VirtualTemperature", unit = "K", description = "Virtual temperature" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Temperature of moist air" },
  { identifier = "q", kind = "SpecificHumidity", unit = "KiloGM-PER-KiloGM", description = "Specific humidity" },
]
constants = ["R_v_ecmwf_ifs", "R_d_ecmwf_ifs"]
keywords = ["virtual temperature", "humidity", "IFS"]

[[formulations.ecmwf_ifs_virtual_temperature.citations]]
reference = "ecmwf_ifs_cy49r1"
equation = "12.7"
notation = { q = 'q_{\mathrm{v}}', R_v = 'R_{\mathrm{v}}', R_d = 'R_{\mathrm{d}}' }
note = "Text under equation 12.7: 'when air density is required in the physics it is computed using T_v = (1 + epsilon* q_v) T only'."
assumptions = ["The specific volume of the condensed water phases neglected (text under 12.7).", "No condensate: liquid water, ice, rain and snow left out."]

[formulations.ecmwf_ifs_density]
label = "Density of moist air from the pressure and the virtual temperature, ECMWF IFS"
expression = "p / (R_d * T_v)"
fixed_units = false
output = { identifier = "rho", kind = "DensityOfMoistAir", unit = "KiloGM-PER-M3", description = "Density of moist air" }
inputs = [
  { identifier = "p", kind = "Pressure", unit = "PA", description = "Pressure of moist air" },
  { identifier = "T_v", kind = "VirtualTemperature", unit = "K", description = "Virtual temperature" },
]
constants = ["R_d_ecmwf_ifs"]
keywords = ["density", "virtual temperature", "equation of state", "IFS"]

[[formulations.ecmwf_ifs_density.citations]]
reference = "ecmwf_ifs_cy49r1"
equation = "12.6"
notation = { T_v = 'T_{\mathrm{v}}', R_d = 'R_{\mathrm{d}}' }

[formulations.ecmwf_ifs_density_specific_humidity]
label = "Density of moist air from the pressure, the temperature and the specific humidity, ECMWF IFS physics"
