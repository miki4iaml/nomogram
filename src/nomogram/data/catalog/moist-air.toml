#
# Moist air: humidity quantities computed from the vapour pressure
# (mass concentration, mixing ratio, specific humidity), the saturation
# vapour pressure in moist air (enhancement factor), the temperatures of
# atmospheric thermodynamics (virtual, potential, equivalent potential),
# and the constants of moist air thermodynamics.
# Hand-written, validated when loaded by nomogram.catalog. Entries whose
# details were not checked against the source carry status = "to-confirm".

[catalog]
name = "moist-air"
label = "Humidity of moist air"
format = 2
requires = ["water-vapour"]
keywords = ["humidity", "psychrometrics"]

# --- Quantity kinds ---------------------------------------------------

[kinds.EnhancementFactor]
label = "Enhancement Factor"
specialization_of = "DimensionlessRatio"
description = "Ratio of the saturation vapour pressure of water vapour in moist air to that of pure water vapour, at the same temperature."

[kinds.SaturationVapourPressureInMoistAir]
label = "Saturation Vapour Pressure in Moist Air"
specialization_of = "VapourPressure"
description = "Saturation vapour pressure of water vapour in moist air at a given pressure, over water or over ice: that of pure water vapour times the enhancement factor."

[kinds.SaturationVapourPressureOverWaterInMoistAir]
label = "Saturation Vapour Pressure over Water in Moist Air"
specialization_of = "SaturationVapourPressureInMoistAir"
description = "Saturation vapour pressure of moist air with respect to a plane surface of water containing the dissolved air of equilibrium, at a given pressure (WMO-No. 8, 4.A.9): that of pure water vapour times the enhancement factor."

[kinds.SaturationVapourPressureOverIceInMoistAir]
label = "Saturation Vapour Pressure over Ice in Moist Air"
specialization_of = "SaturationVapourPressureInMoistAir"
description = "Saturation vapour pressure over a plane surface of ice, in moist air at a given pressure: that of pure water vapour times the enhancement factor."

[kinds.SaturationSpecificHumidity]
label = "Saturation Specific Humidity"
specialization_of = "SpecificHumidity"
description = "Specific humidity of air saturated with respect to a plane surface of pure water (or ice) at a given temperature and pressure."

[kinds.DryAirPressure]
label = "Partial Pressure of Dry Air"
specialization_of = "Pressure"
description = "Partial pressure of the dry air in moist air: the total pressure minus the vapour pressure."

# Merged into QUDT on 2026-10-25 (qudt-public-repo pull request 1578),
# not yet in a release.
[kinds.SpecificLatentHeat]
label = "Specific Latent Heat"
specialization_of = "SpecificEnergy"
description = "Latent heat of a phase transition per unit mass: vaporization, sublimation or fusion."
matches = [
  { target = "http://www.wikidata.org/entity/Q104217205", relation = "exact", verified = 2026-10-25 },
]

[kinds.SpecificLatentHeatOfVaporization]
label = "Specific Latent Heat of Vaporization"
specialization_of = "SpecificLatentHeat"
description = "Latent heat of vaporization per unit mass, at a given temperature: the difference of the specific enthalpies of the vapour and of the liquid."

[kinds.SpecificLatentHeatOfSublimation]
label = "Specific Latent Heat of Sublimation"
specialization_of = "SpecificLatentHeat"
description = "Latent heat of sublimation per unit mass, at a given temperature: the difference of the specific enthalpies of the vapour and of the solid."

[kinds.SpecificLatentHeatOfFusion]
label = "Specific Latent Heat of Fusion"
specialization_of = "SpecificLatentHeat"
description = "Latent heat of fusion (melting) per unit mass, at a given temperature: the difference of the specific enthalpies of the liquid and of the solid."

[kinds.RelativeHumidityWithRespectToIce]
label = "Relative Humidity with respect to Ice"
specialization_of = "RelativePartialPressure"
description = "Relative humidity of moist air with respect to ice: the vapour mole fraction over the one the air would have if saturated with respect to a plane surface of ice at the same pressure and temperature. A sibling of the relative humidity, which QUDT defines with respect to water, as WMO-No. 8 evaluates it even below 0 degC (4.A, para. 17): it never feeds a relative humidity input."

[kinds.MoleFractionOfWaterVapour]
label = "Mole Fraction of Water Vapour"
specialization_of = "MoleFraction"
description = "Number of moles of water vapour over the total number of moles of a sample of moist air."
cf_standard_names = [{ name = "mole_fraction_of_water_vapor_in_air", relation = "exact", verified = 2026-10-26 }]

[kinds.SaturationMixingRatioOverWater]
label = "Saturation Mixing Ratio over Water"
specialization_of = "MassRatioOfWaterVapourToDryGas"
description = "Mixing ratio of moist air saturated with respect to a plane surface of the associated liquid phase, at the same temperature and pressure."

[kinds.SaturationMixingRatioOverIce]
label = "Saturation Mixing Ratio over Ice"
specialization_of = "MassRatioOfWaterVapourToDryGas"
description = "Mixing ratio of moist air saturated with respect to a plane surface of the associated solid phase, at the same temperature and pressure."

[kinds.VirtualTemperature]
label = "Virtual Temperature"
specialization_of = "ThermodynamicTemperature"
description = "Temperature dry air would need to have the density of a sample of moist air at the same pressure."
cf_standard_names = [{ name = "virtual_temperature", relation = "exact", verified = 2026-10-26 }]
matches = [
  { target = "http://www.wikidata.org/entity/Q761179", relation = "exact", verified = 2026-10-26 },
]

[kinds.PotentialTemperature]
label = "Potential Temperature"
specialization_of = "ThermodynamicTemperature"
description = "Temperature a parcel of air would reach if brought adiabatically to a reference pressure, usually 1000 hPa."
cf_standard_names = [{ name = "air_potential_temperature", relation = "exact", verified = 2026-10-26 }]
matches = [
  { target = "http://www.wikidata.org/entity/Q760765", relation = "exact", verified = 2026-10-26 },
]

[kinds.VirtualPotentialTemperature]
label = "Virtual Potential Temperature"
specialization_of = "PotentialTemperature"
description = "Potential temperature of the virtual temperature: the effect of water vapour on the density is kept, not its effect on the heat capacity."

[kinds.EquivalentPotentialTemperature]
label = "Equivalent Potential Temperature"
specialization_of = "PotentialTemperature"
description = "Temperature a parcel of air would reach if all its water vapour condensed, the latent heat warming it, and it were brought adiabatically to the reference pressure."
cf_standard_names = [{ name = "air_equivalent_potential_temperature", relation = "exact", verified = 2026-10-26 }]
matches = [
  { target = "http://www.wikidata.org/entity/Q3055058", relation = "exact", verified = 2026-10-26 },
]

[kinds.DensityOfMoistAir]
label = "Density of Moist Air"
specialization_of = "Density"
description = "Mass of moist air, dry air and water vapour, per unit volume."
cf_standard_names = [{ name = "air_density", relation = "exact", verified = 2026-10-26 }]
# The Wikidata item is the density of the Earth's atmosphere.
matches = [
  { target = "http://www.wikidata.org/entity/Q1511415", relation = "close", verified = 2026-10-26 },
]

# Siblings under Density: the density of a dry air, without water vapour,
# never feeds an input of the density of moist air, nor the reverse. The
# partial density of dry air within moist air, its mass per volume of
# moist air, is a third quantity, not entered.

[kinds.DensityOfDryAir]
label = "Density of Dry Air"
specialization_of = "Density"
description = "Mass per unit volume of air without water vapour, p / (R_d T) at the pressure of the dry air alone: the air of the ISO standard atmosphere, free from moisture and dust (ISO 2533, 2.1). Not the partial density of dry air within moist air, its mass per volume of moist air."

[kinds.MassRatioOfTotalWaterToDryGas]
label = "Mass Ratio of Total Water to Dry Gas"
specialization_of = "MassRatio"
description = "Mass of water in all its phases, vapour and condensate, per mass of dry air: the total water mixing ratio."

[kinds.FrostPointTemperature]
label = "Frost Point Temperature"
specialization_of = "Temperature"
description = "Temperature at which moist air, saturated with respect to ice at the same pressure, has a saturation mixing ratio equal to its mixing ratio (WMO-No. 8, 4.A.14). The counterpart of the dew point over ice, not a dew point: it never feeds a dew point input."

[kinds.IceBulbTemperature]
label = "Ice-Bulb Temperature"
specialization_of = "Temperature"
description = "Thermodynamic ice-bulb temperature (WMO-No. 8, 4.A.20): the counterpart of the thermodynamic wet-bulb temperature over ice. Not the reading of a psychrometer, a quantity of its own."

[kinds.PsychrometerWetBulbTemperature]
label = "Psychrometer Wet-Bulb Temperature"
specialization_of = "Temperature"
description = "Temperature indicated by the wet bulb of a psychrometer. For most instruments it is not identical to the thermodynamic wet-bulb temperature (WMO-No. 8, 4.3.1.7); their relation is a matter of controlled experiment (Annex 4.A): neither feeds an input of the other."

[kinds.PsychrometerIceBulbTemperature]
label = "Psychrometer Ice-Bulb Temperature"
specialization_of = "Temperature"
description = "Temperature indicated by the ice-covered bulb of a psychrometer, the counterpart of its wet-bulb temperature over ice. Not the thermodynamic ice-bulb temperature (WMO-No. 8, Annex 4.A)."

[kinds.PsychrometerCoefficient]
label = "Psychrometer Coefficient"
specialization_of = "InverseTemperature"
description = "The coefficient A of the psychrometric formula e' = e'_w(p, t_w) - A p (t - t_w), which depends on the design and ventilation of the psychrometer (WMO-No. 8, 4.3.1). WMO-No. 8 prefers this term to psychrometer constant, a misnomer."

