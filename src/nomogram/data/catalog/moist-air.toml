# The thermodynamic wet-bulb and ice-bulb temperatures of WMO-No. 8,
# Annex 4.A, for ideal gases with constant specific heats (pp. 195-196).

[formulations.wmo_wet_bulb_ideal_gas]
label = "Air temperature from the thermodynamic wet-bulb temperature, ideal gases with constant specific heats, WMO Guide (CIMO)"
expression = "T_w + (r_w - r) * L_v / (c_pa + r * c_pv)"
fixed_units = false
note = "Explicit in the air temperature: the wet-bulb temperature from the air temperature and the mixing ratio needs a solver. The exact definition is the enthalpy balance 4.A.18. Air-conditioning engineers call this temperature that of adiabatic saturation; how a psychrometer reading relates to it is a matter of experiment."
output = { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Air temperature" }
inputs = [
  { identifier = "T_w", kind = "WetBulbTemperature", unit = "K", description = "Thermodynamic wet-bulb temperature" },
  { identifier = "r", kind = "MassRatioOfWaterVapourToDryGas", unit = "KiloGM-PER-KiloGM", description = "Mixing ratio of the air" },
  { identifier = "r_w", kind = "SaturationMixingRatioOverWater", unit = "KiloGM-PER-KiloGM", description = "Saturation mixing ratio over water at the wet-bulb temperature and the pressure of the air" },
  { identifier = "L_v", kind = "SpecificLatentHeatOfVaporization", unit = "J-PER-KiloGM", description = "Specific latent heat of vaporization at the wet-bulb temperature" },
  { identifier = "c_pa", kind = "SpecificHeatCapacityAtConstantPressure", unit = "J-PER-KiloGM-K", description = "Specific heat of dry air at constant pressure" },
  { identifier = "c_pv", kind = "SpecificHeatCapacityAtConstantPressure", unit = "J-PER-KiloGM-K", description = "Specific heat of water vapour at constant pressure" },
]
keywords = ["humidity", "wet bulb", "adiabatic saturation"]

[[formulations.wmo_wet_bulb_ideal_gas.citations]]
reference = "wmo2024"
equation = "4.A.19"
assumptions = ["Air and water vapour as ideal gases with constant specific heats (Annex 4.A, paragraph 18)."]

[formulations.wmo_ice_bulb_ideal_gas]
label = "Air temperature from the thermodynamic ice-bulb temperature, ideal gases with constant specific heats, WMO Guide (CIMO)"
expression = "T_i + (r_i - r) * L_s / (c_pa + r * c_pv)"
fixed_units = false
note = "Explicit in the air temperature: the ice-bulb temperature from the air temperature and the mixing ratio needs a solver. The exact definition is the enthalpy balance 4.A.20."
output = { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Air temperature" }
inputs = [
  { identifier = "T_i", kind = "IceBulbTemperature", unit = "K", description = "Thermodynamic ice-bulb temperature" },
  { identifier = "r", kind = "MassRatioOfWaterVapourToDryGas", unit = "KiloGM-PER-KiloGM", description = "Mixing ratio of the air" },
  { identifier = "r_i", kind = "SaturationMixingRatioOverIce", unit = "KiloGM-PER-KiloGM", description = "Saturation mixing ratio over ice at the ice-bulb temperature and the pressure of the air" },
  { identifier = "L_s", kind = "SpecificLatentHeatOfSublimation", unit = "J-PER-KiloGM", description = "Specific latent heat of sublimation at the ice-bulb temperature" },
  { identifier = "c_pa", kind = "SpecificHeatCapacityAtConstantPressure", unit = "J-PER-KiloGM-K", description = "Specific heat of dry air at constant pressure" },
  { identifier = "c_pv", kind = "SpecificHeatCapacityAtConstantPressure", unit = "J-PER-KiloGM-K", description = "Specific heat of water vapour at constant pressure" },
]
keywords = ["humidity", "ice bulb"]

[[formulations.wmo_ice_bulb_ideal_gas.citations]]
reference = "wmo2024"
equation = "4.A.21"
notation = { c_pa = "c_p" }
note = "Printed c_p where 4.A.19 writes c_pa, the specific heat of dry air at constant pressure."
assumptions = ["Air and water vapour as ideal gases with constant specific heats (Annex 4.A, paragraph 19)."]

# Latent heats of the ECMWF IFS (CY49R1, Part IV, section 12.5, p. 246):
# differences of specific enthalpies, linear in temperature.

[formulations.ecmwf_ifs_latent_heat_vaporization]
label = "Specific latent heat of vaporisation, linear in temperature, ECMWF IFS"
expression = "L_v0 + (c_pv - c_l) * (T - T_0)"
fixed_units = false
note = "The difference of the specific enthalpies of water vapour and liquid water, with specific heats taken as constant. The IFS states no validity domain. Its model physics takes the latent heat as invariable, L_v0; this form gives the temperature dependency in the moist static energy (equations 12.26 to 12.28)."
output = { identifier = "L_v", kind = "SpecificLatentHeatOfVaporization", unit = "J-PER-KiloGM", description = "Specific latent heat of vaporisation" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Temperature", scale = "its90", scale_basis = "inferred-from-date" },
]
constants = ["L_v0_ecmwf_ifs", "c_pv_ecmwf_ifs", "c_l_ecmwf_ifs", "T_0_ecmwf_ifs"]
assumptions = [
  { text = "The specific heat of water vapour is constant (c_pv = 4 R_v).", status = "deduced" },
]
keywords = ["latent heat", "Kirchhoff"]

[[formulations.ecmwf_ifs_latent_heat_vaporization.citations]]
reference = "ecmwf_ifs_cy49r1"
equation = "12.1"
notation = { L_v0 = 'L_{\mathrm{v}}(T_0)' }
assumptions = ["The specific heat of liquid water is taken as constant, its value holding at the triple point (section 12.5, p. 246)."]

[formulations.ecmwf_ifs_latent_heat_sublimation]
label = "Specific latent heat of sublimation, linear in temperature, ECMWF IFS"
expression = "L_s0 + (c_pv - c_s) * (T - T_0)"
fixed_units = false
note = "The difference of the specific enthalpies of water vapour and ice, with specific heats taken as constant. The IFS states no validity domain. Its model physics takes the latent heat as invariable, L_s0; this form gives the temperature dependency in the moist static energy (equations 12.26 to 12.28)."
output = { identifier = "L_s", kind = "SpecificLatentHeatOfSublimation", unit = "J-PER-KiloGM", description = "Specific latent heat of sublimation" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Temperature", scale = "its90", scale_basis = "inferred-from-date" },
]
constants = ["L_s0_ecmwf_ifs", "c_pv_ecmwf_ifs", "c_s_ecmwf_ifs", "T_0_ecmwf_ifs"]
assumptions = [
  { text = "The specific heat of water vapour is constant (c_pv = 4 R_v).", status = "deduced" },
]
keywords = ["latent heat", "Kirchhoff"]

[[formulations.ecmwf_ifs_latent_heat_sublimation.citations]]
reference = "ecmwf_ifs_cy49r1"
equation = "12.2"
notation = { L_s0 = 'L_{\mathrm{s}}(T_0)' }
assumptions = ["The specific heat of ice is taken as constant, its value holding at the triple point (section 12.5, p. 246)."]

# Latent heats of Ambaum (2020), specific heats taken as constant.

[formulations.ambaum2020_latent_heat_vaporization]
label = "Specific latent heat of vaporisation, linear in temperature, Ambaum (2020)"
expression = "L_0 - Delta_c * (T - T_0)"
fixed_units = false
note = "Delta_c stands for c_pl - c_pv. Its value is chosen so that the vapour pressure of equation 13 fits IAPWS-95 from 0 to 100 degC; it corresponds to c_pv near 2040 J kg-1 K-1, where c_pv goes from 1888.2 at the triple point to 2077.5 J kg-1 K-1 at 100 degC (p. 4254). The latent heat itself is not assessed against reference values. Its temperatures are on ITS-90, the scale Ambaum names where he compares with IAPWS-95 (p. 4255)."
output = { identifier = "L_v", kind = "SpecificLatentHeatOfVaporization", unit = "J-PER-KiloGM", description = "Specific latent heat of vaporisation" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Temperature", scale = "its90", scale_basis = "inferred-from-numbers" },
]
coefficients = { L_0 = 2.501e6, Delta_c = 2180.0, T_0 = 273.16 }
keywords = ["latent heat", "Kirchhoff"]

[[formulations.ambaum2020_latent_heat_vaporization.citations]]
reference = "ambaum2020"
equation = "15"
notation = { L_v = "L", Delta_c = '\left(c_{\mathrm{pl}} - c_{\mathrm{pv}}\right)' }
assumptions = ["Water vapour as an ideal gas, so that c_pv is constant, which is 'only approximately valid' from 0 to 100 degC (p. 4254)."]
units = { L_0 = "J-PER-KiloGM", Delta_c = "J-PER-KiloGM-K", T_0 = "K" }

[[formulations.ambaum2020_latent_heat_vaporization.citations.domains]]
bounds = { T = [273.15, 373.15] }
criterion = "c_pl - c_pv = 2180 J kg-1 K-1 'gives a very good fit across the 0-100 C temperature range, in particular for temperatures below 70 C' (p. 4254): the fit of the vapour pressure of equation 13 to IAPWS-95."

[formulations.ambaum2020_latent_heat_fusion]
label = "Specific latent heat of melting, linear in temperature, Ambaum (2020)"
expression = "L_m0 + (c_l - c_i) * (T - T_0)"
fixed_units = false
note = "Written L_m = L_s - L, the latent heat of sublimation minus that of vaporisation. Figure 4 assesses the saturation ratio of equation 20, built on these values, from -40 degC to the triple point. Its temperatures are on ITS-90, the scale Ambaum names where he compares with IAPWS-95 (p. 4255)."
output = { identifier = "L_m", kind = "SpecificLatentHeatOfFusion", unit = "J-PER-KiloGM", description = "Specific latent heat of melting" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Temperature", scale = "its90", scale_basis = "inferred-from-numbers" },
]
coefficients = { L_m0 = 0.3334e6, c_l = 4220.0, c_i = 2097.0, T_0 = 273.16 }
keywords = ["latent heat", "Kirchhoff", "melting"]

[[formulations.ambaum2020_latent_heat_fusion.citations]]
reference = "ambaum2020"
notation = { c_l = 'c_{\mathrm{pl}}', c_i = 'c_{\mathrm{pi}}' }
assumptions = ["The heat capacities of liquid water and ice are taken as constant, at their triple-point values (p. 4256)."]
note = "Unnumbered, in the text below equation 20 (p. 4256); L_m0, c_pl and c_pi are the triple-point values of the caption of Figure 4, T_0 that of equations 14 and 19."
units = { L_m0 = "J-PER-KiloGM", c_l = "J-PER-KiloGM-K", c_i = "J-PER-KiloGM-K", T_0 = "K" }

# The latent heat of fusion: the identity, and the form it gives from the
# latent heats of the IFS.

[formulations.latent_heat_fusion_identity]
label = "Specific latent heat of fusion, as that of sublimation minus that of vaporization"
nature = "identity"
expression = "L_s - L_v"
fixed_units = false
conditions = "Both latent heats at the same temperature, the specific enthalpy of each phase depending on temperature only (Bechtold, equation 39)."
output = { identifier = "L_f", kind = "SpecificLatentHeatOfFusion", unit = "J-PER-KiloGM", description = "Specific latent heat of fusion" }
inputs = [
  { identifier = "L_s", kind = "SpecificLatentHeatOfSublimation", unit = "J-PER-KiloGM", description = "Specific latent heat of sublimation" },
  { identifier = "L_v", kind = "SpecificLatentHeatOfVaporization", unit = "J-PER-KiloGM", description = "Specific latent heat of vaporisation" },
]
keywords = ["latent heat", "melting"]

[[formulations.latent_heat_fusion_identity.citations]]
reference = "bechtold2015"
equation = "40"
notation = { L_f = "L_m" }

[[formulations.latent_heat_fusion_identity.citations]]
reference = "ambaum2020"
notation = { L_f = "L_m", L_v = "L" }
note = "Unnumbered, in the text below equation 20 (p. 4256)."

[formulations.ecmwf_ifs_latent_heat_fusion]
label = "Specific latent heat of fusion, linear in temperature, from the latent heats of the ECMWF IFS"
composition = { outer = "latent_heat_fusion_identity", inner = { L_s = "ecmwf_ifs_latent_heat_sublimation", L_v = "ecmwf_ifs_latent_heat_vaporization" } }
note = "The IFS prints no latent heat of fusion as a function of temperature: it writes Ldep = Lvap + Lfus (section 7.2.2, p. 118) and takes Ls - Lv, with equations 12.1 and 12.2, in equations 12.24 to 12.33."
keywords = ["latent heat", "melting"]

# Definitions of WMO-No. 8 (2024), Volume I, Annex 4.A (pp. 193-196).

[formulations.wmo_vapour_pressure_definition]
label = "Vapour pressure of moist air, from the mixing ratio and the pressure, WMO Guide (CIMO)"
nature = "definition"
expression = "r * p / (epsilon + r)"
fixed_units = false
note = "Defined as x_v p, the mole fraction of water vapour times the total pressure, with x_v = r / (0.62198 + r) (4.A.5). The WMO calls the relative humidity that follows formally similar to the one based on Dalton's law of partial pressures (4.A.15)."
output = { identifier = "e", kind = "VapourPressure", unit = "HectoPA", description = "Vapour pressure of moist air" }
inputs = [
  { identifier = "r", kind = "MassRatioOfWaterVapourToDryGas", unit = "KiloGM-PER-KiloGM", description = "Mixing ratio" },
  { identifier = "p", kind = "Pressure", unit = "HectoPA", description = "Total pressure of moist air" },
]
constants = ["epsilon_wmo2024"]
keywords = ["humidity", "mole fraction"]

[[formulations.wmo_vapour_pressure_definition.citations]]
reference = "wmo2024"
equation = "4.A.6"
notation = { e = "e'" }

[formulations.wmo_relative_humidity_ice]
label = "Relative humidity with respect to ice, WMO Guide (CIMO)"
nature = "definition"
expression = "100 * e / e_is"
fixed_units = true
conditions = "e' and e'_i at the same pressure and temperature; not applicable when the pressure is below the saturation vapour pressure of ice at that temperature (note to 4.A.15 and 4.A.17)."
output = { identifier = "RH_i", kind = "RelativeHumidityWithRespectToIce", unit = "PERCENT", description = "Relative humidity with respect to ice" }
inputs = [
  { identifier = "e", kind = "VapourPressure", unit = "HectoPA", description = "Vapour pressure of moist air" },
  { identifier = "e_is", kind = "SaturationVapourPressureOverIceInMoistAir", unit = "HectoPA", description = "Saturation vapour pressure over ice in moist air, at the same pressure and temperature" },
]
keywords = ["humidity"]

[[formulations.wmo_relative_humidity_ice.citations]]
reference = "wmo2024"
equation = "4.A.17"
notation = { RH_i = "U_i", e = "e'", e_is = "e'_{\\mathrm{i}}" }

