# --- Formulations -----------------------------------------------------

[formulations.mass_concentration_ideal_gas]
label = "Mass concentration of water vapour, ideal gas law"
expression = "RH * e_s / (R_v * T)"
fixed_units = false
note = "Water vapour treated as an ideal gas; e_s must be taken at the temperature T."
output = { identifier = "rho_v", kind = "MassConcentrationOfWaterVapour", unit = "KiloGM-PER-M3", description = "Mass concentration of water vapour (absolute humidity, meteorological sense)" }
inputs = [
  { identifier = "RH", kind = "RelativeHumidity", unit = "UNITLESS", description = "Relative humidity" },
  { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "PA", description = "Saturation vapour pressure over water at T" },
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Thermodynamic temperature" },
]
constants = ["R_v_iapws95"]

[[formulations.mass_concentration_ideal_gas.citations]]
reference = "iapws95"

[formulations.vapour_pressure_from_relative_humidity]
label = "Vapour pressure from relative humidity"
expression = "RH * e_s"
fixed_units = false
note = "Relative humidity taken as e/e_s, its usual approximation in meteorology; definitions through mole fractions or mixing ratios differ slightly (source to read before stating which one a standard uses)."
output = { identifier = "e", kind = "VapourPressure", unit = "PA", description = "Vapour pressure" }
inputs = [
  { identifier = "RH", kind = "RelativeHumidity", unit = "UNITLESS", description = "Relative humidity" },
  { identifier = "e_s", kind = "SaturationVapourPressureOverWater", unit = "PA", description = "Saturation vapour pressure over water at the same temperature" },
]

[formulations.mixing_ratio_from_vapour_pressure]
label = "Humidity mixing ratio from vapour pressure (ASHRAE 2017)"
expression = "epsilon * e / (p - e)"
fixed_units = false
note = "ASHRAE Handbook - Fundamentals (2017), chapter 1, equation 20, through PsychroLib: moist air as an ideal gas mixture."
output = { identifier = "r", kind = "MassRatioOfWaterVapourToDryGas", unit = "KiloGM-PER-KiloGM", description = "Humidity mixing ratio" }
inputs = [
  { identifier = "e", kind = "VapourPressure", unit = "PA", description = "Vapour pressure" },
  { identifier = "p", kind = "Pressure", unit = "PA", description = "Air pressure" },
]
constants = ["epsilon_ashrae2017"]

[[formulations.mixing_ratio_from_vapour_pressure.citations]]
reference = "ashrae2017"

[[formulations.mixing_ratio_from_vapour_pressure.citations]]
reference = "psychrolib"

[formulations.specific_humidity_from_mixing_ratio]
label = "Specific humidity from mixing ratio"
expression = "r / (1 + r)"
fixed_units = false
note = "From the definitions (mass of water vapour per mass of moist air, per mass of dry air); ASHRAE Handbook - Fundamentals (2017), chapter 1, equation 9b, through PsychroLib."
output = { identifier = "q", kind = "SpecificHumidity", unit = "KiloGM-PER-KiloGM", description = "Specific humidity" }
inputs = [
  { identifier = "r", kind = "MassRatioOfWaterVapourToDryGas", unit = "KiloGM-PER-KiloGM", description = "Humidity mixing ratio" },
]

[[formulations.specific_humidity_from_mixing_ratio.citations]]
reference = "ashrae2017"

[[formulations.specific_humidity_from_mixing_ratio.citations]]
reference = "psychrolib"

# Saturation vapour pressure in moist air: the enhancement factor times
# that of pure water vapour. ITU-R P.453 equation 9 is this product with
# the Buck (1996) equations (same coefficients a, b, c, d), so it is
# written as a composition rather than copied.

[formulations.saturation_vapour_pressure_in_moist_air]
label = "Saturation vapour pressure in moist air"
expression = "EF * e_s"
fixed_units = false
note = "The enhancement factor applied to the saturation vapour pressure of pure water vapour, over water or over ice."
output = { identifier = "e_sm", kind = "SaturationVapourPressureInMoistAir", unit = "HectoPA", description = "Saturation vapour pressure in moist air" }
inputs = [
  { identifier = "EF", kind = "EnhancementFactor", unit = "UNITLESS", description = "Enhancement factor" },
  { identifier = "e_s", kind = "VapourPressure", unit = "HectoPA", description = "Saturation vapour pressure of pure water vapour, over water or over ice" },
]

[formulations.itu_r_p453_ef_water]
label = "Enhancement factor over water (ITU-R P.453)"
expression = "1 + 1e-4 * (E_A + p * (E_B + E_C * t ** 2))"
fixed_units = true
note = "P is the total atmospheric pressure; P.453 adds that the dry atmospheric pressure can be used with insignificant loss of prediction accuracy."
output = { identifier = "EF", kind = "EnhancementFactor", unit = "UNITLESS", description = "Enhancement factor over water" }
inputs = [
  { identifier = "p", kind = "Pressure", unit = "HectoPA", description = "Total atmospheric pressure" },
  { identifier = "t", kind = "CelsiusTemperature", unit = "DEG_C", description = "Celsius temperature", scale = "its90", scale_basis = "inferred-from-date" },
]
coefficients = { E_A = 7.2, E_B = 0.0320, E_C = 5.9e-6 }

[[formulations.itu_r_p453_ef_water.citations]]
reference = "itu_r_p453_14"
equation = "9"
notation = { EF = 'EF_{\mathrm{water}}', p = "P" }

[formulations.itu_r_p453_ef_ice]
label = "Enhancement factor over ice (ITU-R P.453)"
expression = "1 + 1e-4 * (E_A + p * (E_B + E_C * t ** 2))"
fixed_units = true
note = "P is the total atmospheric pressure; P.453 adds that the dry atmospheric pressure can be used with insignificant loss of prediction accuracy."
output = { identifier = "EF", kind = "EnhancementFactor", unit = "UNITLESS", description = "Enhancement factor over ice" }
inputs = [
  { identifier = "p", kind = "Pressure", unit = "HectoPA", description = "Total atmospheric pressure" },
  { identifier = "t", kind = "CelsiusTemperature", unit = "DEG_C", description = "Celsius temperature", scale = "its90", scale_basis = "inferred-from-date" },
]
coefficients = { E_A = 2.2, E_B = 0.0383, E_C = 6.4e-6 }

[[formulations.itu_r_p453_ef_ice.citations]]
reference = "itu_r_p453_14"
equation = "9"
notation = { EF = 'EF_{\mathrm{ice}}', p = "P" }

[formulations.itu_r_p453_es_water]
label = "Saturation vapour pressure over water in moist air (ITU-R P.453)"
composition = { outer = "saturation_vapour_pressure_in_moist_air", inner = { EF = "itu_r_p453_ef_water", e_s = "buck1996" } }
output = { identifier = "e_ws", kind = "SaturationVapourPressureOverWaterInMoistAir", unit = "HectoPA", description = "Saturation vapour pressure over water in moist air" }

[[formulations.itu_r_p453_es_water.citations]]
reference = "itu_r_p453_14"
equation = "9"
notation = { C = "a", A = "b", B = "c", D = "d", e_ws = "e_s", p = "P" }

[[formulations.itu_r_p453_es_water.citations.domains]]
bounds = { t = [-40.0, 50.0] }

[formulations.itu_r_p453_es_ice]
label = "Saturation vapour pressure over ice in moist air (ITU-R P.453)"
composition = { outer = "saturation_vapour_pressure_in_moist_air", inner = { EF = "itu_r_p453_ef_ice", e_s = "buck1996_ice" } }
output = { identifier = "e_is", kind = "SaturationVapourPressureOverIceInMoistAir", unit = "HectoPA", description = "Saturation vapour pressure over ice in moist air" }

[[formulations.itu_r_p453_es_ice.citations]]
reference = "itu_r_p453_14"
equation = "9"
notation = { C = "a", A = "b", B = "c", D = "d", e_is = "e_s", p = "P" }

[[formulations.itu_r_p453_es_ice.citations.domains]]
bounds = { t = [-80.0, 0.0] }

# ITU-R P.453 equations 8 and 10: the vapour pressure from the relative
# humidity (in percent, with the saturation vapour pressure in moist air)
# and from the water vapour density.

[formulations.itu_r_p453_vapour_pressure]
label = "Vapour pressure from relative humidity (ITU-R P.453)"
expression = "H * e_s / 100"
fixed_units = true
note = "P.453 takes e_s from its equation 9, over water or over ice: the saturation vapour pressure in moist air, unlike vapour_pressure_from_relative_humidity."
output = { identifier = "e", kind = "VapourPressure", unit = "HectoPA", description = "Vapour pressure" }
inputs = [
  { identifier = "H", kind = "RelativeHumidity", unit = "PERCENT", description = "Relative humidity" },
  { identifier = "e_s", kind = "SaturationVapourPressureInMoistAir", unit = "HectoPA", description = "Saturation vapour pressure in moist air at the same temperature" },
]

[[formulations.itu_r_p453_vapour_pressure.citations]]
reference = "itu_r_p453_14"
equation = "8"

[formulations.itu_r_p453_vapour_pressure_from_density]
label = "Vapour pressure from water vapour density (ITU-R P.453)"
expression = "rho * T / C"
fixed_units = true
output = { identifier = "e", kind = "VapourPressure", unit = "HectoPA", description = "Vapour pressure" }
inputs = [
  { identifier = "rho", kind = "MassConcentrationOfWaterVapour", unit = "GM-PER-M3", description = "Water vapour density" },
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Thermodynamic temperature" },
]
coefficients = { C = 216.7 }

[[formulations.itu_r_p453_vapour_pressure_from_density.citations]]
reference = "itu_r_p453_14"
equation = "10"

# WMO-No. 8 (2024), Volume I, Annex 4.B (p. 197): the enhancement factor
# f(p), the saturation vapour pressures in moist air, the relative
# humidity and the dew point, built on the saturation vapour pressures
# 4.B.1 (sonntag1990_magnus) and 4.B.3 (wmo2008_ice) of the water-vapour
# family.

[formulations.wmo_enhancement_factor]
label = "Enhancement factor, WMO Guide (CIMO)"
expression = "f_0 + f_1 * p - f_2 / p"
fixed_units = true
note = "The guide omits the temperature dependence of f (below 0.1 %, against 0 to +0.6 % for the pressure) and keeps the formula to pressures around 1000 hPa, surface measurements; for upper-air measurements it refers to WMO (1966), Table 4.10. That restriction states no bounds, so it stays in this note."
output = { identifier = "f", kind = "EnhancementFactor", unit = "UNITLESS", description = "Enhancement factor" }
inputs = [
  { identifier = "p", kind = "Pressure", unit = "HectoPA", description = "Pressure of moist air" },
]
coefficients = { f_0 = 1.0016, f_1 = 3.15e-6, f_2 = 0.074 }

[[formulations.wmo_enhancement_factor.citations]]
reference = "wmo2024"
equation = "4.B.5"

[formulations.wmo_es_water_moist_air]
label = "Saturation vapour pressure over water in moist air, WMO Guide (CIMO)"
composition = { outer = "saturation_vapour_pressure_in_moist_air", inner = { EF = "wmo_enhancement_factor", e_s = "sonntag1990_magnus" } }
output = { identifier = "e_ws", kind = "SaturationVapourPressureOverWaterInMoistAir", unit = "HectoPA", description = "Saturation vapour pressure over water in moist air" }

[[formulations.wmo_es_water_moist_air.citations]]
reference = "wmo2024"
equation = "4.B.2"
notation = { e_ws = "e'_{\\mathrm{w}}" }

[formulations.wmo_es_ice_moist_air]
label = "Saturation vapour pressure over ice in moist air, WMO Guide (CIMO)"
composition = { outer = "saturation_vapour_pressure_in_moist_air", inner = { EF = "wmo_enhancement_factor", e_s = "wmo2008_ice" } }
output = { identifier = "e_is", kind = "SaturationVapourPressureOverIceInMoistAir", unit = "HectoPA", description = "Saturation vapour pressure over ice in moist air" }

[[formulations.wmo_es_ice_moist_air.citations]]
reference = "wmo2024"
equation = "4.B.4"
notation = { e_is = "e'_{\\mathrm{i}}" }

[formulations.wmo_relative_humidity]
label = "Relative humidity with respect to water, WMO Guide (CIMO)"
expression = "100 * e / e_ws"
fixed_units = true
output = { identifier = "RH", kind = "RelativeHumidity", unit = "PERCENT", description = "Relative humidity with respect to water" }
inputs = [
  { identifier = "e", kind = "VapourPressure", unit = "HectoPA", description = "Vapour pressure of moist air" },
  { identifier = "e_ws", kind = "SaturationVapourPressureOverWaterInMoistAir", unit = "HectoPA", description = "Saturation vapour pressure over water in moist air, at the same pressure and temperature" },
]

[[formulations.wmo_relative_humidity.citations]]
reference = "wmo2024"
equation = "4.B.10"
notation = { RH = "U", e = "e'", e_ws = "e'_{\\mathrm{w}}" }

[formulations.wmo_dew_point]
label = "Dew point from the vapour pressure and the enhancement factor, WMO Guide (CIMO)"
expression = "B * ln(e / (C * f)) / (A - ln(e / (C * f)))"
fixed_units = true
note = "The guide states the range -45 to 60 degC for the dew point over water, the output: domains in nomogram bound inputs, so the range stays in this note. Here the enhancement factor is an input; wmo_dew_point_moist_air takes it from 4.B.5."
output = { identifier = "t_d", kind = "DewPointTemperature", unit = "DEG_C", description = "Dew point temperature", scale = "its90", scale_basis = "inferred-from-date" }
inputs = [
  { identifier = "e", kind = "VapourPressure", unit = "HectoPA", description = "Vapour pressure of moist air" },
  { identifier = "f", kind = "EnhancementFactor", unit = "UNITLESS", description = "Enhancement factor" },
]
coefficients = { A = 17.62, B = 243.12, C = 6.112 }

[[formulations.wmo_dew_point.citations]]
reference = "wmo2024"
equation = "4.B.6"
notation = { e = "e'" }

[formulations.wmo_dew_point_moist_air]
label = "Dew point from the vapour pressure and the pressure of moist air, WMO Guide (CIMO)"
composition = { outer = "wmo_dew_point", inner = { f = "wmo_enhancement_factor" } }

[[formulations.wmo_dew_point_moist_air.citations]]
reference = "wmo2024"
equation = "4.B.6"
notation = { e = "e'" }

[formulations.wmo_relative_humidity_from_dew_point]
label = "Relative humidity with respect to water, from the dew point, WMO Guide (CIMO)"
expression = "100 * e_w(p=p, t=t_d) / e_w(p=p, t=t)"
calls = { e_w = "wmo_es_water_moist_air" }
fixed_units = true
note = "The enhancement factor cancels between the two calls, as the guide's equation shows: the value does not depend on p."
output = { identifier = "RH", kind = "RelativeHumidity", unit = "PERCENT", description = "Relative humidity with respect to water" }
inputs = [
  { identifier = "t_d", kind = "DewPointTemperature", unit = "DEG_C", description = "Dew point temperature" },
  { identifier = "t", kind = "CelsiusTemperature", unit = "DEG_C", description = "Air temperature" },
  { identifier = "p", kind = "Pressure", unit = "HectoPA", description = "Pressure of moist air" },
]

[[formulations.wmo_relative_humidity_from_dew_point.citations]]
reference = "wmo2024"
equation = "4.B.11"
notation = { RH = "U" }

# Latent heats of the ECMWF IFS (CY49R1, Part IV, section 12.5, p. 246):
# differences of specific enthalpies, linear in temperature.

[formulations.ecmwf_ifs_latent_heat_vaporization]
label = "Specific latent heat of vaporisation, linear in temperature, ECMWF IFS"
expression = "L_v0 + (c_pv - c_l) * (T - T_0)"
fixed_units = false
note = "The difference of the specific enthalpies of water vapour and liquid water, with specific heats taken as constant. The IFS states no validity domain. Its model physics takes the latent heat as invariable, L_v0; this form gives the temperature dependency in the moist static energy (equations 12.26 to 12.28)."
output = { identifier = "L_v", kind = "SpecificLatentHeatOfVaporization", unit = "J-PER-KiloGM", description = "Specific latent heat of vaporisation" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Temperature", scale = "its90", scale_basis = "inferred-from-date" },
]
constants = ["L_v0_ecmwf_ifs", "c_pv_ecmwf_ifs", "c_l_ecmwf_ifs", "T_0_ecmwf_ifs"]
keywords = ["latent heat", "Kirchhoff"]

[[formulations.ecmwf_ifs_latent_heat_vaporization.citations]]
reference = "ecmwf_ifs_cy49r1"
equation = "12.1"
notation = { L_v0 = 'L_{\mathrm{v}}(T_0)' }

[formulations.ecmwf_ifs_latent_heat_sublimation]
label = "Specific latent heat of sublimation, linear in temperature, ECMWF IFS"
expression = "L_s0 + (c_pv - c_s) * (T - T_0)"
fixed_units = false
note = "The difference of the specific enthalpies of water vapour and ice, with specific heats taken as constant. The IFS states no validity domain. Its model physics takes the latent heat as invariable, L_s0; this form gives the temperature dependency in the moist static energy (equations 12.26 to 12.28)."
output = { identifier = "L_s", kind = "SpecificLatentHeatOfSublimation", unit = "J-PER-KiloGM", description = "Specific latent heat of sublimation" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Temperature", scale = "its90", scale_basis = "inferred-from-date" },
]
constants = ["L_s0_ecmwf_ifs", "c_pv_ecmwf_ifs", "c_s_ecmwf_ifs", "T_0_ecmwf_ifs"]
keywords = ["latent heat", "Kirchhoff"]

[[formulations.ecmwf_ifs_latent_heat_sublimation.citations]]
reference = "ecmwf_ifs_cy49r1"
equation = "12.2"
notation = { L_s0 = 'L_{\mathrm{s}}(T_0)' }
