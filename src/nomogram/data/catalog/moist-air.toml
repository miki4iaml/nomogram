[formulations.bechtold2015_potential_temperature]
label = "Potential temperature of dry air (Bechtold 2015)"
expression = "T * (p_0 / p) ** (R_d / c_pd)"
fixed_units = false
note = "The exponent kappa = R_d / c_pd is 2/7, c_pd being 7/2 R_d for dry air as a diatomic ideal gas."
output = { identifier = "theta", kind = "PotentialTemperature", unit = "K", description = "Potential temperature" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Temperature" },
  { identifier = "p", kind = "Pressure", unit = "HectoPA", description = "Pressure" },
]
constants = ["R_d_bechtold2015", "c_pd_bechtold2015", "p_0_bechtold2015"]
assumptions = [
  { text = "c_pd is constant over the transformation, which integrates equation 27.", status = "deduced" },
]
keywords = ["potential temperature", "adiabatic"]

[[formulations.bechtold2015_potential_temperature.citations]]
reference = "bechtold2015"
equation = "28"
assumptions = ["An isentropic transformation of dry air, without phase change (section 8.1)."]

[formulations.bechtold2015_potential_temperature_moist_air]
label = "Potential temperature of moist air, without phase change (Bechtold 2015)"
expression = "T * (p_0 / p) ** ((R_d + r * R_v) / (c_pd + r * c_pv))"
fixed_units = false
note = "Written theta_m: the notes keep theta_v for the virtual potential temperature, in which water vapour acts through the virtual temperature only, not through the exponent."
output = { identifier = "theta_m", kind = "PotentialTemperature", unit = "K", description = "Potential temperature of moist air" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Temperature" },
  { identifier = "p", kind = "Pressure", unit = "HectoPA", description = "Pressure" },
  { identifier = "r", kind = "MassRatioOfWaterVapourToDryGas", unit = "KiloGM-PER-KiloGM", description = "Humidity mixing ratio" },
]
constants = ["R_d_bechtold2015", "R_v_bechtold2015", "c_pd_bechtold2015", "c_pv_ecmwf_ifs", "p_0_bechtold2015"]
assumptions = [
  { text = "The mixing ratio and the specific heats are constant over the transformation, which integrates equation 34.", status = "deduced" },
]
keywords = ["potential temperature", "adiabatic", "humidity"]

