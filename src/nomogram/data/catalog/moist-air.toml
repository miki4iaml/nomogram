status = "verified"
note = "Annex 1, sections 1, 2.1 and 5 (equations 1 to 12 and 17, enhancement factors under equation 9), read on the PDF (2022 electronic edition); in force on 2026-10-17."

[references.ecmwf_ifs_cy49r1]
authors = "ECMWF"
year = 2024
title = "IFS Documentation CY49R1 - Part IV: Physical Processes"
doi = "10.21957/c731ee1102"
url = "https://www.ecmwf.int/en/elibrary/81626-ifs-documentation-cy49r1-part-iv-physical-processes"
status = "verified"
note = "Chapter 12, p. 246: section 12.3, fundamental constants c, h, k and N (the values of the 1986 CODATA adjustment, not cited as such); 12.4, sigma = 2 pi^5 k^4/(15 c^2 h^3); 12.5, R = N k, Md, Mv, Rd = R/Md, Rv = R/Mv, the specific heats of dry air and water vapour (multiples of Rd and Rv), those of liquid water and ice (valid at T0 = 273.16 K) and the latent heats Lv0 and Ls0 at T0, and their linear dependency on temperature, eqs. 12.1 and 12.2. Section 7.5.2 (p. 136, under eq. 7.98): epsilon = Rdry/Rvap = 0.621981. Section 8.11.3 (pp. 201-202): salinity effect on the surface humidity, eq. 8.197. Chapter 3 (p. 46): the dry static energy, eq. 3.5. Section 5.3 (p. 86): the Brunt-Vaisala frequency in height coordinate, eq. 5.2. Section 6.12 (p. 108): the stability tropopause, eqs. 6.77-6.79, with N_0^2 = 2.5e-4 s-2. Section 12.2 (p. 245): a = 6371229 m, g = 9.80665 m s-2 and Phi = g z. Section 12.6 (p. 247): the basic state variables, eqs. 12.3-12.7. Section 12.9 (p. 250): s = c_pd T + Phi, eq. 12.36. The same equation numbers in CY50R1."

[references.bechtold2015]
authors = "Bechtold, P."
year = 2015
title = "Atmospheric Thermodynamics"
container = "ECMWF Meteorological Training Course Lecture Series (June 2009, last update May 2015)"
url = "https://www.ecmwf.int/en/elibrary/16954-atmospheric-thermodynamics"
status = "verified"
note = "ECMWF training lecture notes, without a DOI and not indexed by Crossref or OpenAlex (checked 2026-10-26): a secondary source, cited for what it states. CC BY 4.0 under the ECMWF terms of use, the document carrying no rights notice of its own. Read in full: equations 1 to 59 and Table 1 (pp. 1-15). Constants as printed: R_d = 287.06 and R_v = 461.52 J kg-1 K-1 and epsilon = 0.622 (p. 1), c_pd = 7/2 R_d = 1004.7 J kg-1 K-1 (p. 3), p0 = 1000 hPa (p. 5); c_pv = 1846.1 J kg-1 K-1 (p. 6), c_l = 4218 J kg-1 K-1, L_v(T00) = 2.5008e6 J kg-1 and T00 = 273.16 K (p. 7) are the values of the ECMWF IFS."

[references.metpy171]
authors = "MetPy developers"
year = 2025
title = "MetPy 1.7.1, metpy.constants (src/metpy/constants/default.py) and metpy.calc.thermo"
url = "https://github.com/Unidata/MetPy/tree/v1.7.1/src/metpy"
status = "verified"
