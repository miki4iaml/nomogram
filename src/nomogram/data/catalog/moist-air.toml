[formulations.ashrae2017_mixing_ratio_from_ice_bulb]
label = "Humidity mixing ratio from a wet bulb below freezing, covered with ice (ASHRAE 2017)"
expression = "((A - B * t_i) * W_s - C * (t - t_i)) / (A + D * t - E * t_i)"
fixed_units = true
note = "In kJ kg-1 and kJ kg-1 K-1, A is the latent heat of sublimation at 0 degC, C and D the specific heats of dry air and water vapour, E that of ice, and B = E - D. PsychroLib applies it for a wet bulb below 0 degC."
output = { identifier = "W", kind = "MassRatioOfWaterVapourToDryGas", unit = "KiloGM-PER-KiloGM", description = "Humidity mixing ratio" }
inputs = [
  { identifier = "t", kind = "CelsiusTemperature", unit = "DEG_C", description = "Air (dry-bulb) temperature" },
  { identifier = "t_i", kind = "IceBulbTemperature", unit = "DEG_C", description = "Wet-bulb temperature below freezing, the bulb covered with ice" },
  { identifier = "W_s", kind = "SaturationMixingRatioOverIce", unit = "KiloGM-PER-KiloGM", description = "Saturation mixing ratio over ice at the bulb temperature and the pressure of the air" },
]
keywords = ["humidity", "psychrometrics", "ice bulb"]

