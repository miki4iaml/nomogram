[formulations.bechtold2015_equivalent_potential_temperature]
label = "Equivalent potential temperature, reversible (Bechtold 2015)"
expression = "T * (p_0 / p) ** (R_d / (c_pd + r_w * c_l)) * exp(L_v * r / ((c_pd + r_w * c_l) * T))"
fixed_units = false
conditions = "Strictly, T in the exponential is the temperature at the isentropic condensation level; the actual temperature is very often used (section 9.3)."
note = "c_pd + r_w c_l is the heat capacity of moist air containing liquid water, often replaced by c_pd, as for a pseudo-adiabat (section 9.3)."
output = { identifier = "theta_e", kind = "EquivalentPotentialTemperature", unit = "K", description = "Equivalent potential temperature" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Temperature" },
  { identifier = "p", kind = "Pressure", unit = "HectoPA", description = "Pressure" },
  { identifier = "r", kind = "MassRatioOfWaterVapourToDryGas", unit = "KiloGM-PER-KiloGM", description = "Humidity mixing ratio" },
  { identifier = "r_w", kind = "MassRatioOfTotalWaterToDryGas", unit = "KiloGM-PER-KiloGM", description = "Total water mixing ratio" },
  { identifier = "L_v", kind = "SpecificLatentHeatOfVaporization", unit = "J-PER-KiloGM", description = "Specific latent heat of vaporisation" },
]
constants = ["R_d_bechtold2015", "c_pd_bechtold2015", "c_l_ecmwf_ifs", "p_0_bechtold2015"]
assumptions = [
  { text = "Integrating equation 44 into this form leaves the term r R_v out of the exponent R_d / c_p, and holds T constant in the latent heat term.", status = "deduced" },
]
keywords = ["potential temperature", "equivalent potential temperature", "latent heat"]

