# Atmospheric thermodynamics of Bechtold (2015), ECMWF training notes:
# humidity variables, virtual and potential temperatures, saturation.

[formulations.bechtold2015_specific_humidity_from_vapour_pressure]
label = "Specific humidity from vapour pressure (Bechtold 2015)"
expression = "epsilon * e / (p - (1 - epsilon) * e)"
fixed_units = false
output = { identifier = "q", kind = "SpecificHumidity", unit = "KiloGM-PER-KiloGM", description = "Specific humidity" }
inputs = [
  { identifier = "e", kind = "VapourPressure", unit = "PA", description = "Vapour pressure" },
  { identifier = "p", kind = "Pressure", unit = "PA", description = "Pressure of moist air" },
]
constants = ["epsilon_bechtold2015"]
keywords = ["humidity"]

[[formulations.bechtold2015_specific_humidity_from_vapour_pressure.citations]]
reference = "bechtold2015"
note = "Table 1 (p. 4)."
assumptions = ["Dry air and water vapour as ideal gases, the vapour pressure being their partial pressure (equations 4 and 6)."]

[formulations.bechtold2015_mixing_ratio_from_vapour_pressure]
label = "Humidity mixing ratio from vapour pressure (Bechtold 2015)"
expression = "epsilon * e / (p - e)"
fixed_units = false
output = { identifier = "r", kind = "MassRatioOfWaterVapourToDryGas", unit = "KiloGM-PER-KiloGM", description = "Humidity mixing ratio" }
inputs = [
  { identifier = "e", kind = "VapourPressure", unit = "PA", description = "Vapour pressure" },
  { identifier = "p", kind = "Pressure", unit = "PA", description = "Pressure of moist air" },
]
constants = ["epsilon_bechtold2015"]
keywords = ["humidity"]

[[formulations.bechtold2015_mixing_ratio_from_vapour_pressure.citations]]
reference = "bechtold2015"
note = "Table 1 (p. 4)."
assumptions = ["Dry air and water vapour as ideal gases, the vapour pressure being their partial pressure (equations 4 and 6)."]

[formulations.bechtold2015_virtual_temperature_definition]
label = "Virtual temperature, from the density and pressure of moist air (Bechtold 2015)"
nature = "definition"
expression = "p / (rho * R_d)"
fixed_units = false
note = "The temperature dry air would need to have the density of the moist air at the same pressure."
output = { identifier = "T_v", kind = "VirtualTemperature", unit = "K", description = "Virtual temperature" }
inputs = [
  { identifier = "p", kind = "Pressure", unit = "PA", description = "Pressure of moist air" },
  { identifier = "rho", kind = "DensityOfMoistAir", unit = "KiloGM-PER-M3", description = "Density of moist air" },
]
constants = ["R_d_bechtold2015"]
keywords = ["virtual temperature", "density"]

[[formulations.bechtold2015_virtual_temperature_definition.citations]]
reference = "bechtold2015"
equation = "23"

[formulations.bechtold2015_virtual_temperature]
label = "Virtual temperature from the temperature and the specific humidity (Bechtold 2015)"
expression = "T * (1 + (1 - epsilon) / epsilon * q)"
fixed_units = false
output = { identifier = "T_v", kind = "VirtualTemperature", unit = "K", description = "Virtual temperature" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Temperature of moist air" },
  { identifier = "q", kind = "SpecificHumidity", unit = "KiloGM-PER-KiloGM", description = "Specific humidity" },
]
constants = ["epsilon_bechtold2015"]
keywords = ["virtual temperature", "humidity"]

[[formulations.bechtold2015_virtual_temperature.citations]]
reference = "bechtold2015"
equation = "25"
notation = { q = "q_v" }
assumptions = ["Dry air and water vapour as ideal gases, the gas constant of moist air being their mass-weighted mean, q R_v + (1 - q) R_d (equations 4, 20 and 24)."]

[formulations.bechtold2015_virtual_temperature_mixing_ratio]
label = "Virtual temperature from the temperature and the mixing ratio (Bechtold 2015)"
expression = "T * (1 + (1 - epsilon) * r / (epsilon * (1 + r)))"
fixed_units = false
output = { identifier = "T_v", kind = "VirtualTemperature", unit = "K", description = "Virtual temperature" }
inputs = [
  { identifier = "T", kind = "ThermodynamicTemperature", unit = "K", description = "Temperature of moist air" },
