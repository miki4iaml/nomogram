# The mixing ratio from the wet-bulb temperature, ASHRAE Handbook -
# Fundamentals (2017), chapter 1, equations 33 and 35, as PsychroLib codes
# them (GetHumRatioFromTWetBulb, SI branch).

[formulations.ashrae2017_mixing_ratio_from_wet_bulb]
label = "Humidity mixing ratio from a wet bulb above freezing (ASHRAE 2017)"
expression = "((A - B * t_w) * W_s - C * (t - t_w)) / (A + D * t - E * t_w)"
fixed_units = true
note = "In kJ kg-1 and kJ kg-1 K-1, A is the latent heat of vaporization at 0 degC, C and D the specific heats of dry air and water vapour, E that of liquid water, and B = E - D. It is WMO-No. 8 4.A.19 solved for the mixing ratio, with these values and the latent heat A - B t_w (algebra by nomogram). PsychroLib applies it for a wet bulb at or above 0 degC, and equation 35 below."
output = { identifier = "W", kind = "MassRatioOfWaterVapourToDryGas", unit = "KiloGM-PER-KiloGM", description = "Humidity mixing ratio" }
inputs = [
  { identifier = "t", kind = "CelsiusTemperature", unit = "DEG_C", description = "Air (dry-bulb) temperature" },
  { identifier = "t_w", kind = "WetBulbTemperature", unit = "DEG_C", description = "Wet-bulb temperature" },
  { identifier = "W_s", kind = "SaturationMixingRatioOverWater", unit = "KiloGM-PER-KiloGM", description = "Saturation mixing ratio at the wet-bulb temperature and the pressure of the air" },
]
keywords = ["humidity", "psychrometrics", "wet bulb"]

[formulations.ashrae2017_mixing_ratio_from_wet_bulb.coefficients]
A = { value = 2501.0, unit = "KiloJ-PER-KiloGM", unit_basis = "added", note = "the unit of the SI form, kJ kg-1 or kJ kg-1 K-1, written by nomogram: the source prints numbers" }
B = { value = 2.326, unit = "KiloJ-PER-KiloGM-K", unit_basis = "added", note = "the unit of the SI form, kJ kg-1 or kJ kg-1 K-1, written by nomogram: the source prints numbers" }
