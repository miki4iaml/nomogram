# Integration continue : reprend les controles locaux (pre-commit) et
# execute les tests sur la matrice complete, bloquante, Ubuntu et
# Windows x Python 3.12 et 3.13.
#
# Actions epinglees par empreinte de commit (impose par le depot) ;
# mises a jour par Dependabot.

name: CI

on:
  pull_request:
    branches: [develop, main, "release/**"]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualite:
    name: qualite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.12.18"
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --frozen

      # no-commit-to-branch echouerait sur un push vers develop ou main ;
      # les rulesets du depot assurent deja cette protection.
      - name: pre-commit (stade pre-commit)
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch

      - name: pre-commit (stade pre-push, mypy et pytest)
        run: uv run --frozen pre-commit run --hook-stage pre-push --all-files

  # La fusion par squash produit un commit signe par GitHub : la regle
  # de signature des rulesets ne voit donc pas les commits de la PR.
  # Ce job exige que chacun d'eux soit signe et verifie par GitHub.
  signatures:
    name: signatures
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Commits de la PR signes et verifies
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          non_verifies=$(gh api --paginate "repos/$REPO/pulls/$PR/commits" \
            --jq '.[] | select(.commit.verification.verified | not) | .sha[0:7]')
          if [ -n "$non_verifies" ]; then
            echo "::error::Commits non signes ou non verifies : $non_verifies"
            exit 1
          fi
          echo "Tous les commits de la PR sont signes et verifies."

  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.12.18"
          python-version: ${{ matrix.python }}
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run --frozen pytest
