# Weekly updates, pull requests against develop, squash merge after
# review. Dependabot commits are signed by GitHub.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
